<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>REVOLUTION IPL 2026</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Revo IPL">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #f1c40f; 
            --bg-void: #020617;
            --glass: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-cyber: 'Orbitron', sans-serif;
            --text1: #f8fafc; --text2: #cbd5e1; --text3: #94a3b8; --text4: #64748b;
        }

        body.light {
            --bg-void: #f1f5f9;
            --glass: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text1: #0f172a; --text2: #334155; --text3: #475569; --text4: #94a3b8;
        }

        body {
            background: var(--bg-void);
            color: var(--text1);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.4s, color 0.4s;
        }

        /* High-End Background Mesh */
        .mesh-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 0% 0%, rgba(30, 58, 138, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, rgba(241, 196, 15, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, var(--bg-void) 0%, var(--bg-void) 100%);
            transition: background 0.4s;
        }

        body.light .mesh-bg {
            background: 
                radial-gradient(circle at 0% 0%, rgba(59, 130, 246, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(245, 158, 11, 0.1) 0%, transparent 50%);
        }

        /* Staggered Entry Animation */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px) scale(0.97); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .stagger-item {
            opacity: 0;
            animation: slideUpFade 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Component Styles */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .aura-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, var(--owner-color, transparent) 0%, transparent 70%);
            opacity: 0.15;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .glass-panel:hover .aura-glow { opacity: 0.25; }

        /* Navigation Dock */
        .nav-dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 420px;
            background: var(--glass);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            padding: 6px;
            border-radius: 32px;
            display: flex;
            justify-content: space-around;
            z-index: 2000;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        }
        body.light .nav-dock { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1); }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 8px 10px;
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text4);
        }

        .nav-item.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 4px 16px rgba(241, 196, 15, 0.3);
        }

        .nav-icon { font-size: 18px; }
        .nav-label { font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; font-family: var(--font-cyber); }

        /* Typography & Effects */
        .font-cyber { font-family: var(--font-cyber); }
        .gold-glow {
            background: linear-gradient(90deg, #f1c40f, #fff7ad, #f1c40f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }
        body.light .gold-glow { background: #b8860b; -webkit-text-fill-color: #b8860b; }

        @keyframes shimmer { to { background-position: 200% center; } }

        .active-scale:active { transform: scale(0.96); }

        /* Custom Scroll */
        ::-webkit-scrollbar { width: 0px; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        /* Pillar Podium */
        .pillar {
            height: 0;
            width: 100%;
            border-radius: 12px 12px 4px 4px;
            background: linear-gradient(to top, var(--p-color) 30%, transparent);
            opacity: 0.2;
            transition: height 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        body.light .pillar { opacity: 0.4; }

        /* Squad Toggle Animation */
        .squad-container { display: none; padding: 0 20px 20px; border-top: 1px solid var(--glass-border); }
        .squad-container.open { display: block; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }

        .player-row-ghost { opacity: 0.3; filter: grayscale(1); }

        /* Badge/Tags */
        .role-tag { font-size: 7px; padding: 2px 6px; border-radius: 5px; background: rgba(255,255,255,0.05); color: var(--text3); text-transform: uppercase; font-weight: 700; margin-left: 5px; }
        body.light .role-tag { background: rgba(0,0,0,0.05); }

        /* Specific Status Indicators */
        @keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
        .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; margin-left: 6px; flex-shrink: 0; animation: livePulse 1.2s ease-in-out infinite; box-shadow: 0 0 7px #4ade80; }

        /* Splash */
        #splash {
            position: fixed; inset: 0; z-index: 9999;
            background: var(--bg-void);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        #splash.hide { opacity: 0; transform: scale(1.05); pointer-events: none; }

        /* Utilities */
        .error-banner { background:rgba(220,38,38,0.1); border:1px solid rgba(220,38,38,0.3); border-radius:16px; padding:12px 16px; margin-bottom:14px; display:flex; align-items:center; gap:12px; }
        .sched-pill { font-family: var(--font-cyber); font-size: 9px; font-weight: 900; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--glass-border); background: var(--glass); color: var(--text3); cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .sched-pill.active { transform: scale(1.05); box-shadow: 0 0 12px -2px currentColor; opacity: 1!important; }
        .share-btn { font-size: 8px; font-family: var(--font-cyber); font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: var(--text1); transition: 0.2s; cursor: pointer; }
        body.light .share-btn { border-color: rgba(0,0,0,0.1); background: rgba(0,0,0,0.05); }
        .today-glow { border-color: rgba(241, 196, 15, 0.5) !important; background: rgba(241, 196, 15, 0.08) !important; box-shadow: 0 0 20px rgba(241, 196, 15, 0.15); }
    </style>
</head>
<body class="p-4 pb-32">
    <div class="mesh-bg"></div>
    <div id="search-overlay" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[2000] transition-opacity duration-300"></div>

    <!-- SPLASH SCREEN -->
    <div id="splash" onclick="dismissSplash()">
        <p class="text-[10px] font-cyber tracking-[0.5em] text-[var(--text4)] uppercase mb-8">IPL Fantasy League</p>
        <h1 class="text-7xl font-main font-black italic gold-glow tracking-tighter">REVO</h1>
        <div class="w-16 h-[1px] bg-yellow-500/30 my-8"></div>
        <p class="text-[9px] font-cyber tracking-[0.3em] text-[var(--text3)] animate-pulse uppercase cursor-pointer">Loading Data...</p>
        <p class="text-[8px] font-bold text-[var(--text4)] uppercase tracking-widest absolute bottom-8">Designed by Vedant Bhansali</p>
    </div>

    <div class="max-w-xl mx-auto">
        <!-- HEADER -->
        <header id="main-header" class="stagger-item relative transition-all duration-300" style="animation-delay: 0.1s">
            <div class="flex justify-between items-start mb-5 gap-2">
                <div class="flex-1">
                    <p class="text-[9px] font-bold tracking-[0.4em] text-[var(--text4)] uppercase mb-1">Season 2026</p>
                    <h1 class="text-3xl sm:text-4xl font-black font-cyber italic gold-glow leading-tight tracking-tighter">REVOLUTION</h1>
                </div>
                <div class="flex flex-col items-end gap-2 flex-shrink-0">
                    <div id="match-counter" class="text-[9px] font-black text-yellow-500 font-cyber opacity-80 tracking-widest text-right mt-1">MATCHES: —/74</div>
                    <button onclick="toggleTheme()" id="theme-toggle" class="w-8 h-8 rounded-full glass-panel flex items-center justify-center text-xs active-scale">🌙</button>
                </div>
            </div>

            <!-- SEARCH BAR -->
            <div class="relative mb-5" id="search-container">
                <input id="player-search" type="text" placeholder="Search player or owner..." 
                    oninput="onSearchInput(this.value)" onfocus="showSearchOverlay(); onSearchInput(this.value)"
                    class="w-full glass-panel py-3.5 pl-11 pr-4 text-xs font-semibold outline-none focus:border-yellow-500/40 transition-all placeholder:text-[var(--text4)] bg-transparent text-[var(--text1)] shadow-sm">
                <svg class="absolute left-4 top-1/2 -translate-y-1/2 opacity-30 text-[var(--text1)]" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <div id="search-dropdown" class="hidden absolute top-full left-0 right-0 mt-2 glass-panel max-h-64 overflow-y-auto shadow-2xl"></div>
            </div>
        </header>

        <!-- DISCOVERY SCROLL -->
        <div id="discovery-tabs" class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1 mb-6 stagger-item relative" style="animation-delay: 0.15s">
            <button onclick="switchTab('hof')" id="btn-hof" class="flex-shrink-0 px-4 py-2.5 glass-panel whitespace-nowrap text-[9px] font-black uppercase tracking-widest active-scale text-[var(--text2)]">🏆 Hall of Fame</button>
            <button onclick="switchTab('gems')" id="btn-gems" class="flex-shrink-0 px-4 py-2.5 glass-panel whitespace-nowrap text-[9px] font-black uppercase tracking-widest active-scale text-[var(--text2)]">💎 Unsold Gems</button>
            <button onclick="switchTab('weekly')" id="btn-weekly" class="flex-shrink-0 px-4 py-2.5 glass-panel whitespace-nowrap text-[9px] font-black uppercase tracking-widest active-scale text-[var(--text2)]">📊 Weekly Recap</button>
            <button onclick="switchTab('strategy')" id="btn-strat" class="flex-shrink-0 px-4 py-2.5 glass-panel whitespace-nowrap text-[9px] font-black uppercase tracking-widest active-scale text-[var(--text2)]">🎯 Luckiest</button>
            <button onclick="switchTab('h2h')" id="btn-h2h" class="flex-shrink-0 px-4 py-2.5 glass-panel whitespace-nowrap text-[9px] font-black uppercase tracking-widest active-scale text-[var(--text2)]">⚔️ Head-to-Head</button>
        </div>

        <div id="error-banner" class="error-banner hidden relative z-10">
            <div class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></div>
            <div class="flex-1">
                <p class="text-[10px] font-black uppercase tracking-widest text-red-400 mb-0.5">Sync Failed</p>
                <p id="error-msg" class="text-[9px] text-red-300 opacity-80">Retrying in 60s...</p>
            </div>
            <button onclick="updateApp()" class="text-[9px] font-black uppercase tracking-widest text-red-400 border border-red-500/30 rounded-lg px-3 py-1.5 active-scale">Retry</button>
        </div>

        <!-- MAIN VIEWS -->
        <div id="view-main" class="space-y-4 pb-8 relative z-10">
            <div id="today-match-bar"></div>
            <div id="top3-strip" class="flex items-end gap-2 px-1 min-h-[140px]"></div>
            <div id="mvp-spotlight"></div>
            <div id="last-match-collapsible"></div>
            <div id="leaderboard" class="space-y-3"></div>
        </div>

        <div id="view-livepoints" class="hidden space-y-4 pb-8 relative z-10">
            <div id="live-points-list"></div>
        </div>

        <div id="view-schedule" class="hidden space-y-4 pb-8 relative z-10">
            <div id="schedule-filters" class="flex flex-wrap gap-2 justify-center mb-2 px-1"></div>
            <div id="sched-stats" class="flex justify-center gap-4 mt-2 mb-4"></div>
            <div id="schedule-list" class="space-y-3"></div>
        </div>

        <div id="view-standings" class="hidden space-y-4 pb-8 relative z-10"><div id="standings-list"></div></div>
        <div id="view-hof" class="hidden space-y-4 pb-8 relative z-10"><div id="hof-list"></div></div>
        <div id="view-gems" class="hidden space-y-4 pb-8 relative z-10"><div id="gems-list"></div></div>
        <div id="view-weekly" class="hidden space-y-4 pb-8 relative z-10">
            <div id="streak-tracker"></div>
            <div id="weekly-list" class="space-y-3 mt-4"></div>
        </div>
        <div id="view-strategy" class="hidden space-y-4 pb-8 relative z-10"><div id="strategy-list" class="space-y-3"></div></div>
        
        <div id="view-h2h" class="hidden space-y-4 pb-8 relative z-10">
            <div class="glass-panel p-4 mb-3">
                <p class="font-cyber text-[8px] font-black tracking-widest text-[var(--text4)] uppercase mb-3 text-center">Tactical Matchup</p>
                <div class="flex items-center gap-2">
                    <select id="h2h-p1" onchange="updateH2H()" class="flex-1 bg-[var(--bg-void)] border border-[var(--glass-border)] rounded-lg p-2 text-[10px] sm:text-xs font-bold text-[var(--text1)] outline-none appearance-none text-center"></select>
                    <span class="font-cyber text-[10px] font-black text-[var(--text4)]">VS</span>
                    <select id="h2h-p2" onchange="updateH2H()" class="flex-1 bg-[var(--bg-void)] border border-[var(--glass-border)] rounded-lg p-2 text-[10px] sm:text-xs font-bold text-[var(--text1)] outline-none appearance-none text-center"></select>
                </div>
            </div>
            <div id="h2h-content"></div>
        </div>
    </div>

    <!-- NAVIGATION DOCK -->
    <nav class="nav-dock">
        <button onclick="switchTab('main')" id="nav-main" class="nav-item active active-scale flex-1">
            <span class="nav-icon">📊</span><span class="nav-label">Ranks</span>
        </button>
        <button onclick="switchTab('livepoints')" id="nav-livepoints" class="nav-item active-scale relative flex-1">
            <span class="nav-icon">🔴</span><span class="nav-label">Live</span>
            <span id="live-tab-dot" class="hidden absolute top-2 right-4 w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981] animate-pulse"></span>
        </button>
        <button onclick="switchTab('schedule')" id="nav-schedule" class="nav-item active-scale flex-1">
            <span class="nav-icon">🗓️</span><span class="nav-label">Events</span>
        </button>
        <button onclick="switchTab('standings')" id="nav-standings" class="nav-item active-scale flex-1">
            <span class="nav-icon">🏟️</span><span class="nav-label">Table</span>
        </button>
    </nav>

    <!-- SCROLL TO TOP -->
    <button id="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})"
        class="hidden fixed bottom-24 right-4 z-[500] w-10 h-10 rounded-full glass-panel flex items-center justify-center text-yellow-500 font-bold shadow-lg active-scale border-yellow-500/30">↑</button>

    <script>
        const SHEET_ID = '1xIRCNr0tteFfMk6l7inIkKeSJMb7WLBswsXepHRqjio';
        const TOTAL_SEASON_MATCHES = 74;
        const SITE_URL = 'revolution-ipl-2026.vercel.app';

        const ownerColors = {
            vedant:'#3498db',deep:'#e74c3c',shlok:'#2ecc71',rahul:'#9b59b6',
            soni:'#f1c40f',dheer:'#e67e22',kunal:'#1abc9c',puneet:'#ff9f43',
            vivek:'#54a0ff',bokaria:'#5f27cd',prakshal:'#48dbfb',rishi:'#ff6b6b',
            aamer:'#1dd1a1',yashshah:'#f368e0',jash:'#e67e22',
        };

        const IPL_TEAMS = {
            MI:{color:'#004BA0',accent:'#89CFF0'},CSK:{color:'#F4C430',accent:'#ffffff'},
            RCB:{color:'#C8102E',accent:'#FFD700'},KKR:{color:'#3A225D',accent:'#B8960C'},
            SRH:{color:'#F26522',accent:'#1a1a1a'},DC:{color:'#00529A',accent:'#E8001C'},
            PBKS:{color:'#ED1C24',accent:'#DCDDDF'},RR:{color:'#EA1A85',accent:'#254AA5'},
            GT:{color:'#1D4E89',accent:'#C8A84B'},LSG:{color:'#A4D65E',accent:'#1a1a1a'},
        };
        const TEAM_COLORS = { RCB:'#C8102E', MI:'#004BA0', CSK:'#F4C430', KKR:'#3A225D', SRH:'#F26522', RR:'#EA1A85', PBKS:'#ED1C24', GT:'#1D4E89', LSG:'#A4D65E', DC:'#00529A', TBD:'#64748b' };

        // Translates full names from Schedule to matching acronyms in Roster
        function getShortTeam(name) {
            if (!name) return '';
            const n = name.toString().toUpperCase().trim();
            if (n.includes('MUMBAI')) return 'MI';
            if (n.includes('CHENNAI')) return 'CSK';
            if (n.includes('ROYAL CHALLENGERS')) return 'RCB';
            if (n.includes('KOLKATA')) return 'KKR';
            if (n.includes('SUNRISERS')) return 'SRH';
            if (n.includes('DELHI')) return 'DC';
            if (n.includes('PUNJAB')) return 'PBKS';
            if (n.includes('RAJASTHAN')) return 'RR';
            if (n.includes('GUJARAT')) return 'GT';
            if (n.includes('LUCKNOW')) return 'LSG';
            if (TEAM_COLORS[n]) return n;
            
            const acr = n.split(/[\s_]+/).map(w=>w[0]).join('');
            return acr === 'PK' ? 'PBKS' : acr;
        }

        const fixID = s => s ? s.toString().toLowerCase().trim() : '';
        function getColor(raw) {
            const n = fixID(raw);
            if (ownerColors[n]) return ownerColors[n];
            for (const w of n.split(/\s+/)) if (ownerColors[w]) return ownerColors[w];
            if (ownerColors[n.replace(/\s/g,'')]) return ownerColors[n.replace(/\s/g,'')];
            return '#64748b';
        }

        function dismissSplash() { 
            const s=document.getElementById('splash'); 
            if(s) { s.classList.add('hide'); setTimeout(()=>s.remove(),900); }
        }

        let _currentTab = 'main';
        function switchTab(t) {
            // Main Dock
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
            const navBtn = document.getElementById('nav-' + (['hof','gems','weekly','strategy','h2h'].includes(t) ? 'main' : t));
            if (navBtn) navBtn.classList.add('active');

            // Top Header Pills
            document.querySelectorAll('#discovery-tabs .glass-panel').forEach(el => {
                if(el.id && el.id.startsWith('btn-')) el.style.borderColor = 'var(--glass-border)';
            });
            const pillBtn = document.getElementById('btn-' + (t==='strategy'?'strat':t));
            if(pillBtn) pillBtn.style.borderColor = 'var(--accent)';

            const views = {main:'view-main', livepoints:'view-livepoints', schedule:'view-schedule', standings:'view-standings', hof:'view-hof', gems:'view-gems', weekly:'view-weekly', strategy:'view-strategy', h2h:'view-h2h'};
            
            Object.keys(views).forEach(k => {
                const el = document.getElementById(views[k]);
                if(!el) return;
                if(k === t) {
                    el.classList.remove('hidden');
                    // Retrigger animations
                    el.querySelectorAll('.stagger-item').forEach((item, idx) => {
                        item.style.animation = 'none';
                        item.offsetHeight;
                        item.style.animation = `slideUpFade 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) ${idx * 0.05}s forwards`;
                    });
                } else {
                    el.classList.add('hidden');
                }
            });
            _currentTab = t;
            if(typeof hideSearchOverlay === 'function') hideSearchOverlay();
            if(t!=='main') window.scrollTo({top:0, behavior:'smooth'});
        }

        function toggleTheme() {
            const isLight = document.body.classList.toggle('light');
            localStorage.setItem('revo-theme', isLight ? 'light' : 'dark');
            document.getElementById('theme-toggle').textContent = isLight ? '☀️' : '🌙';
        }
        if (localStorage.getItem('revo-theme') === 'light') { document.body.classList.add('light'); document.getElementById('theme-toggle').textContent = '☀️'; }

        let _state = {squads:{}, cumulScores:{}, completedMatches:[], active:[]};

        async function fetchSheet(name) {
            const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=0&sheet=${encodeURIComponent(name)}`;
            const r=await fetch(url);
            if(!r.ok) throw new Error(`HTTP Error: ${r.status} on sheet ${name}`);
            const t=await r.text();
            
            try {
                // Bulletproof JSON extraction: Grabs everything between the first '{' and last '}'
                const startIdx = t.indexOf('{');
                const endIdx = t.lastIndexOf('}');
                
                if (startIdx === -1 || endIdx === -1) {
                    if (t.toLowerCase().includes('<html')) {
                        throw new Error(`Access Denied! Ensure the Google Sheet is set to "Anyone with the link can view".`);
                    }
                    throw new Error(`Invalid data format received from sheet: ${name}`);
                }
                
                const jsonStr = t.substring(startIdx, endIdx + 1);
                const j = JSON.parse(jsonStr);
                
                if (j.status === 'error') {
                    throw new Error(`Google Sheets Error on "${name}": ${j.errors?.[0]?.message || 'Check tab name'}`);
                }
                if (!j.table || !j.table.rows) return [];
                
                return j.table.rows.map(row => row.c.map(cell => cell ? (cell.v !== null ? cell.v : '') : ''));
            } catch(e) {
                console.error(`Parse Error on sheet "${name}":`, e);
                throw e; // Rethrow so the UI catches it and displays the specific error
            }
        }

        function showError(msg) { document.getElementById('error-msg').textContent=msg; document.getElementById('error-banner').classList.remove('hidden'); }
        function hideError() { document.getElementById('error-banner').classList.add('hidden'); }

        async function updateApp() {
            hideError();
            try {
                const [lbRows, rosRows, pcRows, schedRows, standRows, liveRows] = await Promise.all([
                    fetchSheet('Leaderboard'), fetchSheet('Roster'), fetchSheet('PointsCalc'),
                    fetchSheet('Schedule').catch(()=>[]), fetchSheet('Standings').catch(()=>[]), fetchSheet('Livescore').catch(()=>[])
                ]);

                const completedMatches = [...new Set(pcRows.filter(r=>r[0]&&parseFloat(r[6])>0).map(r=>r[0].toString().trim()))];
                document.getElementById('match-counter').innerText = `MATCHES: ${completedMatches.length}/${TOTAL_SEASON_MATCHES}`;

                const pPoints={};
                pcRows.forEach(row=>{
                    if(!row[1]) return;
                    const k=fixID(row[1]), v=parseFloat(row[6])||0, m=parseFloat(row[5])||1;
                    if(!pPoints[k]) pPoints[k]={act:0,raw:0};
                    pPoints[k].act+=v; pPoints[k].raw+=(v/m);
                });

                let matchPlayers=[], lastMatchName='';
                if(pcRows.length){
                    lastMatchName=pcRows[pcRows.length-1][0];
                    pcRows.forEach(r=>{if(r[0]===lastMatchName) matchPlayers.push({name:r[1],pts:parseFloat(r[6])||0,owner:r[2]});});
                }

                const squads={};
                rosRows.forEach(row=>{
                    const oKey=fixID(row[1]);
                    if(!oKey||oKey.includes('owner')) return;
                    if(!squads[oKey]) squads[oKey]=[];
                    const stats=pPoints[fixID(row[0])]||{act:0,raw:0};
                    squads[oKey].push({name:row[0], team:row[4], role:row[6], act:Math.round(stats.act), raw:stats.raw, cvc:parseFloat(row[2])===2?'C':parseFloat(row[2])===1.5?'VC':''});
                });

                let owners=lbRows.map(row=>{
                    const full=row[0]?row[0].toString().trim():'';
                    const id=full.toLowerCase();
                    if(!full||['owner name','owner','name'].includes(id)) return null;
                    return {full, score:Math.round(parseFloat(row[1]))||0, id, first:full.split(' ')[0]};
                }).filter(Boolean);

                const active=owners.filter(o=>o.id!=='unsold').sort((a,b)=>b.score-a.score);
                const unsold=owners.find(o=>o.id==='unsold');
                const allOwners=unsold?[...active,unsold]:active;
                const cumulScores=buildCumulScores(active,pcRows,completedMatches);
                
                _state={squads, cumulScores, completedMatches, rosRows, pPoints, pcRows, active, schedRows};

                renderTop3(active);
                renderLeaderboard(allOwners, squads);
                renderMVPMerged(matchPlayers.sort((a,b)=>b.pts-a.pts)[0], lastMatchName, active, pcRows, completedMatches);
                renderLastMatchCollapsible(active, pcRows, completedMatches);
                renderStreakTracker(active, cumulScores, completedMatches);
                renderStrategy(active, squads);
                renderH2HDropdowns(active);
                
                if(schedRows&&schedRows.length){ window._schedRows=schedRows; renderSchedule(schedRows); renderScheduleFilters(); }
                renderTodayBar(schedRows||[]);
                renderWeekly(active, pcRows, completedMatches, squads);
                renderStandings(standRows||[]);
                renderHallOfFame(active, pcRows, completedMatches);
                renderGems(rosRows, pPoints);
                renderLivePoints(liveRows||[]);

                if(!window._confettiFired && active.length > 0) { window._confettiFired=true; setTimeout(fireConfetti,800); }
                dismissSplash(); // Auto dismiss splash when data loads

            } catch(e) {
                console.error('Sync Error:', e);
                // Now displays the exact specific error to help you debug the sheet
                showError(e.message || 'Could not sync with live sheet. Auto-retrying...');
                dismissSplash(); // Dismiss even if it fails, so they can see the error
            }
        }

        function buildCumulScores(owners,pcRows,completedMatches) {
            const cumul={}, running={};
            owners.forEach(o=>{cumul[o.id]=[];running[o.id]=0;});
            const nameToId={};
            owners.forEach(o=>{nameToId[fixID(o.full)]=o.id;nameToId[fixID(o.first)]=o.id;nameToId[o.id]=o.id;});
            completedMatches.forEach(matchName=>{
                const totals={};
                pcRows.filter(r=>r[0]&&r[0].toString().trim()===matchName&&r[2]).forEach(r=>{
                    const raw=fixID(r[2]);
                    const id=nameToId[raw]||owners.find(o=>raw.includes(o.id)||o.id.includes(raw))?.id;
                    if(!id) return;
                    totals[id]=(totals[id]||0)+(parseFloat(r[6])||0);
                });
                owners.forEach(o=>{running[o.id]+=(totals[o.id]||0);cumul[o.id].push(Math.round(running[o.id]));});
            });
            return cumul;
        }

        function renderStreakTracker(owners, cumulScores, completedMatches) {
            const el = document.getElementById('streak-tracker');
            if (!el || completedMatches.length === 0) return;
            const leadCount = {}; owners.forEach(o => leadCount[o.id] = 0);
            
            for (let m = 0; m < completedMatches.length; m++) {
                let best=-1, bestId=null;
                owners.forEach(o => { const s=(cumulScores[o.id]||[])[m]||0; if(s>best){best=s;bestId=o.id;} });
                if (bestId) leadCount[bestId]++;
            }

            const leader = [...owners].sort((a,b) => b.score-a.score)[0];
            let streak = 0;
            if (leader) {
                for (let m = completedMatches.length-1; m >= 0; m--) {
                    let best=-1, bestId=null;
                    owners.forEach(o => { const s=(cumulScores[o.id]||[])[m]||0; if(s>best){best=s;bestId=o.id;} });
                    if (bestId === leader.id) streak++; else break;
                }
            }
            
            const sorted = [...owners].sort((a,b) => (leadCount[b.id]||0)-(leadCount[a.id]||0));
            const lc = leader ? getColor(leader.id) : '#f1c40f';

            el.innerHTML = `
                <div class="glass-panel p-5">
                    <p class="font-cyber text-[8px] font-black tracking-widest text-[var(--text4)] uppercase mb-4">Streak Tracker</p>

                    <div class="flex justify-between items-center mb-4 pb-4 border-b border-[var(--glass-border)]">

                        </div>
                        <div class="text-right">
                            <p class="font-cyber text-2xl font-black leading-none" style="color:${lc}">${streak}</p>

                    </div>` : ''}
                    <div class="space-y-2.5">
                        ${sorted.slice(0,5).map((o,i) => {

                                <span class="text-[9px] font-bold uppercase w-14 truncate text-[var(--text2)]">${o.first}</span>
                                <div class="flex-1 h-1 bg-[var(--glass-border)] rounded-full overflow-hidden">
                                    <div class="h-full rounded-full" style="width:${pct}%; background:${c}"></div>
                                </div>
                                <span class="font-cyber text-[9px] font-black w-6 text-right" style="color:${c}">${cnt}d</span>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
        }

        function renderWeekly(active, pcRows, completedMatches, squads) {
            const el = document.getElementById('weekly-list');
            if (!el || !completedMatches.length) return;
            const last7 = completedMatches.slice(-7), all = completedMatches;
            const weeklyData = active.map(o => {
                let weekPts=0, bestPlayer=null, bestPts=0;
                pcRows.forEach(r => {
                    if (!r[1]||!r[2]) return;
                    const ownerRaw = fixID(r[2]);
                    const isOwner = ownerRaw===o.id || ownerRaw.includes(o.id.split(' ')[0]) || o.id.includes(ownerRaw.split(' ')[0]);
                    if (!isOwner) return;
                    const pts = parseFloat(r[6])||0, match = r[0]?r[0].toString().trim():'';
                    if (last7.includes(match)) { weekPts+=pts; if(pts>bestPts){bestPts=pts;bestPlayer=r[1];} }
                });
                const avgMatch = all.length>0 ? o.score/all.length : 0;
                const weekAvg = last7.length>0 ? weekPts/last7.length : 0;
                const trend = weekAvg>avgMatch ? 'hot' : weekAvg<avgMatch*0.8 ? 'cold' : 'steady';
                return {...o, weekPts:Math.round(weekPts), avgMatch:Math.round(avgMatch), weekAvg:Math.round(weekAvg), trend, bestPlayer, bestPts:Math.round(bestPts)};
            }).sort((a,b) => b.weekPts-a.weekPts);

            el.innerHTML = `

                    <p class="font-cyber text-[8px] font-black tracking-widest text-[var(--text4)] uppercase mb-1">Form Guide</p>

                    return `
                    <div class="glass-panel p-4 mb-2 stagger-item" style="border-left: 3px solid ${color}">
                        <div class="flex justify-between items-start mb-3">
                            <div class="flex items-center gap-2.5">
                                <span class="font-cyber text-sm font-black" style="color:${i===0?color:'var(--text4)'}">${i===0?'👑':i+1}</span>
                                <div>
                                    <p class="font-cyber text-xs font-black text-[var(--text1)] uppercase">${d.first}</p>
                                    <p class="text-[9px] font-bold text-[var(--text4)] mt-1">${tIcon} <span style="color:${tColor}">${d.trend.toUpperCase()}</span> · ${d.weekAvg} avg</p>
                                </div>
                            </div>
                            <div class="text-right">
                                <p class="font-cyber text-xl font-black" style="color:${color}">${d.weekPts}</p>
                                <p class="text-[7px] font-black text-[var(--text4)] uppercase">7-match pts</p>
                            </div>
                        </div>
                        <div>

        const SCHEDULE = [
            {m:1, date:'28 Mar', t1:'RCB', t2:'SRH'}, {m:2, date:'29 Mar', t1:'MI', t2:'KKR'},
            {m:3, date:'30 Mar', t1:'RR', t2:'CSK'}, {m:4, date:'31 Mar', t1:'PBKS', t2:'GT'},
            {m:5, date:'01 Apr', t1:'LSG', t2:'DC'} // truncated for fallback
        ];
        
        function parseDate(raw) {
            if (!raw) return { ts:null, display:'TBD' };
            const s = raw.toString().trim();
            // Try to match Google Sheet exact format: Date(YYYY,MM,DD)
            const gm = s.match(/Date\((\d+),(\d+),(\d+)\)/i);
            if(gm) { 
                const dt = new Date(+gm[1], +gm[2], +gm[3]); 
                return { ts:dt, display: `${String(dt.getDate()).padStart(2,'0')} ${dt.toLocaleString('en',{month:'short'})}` }; 
            }
            
            // Failsafe for strict DD/MM or DD-MM formats coming from raw sheet strings
            const parts = s.split(/[-/ \.]/);
            if (parts.length >= 2) {
                const d = parseInt(parts[0], 10);
                let m = parseInt(parts[1], 10) - 1; // Month is 0-indexed in JS
                if (isNaN(m)) {
                    const mNames = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
                    m = mNames.findIndex(mn => parts[1].toLowerCase().includes(mn));
                }
                const y = parts[2] ? parseInt(parts[2], 10) : new Date().getFullYear();
                if (!isNaN(d) && !isNaN(m) && m >= 0) {
                    const dt2 = new Date(y, m, d);
                    if (!isNaN(dt2.getTime())) return { ts: dt2, display: `${String(dt2.getDate()).padStart(2,'0')} ${dt2.toLocaleString('en',{month:'short'})}` };
                }
            }

            // Fallback for standard string dates like "28 Mar 2026"
            const dt = new Date(s);
            if (!isNaN(dt.getTime())) {
                return { ts: dt, display: `${String(dt.getDate()).padStart(2,'0')} ${dt.toLocaleString('en',{month:'short'})}` };
            }

            return { ts:null, display: s.substring(0,6) };
        }
        
        function isToday(ts) {
            if(!ts) return false; 
            const now = new Date();
            // Exclusively check Date and Month to entirely avoid year parsing discrepancies
            return ts.getDate() === now.getDate() && ts.getMonth() === now.getMonth();
        }
        
        function todaysTeams() {
            const rows = _state.schedRows || []; 
            const playing = new Set();
            const source = rows.length ? rows : SCHEDULE;
            
            const now = new Date();
            const dStr = String(now.getDate());
            const dPad = dStr.padStart(2, '0');
            const mNames = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"];
            const mStr = mNames[now.getMonth()];
            const mNum = String(now.getMonth() + 1).padStart(2, '0');

            source.forEach(r => {
                const rawDate = (r.date || r[1] || '').toString().toLowerCase();
                const t1 = getShortTeam(r.t1 || r[3]);
                const t2 = getShortTeam(r.t2 || r[4]);
                
                const d = parseDate(rawDate);
                let isMatchToday = false;

                if (d.ts && isToday(d.ts)) {
                    isMatchToday = true;
                } else if ((rawDate.includes(dStr) || rawDate.includes(dPad)) && 
                           (rawDate.includes(mStr) || rawDate.includes(mNum))) {
                    // Aggressive text matching fallback for absolute certainty
                    isMatchToday = true;
                }

                if (isMatchToday) {
                    if (t1) playing.add(t1);
                    if (t2) playing.add(t2);
                }
            });
            return playing;
        }

            (schedRows.length ? schedRows : SCHEDULE).forEach(r => {
                const d = parseDate(r.date || r[1]);
                if (d.ts && isToday(d.ts)) todayMatches.push({ t1: getShortTeam(r.t1 || r[3]), t2: getShortTeam(r.t2 || r[4]) });
            });
            if(!todayMatches.length) { el.innerHTML=''; return; }

            el.innerHTML = todayMatches.map(tm => `
                <div class="glass-panel p-4 mb-4 border-yellow-500/30 flex items-center justify-between stagger-item bg-yellow-500/5">
                    <div class="flex items-center gap-2">
                        <span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse shadow-[0_0_8px_#eab308]"></span>
                        <p class="font-cyber text-[9px] font-black uppercase tracking-widest text-yellow-500">Today</p>
                    </div>
                    <div class="flex gap-3 items-center">
                        <span class="font-cyber font-black text-sm" style="color:${TEAM_COLORS[tm.t1]||'#fff'}; text-shadow:0 0 10px ${TEAM_COLORS[tm.t1]}88">${tm.t1}</span>
                        <span class="text-[8px] font-black text-[var(--text4)]">VS</span>
                        <span class="font-cyber font-black text-sm" style="color:${TEAM_COLORS[tm.t2]||'#fff'}; text-shadow:0 0 10px ${TEAM_COLORS[tm.t2]}88">${tm.t2}</span>
                    </div>
                </div>`).join('');
        }

        function renderScheduleFilters() {
            const el = document.getElementById('schedule-filters');
            const teams = ['ALL', 'MI', 'CSK', 'RCB', 'KKR', 'SRH', 'DC', 'PBKS', 'RR', 'GT', 'LSG'];
            el.innerHTML = teams.map(t => `<button class="sched-pill ${t==='ALL'?'active':''}" data-team="${t}" onclick="filterSchedule('${t}')" style="${t!=='ALL'?`border-color:${TEAM_COLORS[t]}55; color:${TEAM_COLORS[t]}`:''}">${t}</button>`).join('');
        }

        function filterSchedule(team) {
            document.querySelectorAll('.sched-pill').forEach(b => b.classList.toggle('active', b.dataset.team === team));
            document.querySelectorAll('.sched-row').forEach(row => {
                const show = team === 'ALL' || row.dataset.t1 === team || row.dataset.t2 === team;
                row.style.display = show ? '' : 'none';
            });
            
            const vis = document.querySelectorAll('.sched-row:not([style*="display: none"])');
            const done = Array.from(vis).filter(r => r.dataset.done === 'true').length;
            document.getElementById('sched-stats').innerHTML = `
                <div class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span><span class="font-cyber text-[8px] font-black text-emerald-500 tracking-widest">${done} PLAYED</span></div>
                <div class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-yellow-500"></span><span class="font-cyber text-[8px] font-black text-yellow-500 tracking-widest">${vis.length - done} REMAINING</span></div>`;
        }

        function renderSchedule(rows) {
            const el = document.getElementById('schedule-list');
            const data = rows.filter(r => r[0] && !isNaN(parseInt(r[0])));
            el.innerHTML = data.map((m, i) => {
                const isDone = !!m[6];
                const d = parseDate(m[1]);
                const isTodayMatch = isToday(d.ts);
                const t1 = getShortTeam(m[3]);
                const t2 = getShortTeam(m[4]);
                return `
                <div class="glass-panel p-4 flex items-center justify-between sched-row stagger-item active-scale ${isTodayMatch ? 'today-glow' : ''}" 
                     data-t1="${t1}" data-t2="${t2}" data-done="${isDone}" style="animation-delay: ${(i%10)*0.05}s">
                    <div class="text-center min-w-[40px] pr-3 border-r border-[var(--glass-border)]">
                        <p class="font-cyber text-[9px] font-black text-[var(--text4)]">M${m[0]}</p>
                        <p class="text-[10px] font-bold text-[var(--text2)] mt-0.5 whitespace-nowrap">${d.display}</p>
                    </div>
                    <div class="flex-1 px-4 flex flex-col items-center">
                        <div class="flex items-center gap-3 w-full justify-center">
                            <span class="font-cyber font-black text-xs flex-1 text-right" style="color:${TEAM_COLORS[t1]||'#fff'}">${t1}</span>
                            <span class="text-[8px] font-black text-[var(--text4)]">VS</span>
                            <span class="font-cyber font-black text-xs flex-1 text-left" style="color:${TEAM_COLORS[t2]||'#fff'}">${t2}</span>
                        </div>
                    </div>
                    <div class="min-w-[50px] text-center flex flex-col justify-center">
                        ${isDone ? `<p class="font-cyber text-[10px] font-black text-emerald-400">${m[6]}</p><p class="text-[6px] font-bold text-[var(--text4)] mt-1 uppercase truncate max-w-[60px]">${m[7]}</p>`
                                 : `<p class="font-cyber text-[8px] font-black text-yellow-500/50">${m[2]||'TBA'}</p>`}
                    </div>
                </div>`;
            }).join('');
            filterSchedule('ALL');
        }

        function renderStandings(rows) {
            const el = document.getElementById('standings-list');
            const data = rows.filter(r => r[0] && !isNaN(parseInt(r[0])));
            if(!data.length) return;

            el.innerHTML = `
                <div class="glass-panel p-4 mb-3 flex justify-between items-center stagger-item">
                    <div>
                        <p class="font-cyber text-[8px] font-black tracking-widest text-[var(--text4)] uppercase mb-1">IPL 2026</p>
                        <h2 class="font-cyber text-sm font-black text-yellow-500">Points Table</h2>
                    </div>
                </div>
                <div class="glass-panel overflow-hidden stagger-item" style="animation-delay: 0.1s">
                    <table class="w-full text-left text-[10px]">
                        <thead class="bg-white/5 font-cyber text-[var(--text4)] uppercase">
                            <tr><th class="p-3 text-center">#</th><th class="p-3">Team</th><th class="p-3 text-center">P</th><th class="p-3 text-center">W</th><th class="p-3 text-right">Pts</th><th class="p-3 text-right">NRR</th></tr>
                        </thead>
                        <tbody>
                            ${data.map(t => {
                                const stName = getShortTeam(t[2]);
                                return `
                                <tr class="border-t border-[var(--glass-border)] ${t[0]<=4?'bg-emerald-500/5':''}">
                                    <td class="p-3 text-center font-cyber font-bold ${t[0]<=4?'text-emerald-500':'text-[var(--text4)]'}">${t[0]}</td>
                                    <td class="p-3 font-bold text-[var(--text1)] flex items-center gap-2">
                                        <span class="w-2 h-2 rounded-full flex-shrink-0" style="background:${TEAM_COLORS[stName]||'#fff'}"></span><span class="truncate">${t[2]}</span>
                                    </td>
                                    <td class="p-3 text-center text-[var(--text3)]">${t[3]}</td>
                                    <td class="p-3 text-center font-bold text-emerald-400">${t[4]}</td>
                                    <td class="p-3 text-right font-cyber font-black text-[var(--text1)]">${t[7]}</td>
                                    <td class="p-3 text-right font-bold ${parseFloat(t[8])>=0?'text-emerald-400':'text-red-400'}">${t[8] || '0.000'}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>`;
        }

        // --- EXTRAS ---
        function showSearchOverlay() {
            document.getElementById('search-overlay').classList.remove('hidden');
            const header = document.getElementById('main-header');
            if (header) header.style.zIndex = '2001';
        }

        function hideSearchOverlay() {
            document.getElementById('search-overlay').classList.add('hidden');
            document.getElementById('search-dropdown').style.display = 'none';
            const header = document.getElementById('main-header');
            if (header) header.style.zIndex = '';
        }

        function onSearchInput(q) {
            const dd = document.getElementById('search-dropdown');
            const query = q.trim().toLowerCase();
            if(!query || !_state.rosRows) { dd.style.display='none'; return; }
            
            const results = _state.rosRows.filter(r=>r[0]&&!r[1].includes('owner')).map(r=>({
                name:r[0], owner:r[1], team:r[4], pts: _state.pPoints[fixID(r[0])]?.act||0
            })).filter(p=>p.name.toLowerCase().includes(query) || p.owner.toLowerCase().includes(query))
               .sort((a,b)=>b.pts-a.pts).slice(0,8);

            dd.style.display='block';
            dd.innerHTML = results.map(p=>`
                <div class="p-3 border-b border-[var(--glass-border)] cursor-pointer hover:bg-white/5 active-scale flex justify-between items-center" 
                     onclick="document.getElementById('player-search').value=''; hideSearchOverlay(); switchTab('main'); const c=document.getElementById('c-${fixID(p.owner).replace(/\s+/g,'-')}'); if(c){c.scrollIntoView({behavior:'smooth'}); c.classList.add('border-yellow-500'); setTimeout(()=>c.classList.remove('border-yellow-500'), 1500);}">
                    <div>
                        <p class="text-xs font-bold text-[var(--text1)]">${p.name}</p>
                        <p class="text-[8px] font-bold text-[var(--text4)] uppercase mt-0.5">${p.team} · ${p.owner}</p>
                    </div>
                    <p class="font-cyber text-sm font-black" style="color:${getColor(p.owner)}">${p.pts}</p>
                </div>`).join('');
            if(!results.length) dd.innerHTML=`<div class="p-4 text-center text-[10px] text-[var(--text4)]">No results</div>`;
        }
        
        // Hide overlay when clicking outside
        document.addEventListener('click', e => {
            if (!e.target.closest('#search-container')) {
                hideSearchOverlay();
            }
        });

        async function shareCard(cID, ownerFull, score, rank) {
            const color = getColor(ownerFull);
            const squad = (_state.squads[fixID(ownerFull)]||[]).sort((a,b)=>b.act-a.act);
            const captain = squad.find(p=>p.cvc==='C'), vice = squad.find(p=>p.cvc==='VC');
            const PLAYER_ROW_H = 24, W = 600, H = 240+50+16+Math.max(squad.length,1)*PLAYER_ROW_H+60;
            
            const canvas = document.createElement('canvas');
            canvas.width = W*2; canvas.height = H*2;
            const ctx = canvas.getContext('2d'); ctx.scale(2,2);
            
            const bg = ctx.createLinearGradient(0,0,W,H); bg.addColorStop(0,'#0f172a'); bg.addColorStop(1,'#020617');
            ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
            ctx.fillStyle = color; ctx.fillRect(0,0,W,4);
            
            const glow = ctx.createRadialGradient(W*0.78,H*0.2,0,W*0.78,H*0.2,200);
            glow.addColorStop(0,color+'28'); glow.addColorStop(1,'transparent');
            ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);
            
            ctx.font = '700 10px monospace'; ctx.fillStyle = color+'99'; ctx.fillText(`RANK #${rank}  ·  REVOLUTION IPL 2026`,28,46);
            ctx.font = '900 28px monospace'; ctx.fillStyle = '#f8fafc'; ctx.fillText(ownerFull.toUpperCase(),28,80);
            ctx.font = '900 44px monospace'; ctx.fillStyle = color; ctx.textAlign = 'right'; ctx.fillText(score,W-28,80); ctx.textAlign = 'left';
            ctx.font = '600 9px monospace'; ctx.fillStyle = '#334155'; ctx.fillText('TOTAL POINTS',28,100);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1; ctx.beginPath(); ctx.moveTo(28,114); ctx.lineTo(W-28,114); ctx.stroke();
            let cy = 138;
            if (captain||vice) {
                if (captain){ctx.font='900 10px monospace';ctx.fillStyle=color;ctx.fillText('C',28,cy);ctx.font='700 11px monospace';ctx.fillStyle='#94a3b8';ctx.fillText(captain.name,44,cy);ctx.textAlign='right';ctx.fillText(`${captain.act} pts`,W/2-10,cy);ctx.textAlign='left';}
                if (vice){ctx.font='900 10px monospace';ctx.fillStyle='#94a3b8';ctx.fillText('VC',W/2+10,cy);ctx.font='700 11px monospace';ctx.fillStyle='#64748b';ctx.fillText(vice.name,W/2+34,cy);ctx.textAlign='right';ctx.fillText(`${vice.act} pts`,W-28,cy);ctx.textAlign='left';}
                cy += 20;
            }
            ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.beginPath(); ctx.moveTo(28,cy); ctx.lineTo(W-28,cy); ctx.stroke(); cy+=16;
            ctx.font = '700 8px monospace'; ctx.fillStyle = '#334155'; ctx.fillText('FULL SQUAD',28,cy); ctx.textAlign = 'right'; ctx.fillText('PTS',W-28,cy); ctx.textAlign = 'left'; cy+=18;
            
            squad.forEach((p,i) => {
                const y = cy+i*PLAYER_ROW_H, tag = p.cvc?` [${p.cvc}]`:'';
                ctx.font = `${p.cvc?'800':'500'} 11px monospace`; ctx.fillStyle = p.cvc?color:(i%2===0?'#94a3b8':'#64748b');
                ctx.fillText(`${p.name}${tag}  (${p.team})`,28,y);
                ctx.font = `${p.cvc?'900':'700'} 11px monospace`; ctx.fillStyle = p.cvc?color:'#475569';
                ctx.textAlign = 'right'; ctx.fillText(`${p.act}`,W-28,y); ctx.textAlign = 'left';
            });
            
            const footerY = H-28;
            ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.beginPath(); ctx.moveTo(28,footerY-14); ctx.lineTo(W-28,footerY-14); ctx.stroke();
            ctx.font = '700 9px monospace'; ctx.fillStyle = color+'bb'; ctx.fillText(`🏏 ${SITE_URL}`,28,footerY);
            ctx.font = '600 8px monospace'; ctx.fillStyle = '#1e293b'; ctx.textAlign = 'right'; ctx.fillText('ULTIMA EDITION',W-28,footerY); ctx.textAlign = 'left';
            
            const filename = `revo-${ownerFull.toLowerCase().replace(/\s/g,'-')}.png`;
            const shareText = `${ownerFull} is ranked #${rank} with ${score} pts 🏏\nC: ${captain?.name||'—'} | VC: ${vice?.name||'—'}\n\n🔗 ${SITE_URL}`;
            
            if (navigator.share && navigator.canShare) {
                try {
                    const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
                    const file = new File([blob], filename, {type:'image/png'});
                    if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:`${ownerFull} — Revolution IPL`, text:shareText}); return; }
                } catch(e) { if(e.name==='AbortError') return; }
            }
            const a = document.createElement('a'); a.download = filename; a.href = canvas.toDataURL('image/png'); a.click();
        }

        function fireConfetti(){
            const colors=['#f1c40f','#3498db','#2ecc71','#e74c3c'];
            for(let i=0;i<60;i++){
                const el=document.createElement('div'), size=Math.random()*6+4;
                el.style.cssText=`position:fixed;z-index:9999;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${window.innerWidth/2+(Math.random()-0.5)*100}px;top:0;border-radius:50%;pointer-events:none;`;
                document.body.appendChild(el);
                let posX=parseFloat(el.style.left), posY=0, velY=-(Math.random()*6+4), vx=(Math.random()-0.5)*10, life=0;
                const tick=()=>{ life++; posX+=vx; velY+=0.4; posY+=velY; el.style.transform=`translate(${posX-parseFloat(el.style.left)}px, ${posY}px)`; if(posY<window.innerHeight) requestAnimationFrame(tick); else el.remove(); };
                requestAnimationFrame(tick);
            }
        }

        // Init App Data
        updateApp();
        setInterval(updateApp, 60000);
        setTimeout(dismissSplash, 4000); // Failsafe dismiss if fetch hangs
        
        // Scroll listener for Top Button
        window.addEventListener('scroll',()=>{
            const btn = document.getElementById('scroll-top-btn');
            if(btn) btn.style.display = window.scrollY > 300 ? 'flex' : 'none';
        }, {passive:true});

    </script>
</body>
