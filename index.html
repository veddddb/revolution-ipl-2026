<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>REVOLUTION IPL 2026</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#f1c40f">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Revo IPL">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root { --accent:#f1c40f; --glass:rgba(10,15,25,0.98); --border:rgba(255,255,255,0.08); }
        body.light { --glass:rgba(240,244,255,0.92); --border:rgba(0,0,0,0.1);
            background:radial-gradient(circle at top,#e8eef8,#c8d8f0) fixed !important; color:#0f172a; }
        body.light .gold-glow { color:#b8860b; text-shadow:none; }
        body.light .font-cyber { color:#1e293b; }
        body.light .role-tag { background:rgba(0,0,0,0.06); color:#475569; }
        body.light .team-tag { color:#64748b; }
        body.light .tab-btn { color:#475569; border-color:rgba(0,0,0,0.1); background:rgba(0,0,0,0.04); }
        body.light .tab-btn.active { background:#b8860b; color:#fff; border-color:#b8860b; }
        body.light .podium-pillar { background:linear-gradient(180deg,rgba(0,0,0,0.06),rgba(0,0,0,0.02)); border-color:rgba(0,0,0,0.08); }
        body.light .podium-rank-label { color:#334155; }
        body.light .squad-container { border-top-color:rgba(0,0,0,0.06); }
        body.light #player-search { background:rgba(240,244,255,0.95)!important; color:#0f172a!important; border-color:rgba(0,0,0,0.12)!important; }
        body.light #search-dropdown { background:rgba(240,244,255,0.99)!important; border-color:rgba(0,0,0,0.1)!important; }
        body.light .search-item:hover { background:rgba(0,0,0,0.04)!important; }
        body.light .skel { background:linear-gradient(90deg,rgba(0,0,0,0.04) 25%,rgba(0,0,0,0.1) 50%,rgba(0,0,0,0.04) 75%); }
        body.light .error-banner { background:rgba(220,38,38,0.08); }
        body.light .mvp-banner { background:linear-gradient(90deg,rgba(184,134,11,0.1),rgba(184,134,11,0.04)); border-color:rgba(184,134,11,0.3); }
        body.light .player-row-ghost { opacity:0.35; }
        body.light .tab-row-2 { opacity:0.7!important; }

        body { background:radial-gradient(circle at top,#0f172a 0%,#020617 100%) fixed; color:#f8fafc; font-family:'Inter',sans-serif; min-height:100vh; transition:background 0.4s,color 0.3s; }
        .font-cyber { font-family:'Orbitron',sans-serif; }
        /* IMPROVEMENT 12: stronger gold glow */
        .gold-glow { color:var(--accent); text-shadow:0 0 24px rgba(241,196,15,0.6),0 0 60px rgba(241,196,15,0.15); }

        .glass-card { background:var(--glass); border:1px solid var(--border); border-radius:20px; transition:0.4s cubic-bezier(0.4,0,0.2,1); margin-bottom:0.6rem; position:relative; overflow:hidden; cursor:pointer; }
        .glass-card:hover { transform:translateY(-3px); border-color:var(--owner-color,var(--accent)); box-shadow:0 0 28px -5px var(--owner-glow,rgba(241,196,15,0.2)); z-index:20; }
        .logo-bg { position:absolute; right:8%; top:50%; transform:translateY(-50%); width:110px; height:110px; opacity:0.12; pointer-events:none; z-index:0; filter:blur(0.5px); transition:opacity 0.4s,filter 0.4s,transform 0.4s; }
        .glass-card:hover .logo-bg { opacity:0.38; filter:blur(0); transform:translateY(-50%) scale(1.08); }

        /* IMPROVEMENT 1: two-row tab system */
        .tab-btn { padding:8px 12px; border-radius:11px; font-size:9px; font-weight:900; text-transform:uppercase; transition:0.25s; border:1px solid var(--border); background:rgba(255,255,255,0.02); color:#64748b; white-space:nowrap; }
        .tab-btn.active { background:var(--accent); color:#000; border-color:var(--accent); box-shadow:0 0 16px rgba(241,196,15,0.25); }
        .tab-row-2 { opacity:0.78; transition:opacity 0.2s; }
        .tab-row-2:has(.tab-btn.active) { opacity:1; }
        .tab-row-2 .tab-btn { font-size:8px; padding:7px 10px; }

        /* IMPROVEMENT 3: merged MVP banner */
        .mvp-banner { background:linear-gradient(135deg,rgba(241,196,15,0.1),rgba(241,196,15,0.03)); border:1px solid rgba(241,196,15,0.25); border-radius:18px; padding:13px 17px; margin-bottom:0; box-shadow:0 0 18px rgba(241,196,15,0.07); }

        .role-tag { font-size:7px; padding:2px 5px; border-radius:4px; background:rgba(255,255,255,0.05); color:#94a3b8; text-transform:uppercase; font-weight:700; margin-left:5px; }
        .team-tag { font-size:7px; color:#475569; text-transform:uppercase; font-weight:800; margin-left:4px; }
        .badge { font-size:8px; padding:1px 5px; border-radius:4px; font-weight:900; border:1px solid currentColor; margin-left:6px; }

        .squad-container { display:none; padding:0 18px 18px 18px; border-top:1px solid rgba(255,255,255,0.05); }
        .squad-container.open { display:block; animation:slideIn 0.3s ease-out; }
        .player-row-ghost { opacity:0.25; filter:grayscale(1); transition:0.3s; }
        .player-row-ghost:hover { opacity:0.6; }

        /* IMPROVEMENT 9: share button with owner color awareness */
        .share-btn { font-size:8px; font-family:'Orbitron',sans-serif; font-weight:900; letter-spacing:0.08em; text-transform:uppercase; padding:4px 9px; border-radius:7px; border:1px solid rgba(255,255,255,0.12); background:rgba(255,255,255,0.03); color:#64748b; transition:0.2s; cursor:pointer; }
        .share-btn:hover { color:var(--owner-color,#f1c40f); border-color:var(--owner-color,#f1c40f); background:rgba(255,255,255,0.06); }

        @keyframes shimmer { 0%{background-position:-600px 0} 100%{background-position:600px 0} }
        .skel { background:linear-gradient(90deg,rgba(255,255,255,0.04) 25%,rgba(255,255,255,0.1) 50%,rgba(255,255,255,0.04) 75%); background-size:600px 100%; animation:shimmer 1.4s infinite linear; border-radius:8px; }
        .skel-card { background:rgba(10,15,25,0.98); border:1px solid rgba(255,255,255,0.06); border-radius:18px; padding:16px 18px; margin-bottom:0.6rem; display:flex; justify-content:space-between; align-items:center; }

        .error-banner { background:rgba(220,38,38,0.12); border:1px solid rgba(220,38,38,0.35); border-radius:16px; padding:12px 16px; margin-bottom:14px; display:flex; align-items:center; gap:12px; animation:slideIn 0.3s ease-out; }
        .error-dot { width:8px; height:8px; border-radius:50%; background:#ef4444; flex-shrink:0; animation:blink 2s infinite; }

        #splash { position:fixed; inset:0; z-index:999; background:radial-gradient(circle at 50% 40%,#0f172a,#020617); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:2rem; transition:opacity 0.8s,transform 0.8s; }
        #splash.hide { opacity:0; transform:scale(1.04); pointer-events:none; }
        .sp { opacity:0; }
        .sp1 { animation:fadeUp 0.6s ease 0.2s forwards; }
        .sp2 { animation:fadeUp 0.7s ease 0.5s forwards; }
        .sp3 { animation:fadeUp 0.7s ease 0.75s forwards; }
        .sp4 { animation:fadeUp 0.6s ease 1.0s forwards; }
        .sp5 { animation:fadeUp 0.6s ease 1.1s forwards; }
        .sp6 { animation:fadeUp 0.7s ease 1.2s forwards; }
        .sp7 { animation:fadeUp 0.6s ease 1.8s forwards, blink 1.4s ease 2.4s infinite; }

        @keyframes fadeUp { from{opacity:0;transform:translateY(14px)} to{opacity:1;transform:translateY(0)} }
        @keyframes riseUp { from{transform:scaleY(0);opacity:0} to{transform:scaleY(1);opacity:1} }
        .pillar-rise { animation:riseUp 0.7s cubic-bezier(0.34,1.56,0.64,1) both; }
        #player-search::placeholder { color:#1e293b; }
        #player-search:focus { border-color:rgba(255,255,255,0.2); }
        .search-item:hover { background:rgba(255,255,255,0.05); }
        #search-dropdown::-webkit-scrollbar { width:4px; }
        #search-dropdown::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.1); border-radius:2px; }
        @keyframes slideIn { from{opacity:0;transform:translateY(-5px)} to{opacity:1;transform:translateY(0)} }
        @keyframes blink { 0%,100%{opacity:0.4} 50%{opacity:1} }
        @keyframes neonPulse { 0%,100%{opacity:0.7} 50%{opacity:1} }
        .sched-pill:hover { opacity:1!important; transform:scale(1.05); }
        .sched-pill.active { opacity:1!important; transform:scale(1.05); box-shadow:0 0 10px -2px currentColor; }
        @keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
        .live-dot { display:inline-block; width:7px; height:7px; border-radius:50%; background:#4ade80; margin-left:6px; vertical-align:middle; flex-shrink:0; animation:livePulse 1.2s ease-in-out infinite; box-shadow:0 0 6px #4ade80; }
        @keyframes todayGlow { 0%,100%{box-shadow:0 0 12px 2px rgba(241,196,15,0.15),inset 0 0 0 1px rgba(241,196,15,0.2)} 50%{box-shadow:0 0 26px 8px rgba(241,196,15,0.32),inset 0 0 0 1px rgba(241,196,15,0.5)} }
    </style>
</head>
<body class="p-4 md:p-8">

    <!-- SPLASH -->
    <div id="splash" onclick="dismissSplash()">
        <p class="sp sp1" style="font-size:9px;font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:0.4em;color:#475569;text-transform:uppercase;margin-bottom:2rem;">IPL Fantasy League</p>
        <h1 class="sp sp2" style="font-family:Orbitron,sans-serif;font-weight:900;font-style:italic;font-size:clamp(2.8rem,12vw,5rem);line-height:1;color:#f1c40f;text-shadow:0 0 40px rgba(241,196,15,0.4),0 0 80px rgba(241,196,15,0.15);text-transform:uppercase;letter-spacing:-0.02em;">Revo</h1>
        <p class="sp sp3" style="font-family:Orbitron,sans-serif;font-size:clamp(0.65rem,3vw,0.85rem);font-weight:700;letter-spacing:0.25em;color:#64748b;text-transform:uppercase;margin-top:0.75rem;">IPL 2026 Championship</p>
        <div class="sp sp4" style="width:60px;height:1px;background:rgba(241,196,15,0.3);margin:2.5rem auto;"></div>
        <p class="sp sp5" style="font-size:8px;font-weight:700;letter-spacing:0.3em;text-transform:uppercase;color:#334155;margin-bottom:0.5rem;">Designed by</p>
        <p class="sp sp6" style="font-family:Orbitron,sans-serif;font-size:clamp(0.75rem,3.5vw,1rem);font-weight:900;color:#94a3b8;letter-spacing:0.1em;text-transform:uppercase;">Vedant Bhansali</p>
        <p class="sp sp7" style="margin-top:3.5rem;font-size:9px;font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:0.4em;color:#475569;text-transform:uppercase;cursor:pointer;">Tap anywhere to enter →</p>
    </div>

    <div class="max-w-xl mx-auto pb-14">
        <header class="mb-7 text-center">
            <div class="flex justify-between items-center mb-5 px-1">
                <div class="role-tag uppercase tracking-widest px-3 py-1">EST. 2026</div>
                <div style="display:flex;align-items:center;gap:8px;">
                    <div id="match-counter" class="role-tag tracking-widest text-yellow-500 uppercase px-3 py-1">MATCHES: —/74</div>
                    <button id="theme-toggle" onclick="toggleTheme()" title="Toggle theme"
                        style="width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,0.08);background:rgba(10,15,25,0.98);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:14px;">🌙</button>
                </div>
            </div>
            <!-- IMPROVEMENT 12: Stronger gold glow -->
            <h1 class="text-5xl font-black font-cyber gold-glow italic tracking-tighter mb-5 uppercase">REVOLUTION</h1>

            <!-- IMPROVEMENT 1: TWO-ROW TAB BAR — no horizontal scroll needed -->
            <div style="background:rgba(0,0,0,0.45);border-radius:18px;border:1px solid rgba(255,255,255,0.05);padding:5px;display:flex;flex-direction:column;gap:4px;">
                <!-- Row 1: Primary — Live, Rankings, Schedule, Standings -->
                <div style="display:flex;gap:5px;">
                    <button onclick="switchTab('livepoints')" id="btn-livepoints" class="tab-btn" style="flex:1;position:relative;">🔴 Live
                        <span id="live-tab-dot" style="display:none;position:absolute;top:3px;right:3px;width:5px;height:5px;border-radius:50%;background:#4ade80;animation:livePulse 1.2s ease-in-out infinite;box-shadow:0 0 5px #4ade80;"></span>
                    </button>
                    <button onclick="switchTab('main')"      id="btn-main"      class="tab-btn active" style="flex:1;">Rankings</button>
                    <button onclick="switchTab('schedule')"  id="btn-schedule"  class="tab-btn"        style="flex:1;">Schedule</button>
                    <button onclick="switchTab('standings')" id="btn-standings" class="tab-btn"        style="flex:1;">Standings</button>
                </div>
                <!-- Row 2: Secondary — Weekly, Luckiest, HOF, Gems -->
                <div class="tab-row-2" style="display:flex;gap:5px;">
                    <button onclick="switchTab('weekly')"   id="btn-weekly"   class="tab-btn" style="flex:1;">Weekly</button>
                    <button onclick="switchTab('If Tu..')" id="btn-strat"    class="tab-btn" style="flex:1;">Luckiest</button>
                    <button onclick="switchTab('hof')"      id="btn-hof"      class="tab-btn" style="flex:1;">🏆 HOF</button>
                    <button onclick="switchTab('gems')"     id="btn-gems"     class="tab-btn" style="flex:1;">💎 Gems</button>
                </div>
            </div>
        </header>

        <div id="error-banner" class="error-banner hidden">
            <div class="error-dot"></div>
            <div>
                <p class="text-xs font-black uppercase tracking-widest text-red-400 mb-0.5">Sync Failed</p>
                <p id="error-msg" class="text-[10px] text-red-300 opacity-70">Could not reach the data sheet. Retrying in 60s…</p>
            </div>
            <button onclick="updateApp()" class="ml-auto text-[9px] font-black uppercase tracking-widest text-red-400 border border-red-500/30 rounded-lg px-3 py-1.5 hover:bg-red-500/10 transition-colors">Retry</button>
        </div>

        <!-- MAIN VIEW -->
        <div id="view-main" class="space-y-3">
            <!-- IMPROVEMENT 6: TODAY vs LIVE handled in JS -->
            <div id="today-match-bar"></div>
            <div style="position:relative;">
                <input id="player-search" type="text" placeholder="Search player…"
                    oninput="onSearchInput(this.value)" onfocus="onSearchInput(this.value)"
                    style="width:100%;background:rgba(10,15,25,0.98);border:1px solid rgba(255,255,255,0.08);border-radius:14px;padding:11px 16px 11px 38px;color:#f8fafc;font-size:12px;font-family:Inter,sans-serif;font-weight:600;outline:none;box-sizing:border-box;"
                    autocomplete="off">
                <svg style="position:absolute;left:13px;top:50%;transform:translateY(-50%);opacity:0.25;pointer-events:none;" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <div id="search-dropdown" style="display:none;position:absolute;top:calc(100% + 6px);left:0;right:0;background:rgba(8,12,20,0.99);border:1px solid rgba(255,255,255,0.1);border-radius:14px;overflow:hidden;z-index:100;max-height:320px;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,0.5);"></div>
            </div>
            <!-- IMPROVEMENT 3: Merged MVP + match day winner -->
            <div id="mvp-spotlight"></div>
            <!-- IMPROVEMENT 2: Compact top-3 strip instead of tall podium -->
            <div id="top3-strip"></div>
            <!-- IMPROVEMENT 8: Collapsible last match leaderboard (collapsed by default) -->
            <div id="last-match-collapsible"></div>
            <div id="leaderboard" class="space-y-0"></div>
        </div>

        <div id="view-livepoints" class="hidden pt-3">
            <div id="live-points-list"></div>
        </div>

        <div id="view-strategy" class="hidden space-y-3 pt-3">
            <div id="strategy-list"></div>
        </div>

        <!-- IMPROVEMENT 8: Streak tracker moved to Weekly tab -->
        <div id="view-weekly" class="hidden pt-3">
            <div id="streak-tracker"></div>
            <div id="weekly-list" class="space-y-3 mt-3"></div>
        </div>

        <div id="view-schedule" class="hidden pt-3">
            <div style="margin-bottom:12px;">
                <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:2px 0 6px;">
                    <button class="sched-pill active" data-team="ALL" onclick="setSchedFilter('ALL')" style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;padding:5px 12px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#f1c40f;cursor:pointer;transition:0.2s;white-space:nowrap;">ALL</button>
                    <button class="sched-pill" data-team="MI"   onclick="setSchedFilter('MI')"   style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;padding:5px 12px;border-radius:20px;border:1px solid rgba(0,75,160,0.5);background:rgba(0,75,160,0.15);color:#89CFF0;cursor:pointer;transition:0.2s;white-space:nowrap;opacity:0.55;">MI</button>
                    <button class="sched-pill" data-team="CSK"  onclick="setSchedFilter('CSK')"  style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;padding:5px 12px;border-radius:20px;border:1px solid rgba(244,196,48,0.5);background:rgba(244,196,48,0.12);color:#F4C430;cursor:pointer;transition:0.2s;white-space:nowrap;opacity:0.55;">CSK</button>
                    <button class="sched-pill" data-team="RCB"  onclick="setSchedFilter('RCB')"  style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;padding:5px 12px;border-radius:20px;border:1px solid rgba(200,16,46,0.5);background:rgba(200,16,46,0.12);color:#F87171;cursor:pointer;transition:0.2s;white-space:nowrap;opacity:0.55;">RCB</button>
                    <button class="sched-pill" data-team="KKR"  onclick="setSchedFilter('KKR')"  style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;padding:5px 12px;border-radius:20px;border:1px solid rgba(58,34,93,0.6);background:rgba(58,34,93,0.2);color:#c4b5fd;cursor:pointer;transition:0.2s;white-space:nowrap;opacity:0.55;">KKR</button>
                    <button class="sched-pill" data-team="SRH"  onclick="setSchedFilter('SRH')"  style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;padding:5px 12px;border-radius:20px;border:1px solid rgba(242,101,34,0.5);background:rgba(242,101,34,0.12);color:#fb923c;cursor:pointer;transition:0.2s;white-space:nowrap;opacity:0.55;">SRH</button>
                    <button class="sched-pill" data-team="DC"   onclick="setSchedFilter('DC')"   style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;padding:5px 12px;border-radius:20px;border:1px solid rgba(0,82,154,0.5);background:rgba(0,82,154,0.15);color:#60a5fa;cursor:pointer;transition:0.2s;white-space:nowrap;opacity:0.55;">DC</button>
                    <button class="sched-pill" data-team="PBKS" onclick="setSchedFilter('PBKS')" style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;padding:5px 12px;border-radius:20px;border:1px solid rgba(237,28,36,0.5);background:rgba(237,28,36,0.12);color:#fca5a5;cursor:pointer;transition:0.2s;white-space:nowrap;opacity:0.55;">PBKS</button>
                    <button class="sched-pill" data-team="RR"   onclick="setSchedFilter('RR')"   style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;padding:5px 12px;border-radius:20px;border:1px solid rgba(234,26,133,0.5);background:rgba(234,26,133,0.12);color:#f9a8d4;cursor:pointer;transition:0.2s;white-space:nowrap;opacity:0.55;">RR</button>
                    <button class="sched-pill" data-team="GT"   onclick="setSchedFilter('GT')"   style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;padding:5px 12px;border-radius:20px;border:1px solid rgba(29,78,137,0.5);background:rgba(29,78,137,0.15);color:#93c5fd;cursor:pointer;transition:0.2s;white-space:nowrap;opacity:0.55;">GT</button>
                    <button class="sched-pill" data-team="LSG"  onclick="setSchedFilter('LSG')"  style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;padding:5px 12px;border-radius:20px;border:1px solid rgba(164,214,94,0.5);background:rgba(164,214,94,0.12);color:#a4d65e;cursor:pointer;transition:0.2s;white-space:nowrap;opacity:0.55;">LSG</button>
                </div>
                <div id="sched-stats" style="display:flex;justify-content:center;gap:16px;margin-top:8px;"></div>
            </div>
            <div id="schedule-list"></div>
        </div>

        <div id="view-standings" class="hidden pt-3"><div id="standings-list"></div></div>
        <div id="view-hof"       class="hidden pt-3"><div id="hof-list"></div></div>
        <div id="view-gems"      class="hidden pt-3"><div id="gems-list"></div></div>

        <!-- IMPROVEMENT 10: Tighter footer -->
        <footer class="text-center py-8 opacity-20 font-cyber text-[8px] uppercase tracking-[0.6em]">
            Precision Sync • Vedant Bhansali Edition
        </footer>
    </div>

    <!-- SCROLL TO TOP -->
    <button id="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'})"
        style="display:none;position:fixed;bottom:22px;right:14px;z-index:400;width:38px;height:38px;border-radius:50%;border:1px solid rgba(241,196,15,0.4);background:rgba(10,15,25,0.95);backdrop-filter:blur(12px);color:#f1c40f;font-size:15px;cursor:pointer;box-shadow:0 0 14px rgba(241,196,15,0.15);">↑</button>

    <script>
        const SHEET_ID = '1xIRCNr0tteFfMk6l7inIkKeSJMb7WLBswsXepHRqjio';
        const TOTAL_SEASON_MATCHES = 74;

        const ownerColors = {
            vedant:'#3498db',deep:'#e74c3c',shlok:'#2ecc71',rahul:'#9b59b6',
            soni:'#f1c40f',dheer:'#e67e22',kunal:'#1abc9c',puneet:'#ff9f43',
            vivek:'#54a0ff',bokaria:'#5f27cd',prakshal:'#48dbfb',rishi:'#ff6b6b',
            aamer:'#1dd1a1',yashshah:'#f368e0',jash:'#e67e22',
        };
        function getColor(raw) {
            const n = fixID(raw);
            if (ownerColors[n]) return ownerColors[n];
            for (const w of n.split(/\s+/)) if (ownerColors[w]) return ownerColors[w];
            if (ownerColors[n.replace(/\s/g,'')]) return ownerColors[n.replace(/\s/g,'')];
            return '#64748b';
        }
        const fixID = s => s ? s.toString().toLowerCase().trim() : '';

        const IPL_TEAMS = {
            MI:{color:'#004BA0',accent:'#89CFF0'},CSK:{color:'#F4C430',accent:'#ffffff'},
            RCB:{color:'#C8102E',accent:'#FFD700'},KKR:{color:'#3A225D',accent:'#B8960C'},
            SRH:{color:'#F26522',accent:'#1a1a1a'},DC:{color:'#00529A',accent:'#E8001C'},
            PBKS:{color:'#ED1C24',accent:'#DCDDDF'},RR:{color:'#EA1A85',accent:'#254AA5'},
            GT:{color:'#1D4E89',accent:'#C8A84B'},LSG:{color:'#A4D65E',accent:'#1a1a1a'},
        };
        function teamBadgeSVG(code,size=110) {
            const t=IPL_TEAMS[code]; if(!t) return '';
            const fs=code.length<=2?22:code.length===3?18:14;
            return `<svg viewBox="0 0 100 115" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
                <defs><linearGradient id="sg${code}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="${t.color}" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="${t.color}" stop-opacity="0.5"/>
                </linearGradient></defs>
                <path d="M50 4 L92 18 L92 54 C92 80 50 110 50 110 C50 110 8 80 8 54 L8 18 Z" fill="url(#sg${code})" stroke="${t.accent}" stroke-width="2" stroke-opacity="0.6"/>
                <text x="50" y="${fs<=14?62:60}" text-anchor="middle" font-family="Orbitron,sans-serif" font-size="${fs}" font-weight="900" fill="${t.accent}" fill-opacity="0.95" letter-spacing="1">${code}</text>
            </svg>`;
        }
        function getDominantTeams(squad) {
            if (!squad||!squad.length) return [];
            const counts={};
            squad.forEach(p=>{const t=(p.team||'').toString().trim().toUpperCase();if(t)counts[t]=(counts[t]||0)+1;});
            const max=Math.max(...Object.values(counts));
            return Object.entries(counts).filter(([,v])=>v===max).map(([t])=>t).filter(t=>IPL_TEAMS[t]);
        }

        function dismissSplash() { const s=document.getElementById('splash'); s.classList.add('hide'); setTimeout(()=>s.remove(),900); }
        setTimeout(dismissSplash,5000);

        const TAB_ORDER = ['main','livepoints','strategy','weekly','schedule','standings','hof','gems'];
        let _currentTab = 'main';

        function switchTab(t,animate) {
            const views={main:'view-main',livepoints:'view-livepoints',strategy:'view-strategy',weekly:'view-weekly',schedule:'view-schedule',standings:'view-standings',hof:'view-hof',gems:'view-gems'};
            const btns={main:'btn-main',livepoints:'btn-livepoints',strategy:'btn-strat',weekly:'btn-weekly',schedule:'btn-schedule',standings:'btn-standings',hof:'btn-hof',gems:'btn-gems'};
            Object.keys(views).forEach(k=>{
                const el=document.getElementById(views[k]);
                const btn=document.getElementById(btns[k]);
                if(!el) return;
                if(k===t){
                    el.classList.remove('hidden');
                    if(animate){el.style.animation='none';el.offsetHeight;el.style.animation='slideIn 0.25s ease-out';}
                } else { el.classList.add('hidden'); }
                if(btn) btn.classList.toggle('active',k===t);
            });
            _currentTab=t;
            const btn=document.getElementById(btns[t]);
            if(btn) btn.scrollIntoView({inline:'center',behavior:'smooth',block:'nearest'});
        }

        function showError(msg) { document.getElementById('error-msg').textContent=msg||'Could not reach the data sheet. Retrying in 60s…'; document.getElementById('error-banner').classList.remove('hidden'); }
        function hideError() { document.getElementById('error-banner').classList.add('hidden'); }

        function renderSkeleton() {
            document.getElementById('leaderboard').innerHTML=Array.from({length:5}).map(()=>`
                <div class="skel-card"><div class="flex items-center gap-4"><div class="skel w-4 h-4 rounded"></div><div class="skel w-28 h-3 rounded"></div></div><div class="skel w-12 h-6 rounded"></div></div>`).join('');
            const mvp=document.getElementById('mvp-spotlight');
            if(mvp) mvp.innerHTML=`<div class="skel-card" style="border-radius:18px;padding:12px 16px;"><div><div class="skel w-32 h-2 rounded mb-3"></div><div class="skel w-40 h-5 rounded mb-2"></div><div class="skel w-24 h-2 rounded"></div></div><div class="skel w-14 h-8 rounded"></div></div>`;
        }

        async function fetchSheet(name) {
            const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=0&sheet=${encodeURIComponent(name)}`;
            const r=await fetch(url);
            if(!r.ok) throw new Error(`Sheet fetch failed: ${name} (${r.status})`);
            const t=await r.text();
            const j=JSON.parse(t.substr(47).slice(0,-2));
            return j.table.rows.map(row=>row.c.map(cell=>cell?(cell.v!==null?cell.v:''):''));
        }

        let _state = {squads:{},cumulScores:{},completedMatches:[]};

        async function updateApp() {
            hideError();
            if(!document.getElementById('leaderboard').querySelector('.glass-card')) renderSkeleton();
            try {
                const [lbRows,rosRows,pcRows,schedRows,standRows,liveRows] = await Promise.all([
                    fetchSheet('Leaderboard'),
                    fetchSheet('Roster'),
                    fetchSheet('PointsCalc'),
                    fetchSheet('Schedule').catch(()=>[]),
                    fetchSheet('Standings').catch(()=>[]),
                    fetchSheet('Livescore').catch(()=>[]),
                ]);

                const completedMatches=[...new Set(pcRows.filter(r=>r[0]&&parseFloat(r[6])>0).map(r=>r[0].toString().trim()))];
                document.getElementById('match-counter').innerText=`MATCHES: ${completedMatches.length}/${TOTAL_SEASON_MATCHES}`;

                const pPoints={};
                pcRows.forEach(row=>{
                    if(!row[1]) return;
                    const k=fixID(row[1]),v=parseFloat(row[6])||0,m=parseFloat(row[5])||1;
                    if(!pPoints[k]) pPoints[k]={act:0,raw:0};
                    pPoints[k].act+=v; pPoints[k].raw+=(v/m);
                });

                let matchPlayers=[],lastMatchName='';
                if(pcRows.length){
                    lastMatchName=pcRows[pcRows.length-1][0];
                    pcRows.forEach(r=>{if(r[0]===lastMatchName) matchPlayers.push({name:r[1],pts:parseFloat(r[6])||0,owner:r[2]});});
                }

                const squads={};
                rosRows.forEach(row=>{
                    const oKey=fixID(row[1]);
                    if(!oKey||oKey.includes('owner')) return;
                    if(!squads[oKey]) squads[oKey]=[];
                    const stats=pPoints[fixID(row[0])]||{act:0,raw:0};
                    squads[oKey].push({name:row[0],team:row[4],role:row[6],act:Math.round(stats.act),raw:stats.raw,
                        cvc:parseFloat(row[2])===2?'C':parseFloat(row[2])===1.5?'VC':''});
                });

                let owners=lbRows.map(row=>{
                    const full=row[0]?row[0].toString().trim():'';
                    const id=full.toLowerCase();
                    if(!full||['owner name','owner','name'].includes(id)) return null;
                    return {full,score:Math.round(parseFloat(row[1]))||0,id,first:full.split(' ')[0]};
                }).filter(Boolean);

                const active=owners.filter(o=>o.id!=='unsold').sort((a,b)=>b.score-a.score);
                const unsold=owners.find(o=>o.id==='unsold');
                const allOwners=unsold?[...active,unsold]:active;
                const cumulScores=buildCumulScores(active,pcRows,completedMatches);
                _state={squads,cumulScores,completedMatches,rosRows,pPoints,pcRows,active,schedRows};

                // IMPROVEMENT 3: merged MVP + winner
                renderMVPMerged(matchPlayers.sort((a,b)=>b.pts-a.pts)[0],lastMatchName,active,pcRows,completedMatches);
                // IMPROVEMENT 2: top-3 strip
                renderTop3Strip(active);
                // IMPROVEMENT 8: collapsible last match
                renderLastMatchCollapsible(active,pcRows,completedMatches);
                renderStreakTracker(active,cumulScores,completedMatches);
                renderLeaderboard(allOwners,squads,cumulScores);
                renderStrategy(active,squads);
                if(schedRows&&schedRows.length){window._schedRows=schedRows;renderSchedule(schedRows);}
                renderTodayBar(schedRows||[]);
                renderWeekly(active,pcRows,completedMatches,squads);
                renderRankArrows(active);
                if(!window._confettiFired){window._confettiFired=true;setTimeout(fireConfetti,800);}
                renderStandings(standRows||[]);
                renderHallOfFame(active,pcRows,completedMatches,squads);
                renderGems(rosRows,pPoints,squads);
                renderLivePoints(liveRows||[]);
            } catch(e) {
                console.error('Sync Error:',e);
                showError(e.message||'Could not reach the data sheet. Retrying in 60s…');
            }
        }

        function buildCumulScores(owners,pcRows,completedMatches) {
            const cumul={},running={};
            owners.forEach(o=>{cumul[o.id]=[];running[o.id]=0;});
            const nameToId={};
            owners.forEach(o=>{nameToId[fixID(o.full)]=o.id;nameToId[fixID(o.first)]=o.id;nameToId[o.id]=o.id;});
            completedMatches.forEach(matchName=>{
                const totals={};
                pcRows.filter(r=>r[0]&&r[0].toString().trim()===matchName&&r[2]).forEach(r=>{
                    const raw=fixID(r[2]);
                    const id=nameToId[raw]||owners.find(o=>raw.includes(o.id)||o.id.includes(raw))?.id;
                    if(!id) return;
                    totals[id]=(totals[id]||0)+(parseFloat(r[6])||0);
                });
                owners.forEach(o=>{running[o.id]+=(totals[o.id]||0);cumul[o.id].push(Math.round(running[o.id]));});
            });
            return cumul;
        }

        // IMPROVEMENT 3: Merged MVP + match day winner into one compact card
        function renderMVPMerged(mvp,matchName,active,pcRows,completedMatches) {
            const el=document.getElementById('mvp-spotlight');
            if(!el) return;
            if(!mvp||!mvp.owner){el.innerHTML='';return;}

            let winnerId=null,winnerPts=0;
            if(completedMatches.length){
                const lastMatch=completedMatches[completedMatches.length-1];
                const nameToId={};
                active.forEach(o=>{nameToId[fixID(o.full)]=o.id;nameToId[fixID(o.first)]=o.id;nameToId[o.id]=o.id;});
                const totals={};
                active.forEach(o=>totals[o.id]=0);
                pcRows.filter(r=>r[0]&&r[0].toString().trim()===lastMatch).forEach(r=>{
                    const raw=fixID(r[2]);
                    const id=nameToId[raw]||active.find(o=>raw.includes(o.id)||o.id.includes(raw))?.id;
                    if(id) totals[id]=(totals[id]||0)+(parseFloat(r[6])||0);
                });
                const sorted=Object.entries(totals).sort((a,b)=>b[1]-a[1]);
                if(sorted.length&&sorted[0][1]>0){winnerId=sorted[0][0];winnerPts=Math.round(sorted[0][1]);}
            }

            const mvpColor=getColor(mvp.owner);
            const winner=winnerId?active.find(o=>o.id===winnerId):null;
            const winColor=winner?getColor(winner.id):'#f1c40f';

            el.innerHTML=`
                <div class="mvp-banner">
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
                        <div style="flex:1;">
                            <p style="font-size:7px;font-weight:900;color:#f1c40f;text-transform:uppercase;letter-spacing:0.25em;margin-bottom:3px;">⭐ Match Hero · ${matchName}</p>
                            <p style="font-size:15px;font-weight:900;color:#f1f5f9;text-transform:uppercase;line-height:1.2;">${mvp.name}</p>
                            <p style="font-size:9px;color:#475569;margin-top:2px;">by <span style="color:${mvpColor}">${mvp.owner}</span></p>
                        </div>
                        <div style="text-align:right;flex-shrink:0;">
                            <p style="font-family:Orbitron,sans-serif;font-size:24px;font-weight:900;color:#f1c40f;line-height:1;">${mvp.pts}</p>
                            <p style="font-size:7px;color:#475569;text-transform:uppercase;letter-spacing:0.1em;">pts</p>
                        </div>
                    </div>
                    ${winner?`
                    <div style="display:flex;align-items:center;justify-content:space-between;margin-top:9px;padding-top:9px;border-top:1px solid rgba(255,255,255,0.06);">
                        <div>
                            <p style="font-size:7px;font-weight:900;color:${winColor};text-transform:uppercase;letter-spacing:0.25em;margin-bottom:2px;">🏅 Match Day Winner</p>
                            <p style="font-size:13px;font-weight:900;color:${winColor};text-transform:uppercase;">${winner.full}</p>
                        </div>
                        <div style="text-align:right;">
                            <p style="font-family:Orbitron,sans-serif;font-size:20px;font-weight:900;color:${winColor};line-height:1;text-shadow:0 0 10px ${winColor}55;">${winnerPts}</p>
                            <p style="font-size:7px;color:#475569;text-transform:uppercase;">match pts</p>
                        </div>
                    </div>`:''}
                </div>`;
        }

        // IMPROVEMENT 2: Compact top-3 strip (replaces tall podium)
        function renderTop3Strip(top) {
            const el=document.getElementById('top3-strip');
            if(!el||top.length<3){if(el) el.innerHTML='';return;}
            const places=[
                {o:top[1],label:'2ND',h:'72px',gold:false},
                {o:top[0],label:'1ST',h:'90px',gold:true},
                {o:top[2],label:'3RD',h:'58px',gold:false},
            ];
            el.innerHTML=`<div style="display:flex;gap:5px;align-items:flex-end;">
                ${places.map(p=>{
                    const color=p.gold?'#f1c40f':getColor(p.o.id);
                    return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">
                        <p style="font-family:Orbitron,sans-serif;font-size:9px;font-weight:900;color:${p.gold?'#f1c40f':'#64748b'};text-transform:uppercase;${p.gold?'text-shadow:0 0 10px rgba(241,196,15,0.5);':''}">${p.o.first}</p>
                        <div style="width:100%;height:${p.h};background:rgba(255,255,255,0.03);border:1px solid ${p.gold?'rgba(241,196,15,0.3)':'rgba(255,255,255,0.06)'};border-bottom:none;border-radius:10px 10px 0 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;${p.gold?'box-shadow:0 -4px 20px rgba(241,196,15,0.1);':''}">
                            <p style="font-family:Orbitron,sans-serif;font-size:${p.gold?'20':'15'}px;font-weight:900;color:${color};${p.gold?'text-shadow:0 0 10px rgba(241,196,15,0.4);':''}">${p.o.score}</p>
                            <p style="font-size:7px;font-weight:700;color:#334155;letter-spacing:0.1em;">${p.label}</p>
                        </div>
                    </div>`;
                }).join('')}
            </div>`;
        }

        // IMPROVEMENT 8: Collapsible last match leaderboard
        function renderLastMatchCollapsible(active,pcRows,completedMatches) {
            const el=document.getElementById('last-match-collapsible');
            if(!el||!completedMatches.length){if(el) el.innerHTML='';return;}
            const lastMatch=completedMatches[completedMatches.length-1];
            const nameToId={};
            active.forEach(o=>{nameToId[fixID(o.full)]=o.id;nameToId[fixID(o.first)]=o.id;nameToId[o.id]=o.id;});
            const totals={};
            active.forEach(o=>totals[o.id]=0);
            pcRows.filter(r=>r[0]&&r[0].toString().trim()===lastMatch).forEach(r=>{
                const raw=fixID(r[2]);
                const id=nameToId[raw]||active.find(o=>raw.includes(o.id)||o.id.includes(raw))?.id;
                if(id) totals[id]=(totals[id]||0)+(parseFloat(r[6])||0);
            });
            const sorted=active.map(o=>({...o,matchPts:Math.round(totals[o.id]||0)})).sort((a,b)=>b.matchPts-a.matchPts);
            const maxPts=sorted[0]?.matchPts||1;
            el.innerHTML=`
                <div style="background:rgba(10,15,25,0.98);border:1px solid rgba(255,255,255,0.07);border-radius:16px;overflow:hidden;">
                    <div onclick="const b=this.parentElement.querySelector('#lm-body');b.classList.toggle('hidden');this.querySelector('#lm-chev').textContent=b.classList.contains('hidden')?'▼':'▲';"
                         style="display:flex;justify-content:space-between;align-items:center;padding:10px 15px;cursor:pointer;user-select:none;">
                        <p style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;letter-spacing:0.2em;color:#475569;text-transform:uppercase;">Last Match · ${lastMatch}</p>
                        <span id="lm-chev" style="color:#334155;font-size:10px;">▼</span>
                    </div>
                    <div id="lm-body" class="hidden" style="padding:0 15px 12px;display:flex;flex-direction:column;gap:7px;">
                        ${sorted.map((o,i)=>{
                            const c=getColor(o.id),pct=maxPts>0?Math.round((o.matchPts/maxPts)*100):0;
                            return `<div style="display:flex;align-items:center;gap:10px;">
                                <span style="font-size:8px;font-weight:900;color:${i===0?c:'#334155'};width:14px;">${i+1}</span>
                                <span style="font-size:10px;font-weight:800;color:${i===0?'#f1f5f9':'#94a3b8'};text-transform:uppercase;flex:1;">${o.first}</span>
                                <div style="flex:2;background:rgba(255,255,255,0.04);border-radius:3px;height:3px;overflow:hidden;">
                                    <div style="height:100%;width:${pct}%;background:${c};border-radius:3px;transition:width 0.8s;"></div>
                                </div>
                                <span style="font-family:Orbitron,sans-serif;font-size:9px;font-weight:900;color:${c};min-width:36px;text-align:right;">${o.matchPts}</span>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
        }

        function renderLeaderboard(owners,squads,cumulScores) {
            document.getElementById('leaderboard').innerHTML=owners.map((o,i)=>{
                const color=getColor(o.id);
                const squad=squads[o.id]||[];
                const cID='c-'+o.id.replace(/\s+/g,'-');
                const teams=getDominantTeams(squad);
                const logoBg=teams.length===0?''
                    :teams.length===1?`<div class="logo-bg">${teamBadgeSVG(teams[0],100)}</div>`
                    :`<div class="logo-bg" style="display:flex;gap:4px;width:140px;align-items:center;justify-content:center;">${teams.slice(0,2).map(t=>teamBadgeSVG(t,62)).join('')}</div>`;

                const _todayTeams=todaysTeams();
                const playerRows=squad.length===0
                    ?`<p style="font-size:10px;color:#475569;text-transform:uppercase;font-weight:700;letter-spacing:0.1em;text-align:center;padding:14px 0;">No players in squad</p>`
                    :squad.sort((a,b)=>b.act-a.act).map((p,idx)=>{
                        const isPlaying=_todayTeams.has((p.team||'').toString().trim().toUpperCase());
                        return `<div class="flex justify-between items-center ${p.act===0?'player-row-ghost':''}">
                            <div class="flex items-center flex-wrap" style="gap:0;">
                                <span class="text-[8px] font-bold text-gray-600 mr-3 w-3">${idx+1}</span>
                                <span class="text-[11px] font-bold text-gray-200">${p.name} <span class="team-tag">(${p.team})</span></span>
                                <span class="role-tag">${p.role}</span>
                                ${p.cvc?`<span class="badge font-cyber" style="color:${color};border-color:${color}">${p.cvc}</span>`:''}
                                ${isPlaying?'<span class="live-dot" title="Playing today"></span>':''}
                            </div>
                            <span class="font-cyber text-xs font-bold" style="color:${p.act>0?color:'#1e293b'}">${p.act}</span>
                        </div>`;
                    }).join('');

                const leader=owners.filter(o2=>o2.id!=='unsold')[0];
                // IMPROVEMENT 4: visible progress bar (3px, higher opacity track)
                const pct=(leader&&leader.score>0&&o.id!=='unsold')?Math.min(100,Math.round((o.score/leader.score)*100)):100;
                const gap=(leader&&o.id!==leader.id&&o.id!=='unsold')?leader.score-o.score:0;
                const above=i>0&&o.id!=='unsold'?owners[i-1]:null;
                const toOvertake=above?above.score-o.score+1:0;
                // IMPROVEMENT 7: rival badge inline (not absolute positioned)
                const isRival=i>0&&o.id!=='unsold'&&owners[i-1]&&(owners[i-1].score-o.score)<=30;

                return `
                <div id="${cID}" class="glass-card ${o.id==='unsold'?'opacity-40 mt-10':''}" style="--owner-color:${color};--owner-glow:${color}33">
                    ${logoBg}
                    <div class="p-4 flex justify-between items-center relative z-10" onclick="toggleSquad('${cID}')">
                        <div class="flex items-center gap-3">
                            <!-- IMPROVEMENT 5: small muted rank, large colored score -->
                            <span class="font-cyber" style="font-size:10px;font-weight:900;color:${i<3&&o.id!=='unsold'?color:'#1e293b'};min-width:16px;">${o.id==='unsold'?'•':i+1}</span>
                            <div>
                                <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;">
                                    <span class="font-black text-sm uppercase tracking-widest italic">${o.full}</span>
                                    <!-- IMPROVEMENT 7: rival badge inline, not floating -->
                                    ${isRival?`<span style="font-size:7px;font-weight:900;color:#f87171;background:rgba(248,113,113,0.1);border:1px solid rgba(248,113,113,0.25);border-radius:5px;padding:1px 5px;white-space:nowrap;">⚔️ ${owners[i-1].score-o.score} behind</span>`:''}
                                </div>
                                ${gap>0?`<p style="font-size:7px;font-weight:700;color:#1e293b;text-transform:uppercase;letter-spacing:0.1em;margin-top:1px;">−${gap} from #1</p>`:''}
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <div style="text-align:right;">

            }).sort((a,b)=>b.pot-a.pot);

                return `<div class="glass-card p-4" style="border-left:3px solid ${color};--owner-color:${color};--owner-glow:${color}33">

                        <div><span class="font-cyber text-[10px]" style="color:${color}">${icon} POTENTIAL RANK #${i+1}</span><h3 class="font-black uppercase italic text-sm mt-0.5">${d.full}</h3></div>

            'jan':'Jan','feb':'Feb','mar':'Mar','apr':'Apr','may':'May','jun':'Jun',
            'jul':'Jul','aug':'Aug','sep':'Sep','oct':'Oct','nov':'Nov','dec':'Dec'
        };
        const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

        function toCode(raw) {
            if (!raw) return 'TBD';
            const s = raw.toString().trim();
            const low = s.toLowerCase();
            if (TEAM_NAME_MAP[low]) return TEAM_NAME_MAP[low];
            if (s.length <= 4) return s.toUpperCase();
            return s;
        }

        function parseDate(raw) {
            if (!raw) return { display:'TBD', month:'Playoffs', dayStr:'', ts:null };
            const s = raw.toString().trim();
            const gm = s.match(/Date\((\d+),(\d+),(\d+)\)/);
            if (gm) {
                const dt = new Date(+gm[1], +gm[2], +gm[3]);
                return { display: String(dt.getDate()).padStart(2,'0') + ' ' + MONTH_SHORT[dt.toLocaleString('en',{month:'short'}).toLowerCase()], month: dt.toLocaleString('en',{month:'short'}) + ' ' + dt.getFullYear(), dayStr: DAY_NAMES[dt.getDay()], ts: dt };
            }
            const dm = s.match(/(\d{1,2})-([A-Za-z]+)-(\d{4})/);
            if (dm) {
                const d = parseInt(dm[1]), monStr = dm[2].toLowerCase(), y = parseInt(dm[3]);
                const monIdx = Object.keys(MONTH_SHORT).indexOf(monStr);
                const dt = new Date(y, monIdx >= 0 ? monIdx : 0, d);
                return { display: String(d).padStart(2,'0') + ' ' + (MONTH_SHORT[monStr] || dm[2]), month: (MONTH_SHORT[monStr] || dm[2]) + ' ' + y, dayStr: DAY_NAMES[dt.getDay()], ts: dt };
            }
            const iso = s.match(/(\d{4})-(\d{2})-(\d{2})/);
            if (iso) {
                const dt = new Date(+iso[1], +iso[2]-1, +iso[3]);
                const mon = MONTH_SHORT[dt.toLocaleString('en',{month:'short'}).toLowerCase()];
                return { display: String(dt.getDate()).padStart(2,'0') + ' ' + mon, month: mon + ' ' + dt.getFullYear(), dayStr: DAY_NAMES[dt.getDay()], ts: dt };
            }
            return { display: s, month: 'Upcoming', dayStr:'', ts:null };
        }

        function shortResult(raw, winnerFull) {
            if (!raw) return '';
            let s = raw.toString().trim();
            if (winnerFull) { const re = new RegExp('^' + winnerFull.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\s*', 'i'); s = s.replace(re, ''); }
            s = s.replace(/\bwickets\b/gi,'wkts').replace(/\bwicket\b/gi,'wkt');
            return s.length > 28 ? s.substring(0,26) + '…' : s;
        }

        function isToday(ts) {
            if (!ts) return false;
            const now = new Date();
            return ts.getDate()===now.getDate() && ts.getMonth()===now.getMonth() && ts.getFullYear()===now.getFullYear();
        }

        // IMPROVEMENT 6: TODAY label before 3:30 PM IST, LIVE after
        function getTodayLabel() {
            const now = new Date();
            const istOffset = 5.5 * 60;
            const utc = now.getTime() + now.getTimezoneOffset() * 60000;
            const ist = new Date(utc + istOffset * 60000);
            const totalMinutes = ist.getHours() * 60 + ist.getMinutes();
            const matchStart = 15 * 60 + 30; // 3:30 PM
            return totalMinutes >= matchStart
                ? { label: 'LIVE', color: '#4ade80', dot: '#4ade80' }
                : { label: 'TODAY', color: '#f1c40f', dot: '#f1c40f' };
        }

        // ── PLAYER SEARCH ──
        let _allPlayers = [];

            const { rosRows, pPoints } = _state;

                const team = (row[4]||'').toString().trim(), role = (row[6]||'').toString().trim();
                if (!name || fixID(owner).includes('owner')) return;
                const stats = pPoints[fixID(name)] || { act: 0 };
                _allPlayers.push({ name, owner, team, role, pts: Math.round(stats.act) });
            });
        }
        function onSearchInput(q) {

                    <div style="flex:1;min-width:0;">

                    </div>

        function closeSearch() { document.getElementById('player-search').value=''; document.getElementById('search-dropdown').style.display='none'; }

                    const arrow = document.createElement('span');

                    arrow.style.cssText = `font-size:10px;font-weight:900;color:${up?'#4ade80':'#f87171'};opacity:1;transition:opacity 2s;`;
                    rankEl.appendChild(arrow);

            });

        // ── STREAK TRACKER (now in Weekly tab) ──
        function renderStreakTracker(owners, cumulScores, completedMatches) {
            const el = document.getElementById('streak-tracker');
            if (!el || completedMatches.length === 0) return;
            const leadCount = {};
            owners.forEach(o => leadCount[o.id] = 0);
            for (let m = 0; m < completedMatches.length; m++) {
                let best=-1, bestId=null;
                owners.forEach(o => { const s=(cumulScores[o.id]||[])[m]||0; if(s>best){best=s;bestId=o.id;} });
                if (bestId) leadCount[bestId]++;
            }
            const leader = [...owners].sort((a,b) => b.score-a.score)[0];
            let streak = 0;
            if (leader) {
                for (let m = completedMatches.length-1; m >= 0; m--) {
                    let best=-1, bestId=null;
                    owners.forEach(o => { const s=(cumulScores[o.id]||[])[m]||0; if(s>best){best=s;bestId=o.id;} });
                    if (bestId === leader.id) streak++; else break;
                }
            }
            const sorted = [...owners].sort((a,b) => (leadCount[b.id]||0)-(leadCount[a.id]||0));
            const lc = leader ? getColor(leader.id) : '#f1c40f';
            el.innerHTML = `
                <div style="background:rgba(10,15,25,0.98);border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:16px 18px;margin-bottom:0;">

                        <div>

                        </div>
                        <div style="text-align:right;">
                            <p style="font-family:Orbitron,sans-serif;font-size:28px;font-weight:900;color:${lc};line-height:1;">${streak}</p>
                            <p style="font-size:8px;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:0.2em;">match days</p>
                        </div>
                    </div>` : ''}
                    <div style="display:flex;flex-direction:column;gap:8px;">
                        ${sorted.slice(0,5).map((o,i) => {
                            const c=getColor(o.id), cnt=leadCount[o.id]||0, pct=Math.round((cnt/completedMatches.length)*100);
                            return `<div style="display:flex;align-items:center;gap:10px;">
                                <span style="font-size:8px;font-weight:900;color:#334155;width:14px;">${i+1}</span>
                                <span style="font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;flex:1;">${o.first}</span>
                                <div style="flex:2;background:rgba(255,255,255,0.04);border-radius:4px;height:3px;overflow:hidden;">
                                    <div style="height:100%;width:${pct}%;background:${c};border-radius:4px;transition:width 0.8s;"></div>
                                </div>
                                <span style="font-family:Orbitron,sans-serif;font-size:9px;font-weight:900;color:${c};min-width:28px;text-align:right;">${cnt}d</span>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
        }

        // ── HALL OF FAME ──
        function renderHallOfFame(active, pcRows, completedMatches, squads) {
            const el = document.getElementById('hof-list');
            if (!el) return;
            const nameToId = {};
            active.forEach(o => { nameToId[fixID(o.full)]=o.id; nameToId[fixID(o.first)]=o.id; nameToId[o.id]=o.id; });
            const bestMatch = {}, matchRanks = {};
            let bestPlayer = { name:'—', pts:0, owner:'—', match:'—' };
            completedMatches.forEach(matchName => {
                const matchTotals = {};
                active.forEach(o => matchTotals[o.id]=0);
                pcRows.filter(r => r[0]&&r[0].toString().trim()===matchName).forEach(r => {
                    const raw=fixID(r[2]), id=nameToId[raw]||active.find(o=>raw.includes(o.id)||o.id.includes(raw))?.id;
                    if (!id) return;
                    const pts=parseFloat(r[6])||0;
                    matchTotals[id]=(matchTotals[id]||0)+pts;
                    if (pts>bestPlayer.pts) bestPlayer={name:r[1],pts:Math.round(pts),owner:r[2],match:matchName};
                });
                active.forEach(o => { const pts=Math.round(matchTotals[o.id]||0); if(!bestMatch[o.id]||pts>bestMatch[o.id].pts) bestMatch[o.id]={pts,matchName}; });
                matchRanks[matchName]=Object.entries(matchTotals).sort((a,b)=>b[1]-a[1]).map(([id])=>id);

            ].filter(Boolean);

                <div style="background:rgba(10,15,25,0.98);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:13px 18px;margin-bottom:10px;position:relative;overflow:hidden;">

                ${cards.map(c=>`

                        <div style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:28px;opacity:0.07;pointer-events:none;">${c.icon}</div>
                        <p style="font-family:Orbitron,sans-serif;font-size:7px;font-weight:900;letter-spacing:0.25em;color:#475569;text-transform:uppercase;margin-bottom:4px;">${c.icon} ${c.label}</p>
                        <div style="display:flex;justify-content:space-between;align-items:baseline;">
                            <p style="font-size:13px;font-weight:900;color:${c.color};text-transform:uppercase;">${c.name}</p>
                            <p style="font-family:Orbitron,sans-serif;font-size:15px;font-weight:900;color:${c.color};">${c.value}</p>
                        </div>
                        <p style="font-size:8px;color:#334155;margin-top:2px;">${c.sub}</p>
                    </div>`).join('')}
                <div style="background:rgba(10,15,25,0.98);border:1px solid rgba(255,255,255,0.07);border-radius:16px;padding:14px 16px;margin-top:4px;">
                    <p style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;letter-spacing:0.25em;color:#475569;text-transform:uppercase;margin-bottom:10px;">Personal Bests</p>
                    ${allBest.map(([id,data])=>{const o=active.find(x=>x.id===id);if(!o) return '';const c=getColor(id);return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:7px;"><div><span style="font-size:11px;font-weight:800;color:#94a3b8;text-transform:uppercase;">${o.first}</span><span style="font-size:8px;color:#334155;margin-left:6px;">${data.matchName}</span></div><span style="font-family:Orbitron,sans-serif;font-size:11px;font-weight:900;color:${c};">${data.pts}</span></div>`;}).join('')}
                </div>`;
        }

        // ── UNSOLD GEMS ──
        function renderGems(rosRows, pPoints, squads) {
            const el = document.getElementById('gems-list');
            if (!el) return;
            const gems = [];
            rosRows.forEach(row => {
                const name=(row[0]||'').toString().trim(), owner=fixID(row[1]||'');
                const team=(row[4]||'').toString().trim(), role=(row[6]||'').toString().trim();
                if (!name || (owner!=='unsold'&&owner!==''&&!owner.includes('unsold'))) return;
                const stats=pPoints[fixID(name)]||{act:0};
                if (stats.act>0) gems.push({name,team,role,pts:Math.round(stats.act)});
            });
            gems.sort((a,b)=>b.pts-a.pts);
            const totalMissed=gems.reduce((s,g)=>s+g.pts,0);
            el.innerHTML=`
                <div style="background:rgba(10,15,25,0.98);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:13px 18px;margin-bottom:10px;position:relative;overflow:hidden;">
                    <div style="position:absolute;top:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(72,219,251,0.5),transparent);"></div>
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div><p style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;letter-spacing:0.35em;color:#475569;text-transform:uppercase;margin-bottom:2px;">💎 Unsold</p><p style="font-family:Orbitron,sans-serif;font-size:13px;font-weight:900;color:#48dbfb;">Hidden Gems</p></div>
                        <div style="text-align:right;"><p style="font-family:Orbitron,sans-serif;font-size:18px;font-weight:900;color:#f87171;">${totalMissed}</p><p style="font-size:7px;color:#334155;text-transform:uppercase;font-weight:700;">pts missed</p></div>
                    </div>
                </div>
                ${gems.length===0?`<div style="text-align:center;padding:40px;color:#334155;font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;">No unsold players with points yet</div>`
                :gems.map((g,i)=>{const tc=TEAM_COLORS[g.team.toUpperCase()]||'#475569';return `<div style="background:rgba(10,15,25,0.98);border:1px solid rgba(72,219,251,${i<3?'0.25':'0.08'});border-left:3px solid ${i<3?'#48dbfb':'rgba(255,255,255,0.06)'};border-radius:13px;padding:11px 15px;margin-bottom:5px;display:flex;justify-content:space-between;align-items:center;${i<3?'box-shadow:0 0 12px -4px rgba(72,219,251,0.2);':''}"><div><div style="display:flex;align-items:center;gap:8px;"><span style="font-size:8px;font-weight:900;color:#334155;">${i+1}</span><p style="font-size:12px;font-weight:800;color:${i<3?'#f1f5f9':'#94a3b8'};">${g.name}</p></div><p style="font-size:8px;font-weight:700;margin-top:2px;"><span style="color:${tc}">${g.team}</span><span style="color:#334155;margin:0 4px;">·</span><span style="color:#475569;text-transform:uppercase;">${g.role}</span></p></div><div style="text-align:right;"><p style="font-family:Orbitron,sans-serif;font-size:${i<3?'16':'13'}px;font-weight:900;color:${i<3?'#48dbfb':'#334155'};">${g.pts}</p><p style="font-size:7px;color:#334155;text-transform:uppercase;">pts</p></div></div>`;}).join('')}`;
        }

        updateApp();
        startPolling();

        // ── PWA ──
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('[PWA] SW registered:', reg.scope))
                    .catch(err => console.warn('[PWA] SW registration failed:', err));
            });
        }
        let _deferredInstall = null;
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault(); _deferredInstall = e;
            setTimeout(() => {
                const btn = document.createElement('button');
                btn.textContent = '📲 Add to Home Screen';
                btn.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:500;font-size:10px;font-family:Orbitron,sans-serif;font-weight:900;letter-spacing:0.05em;padding:10px 18px;border-radius:20px;border:1px solid rgba(241,196,15,0.4);background:rgba(10,15,25,0.95);backdrop-filter:blur(12px);color:#f1c40f;cursor:pointer;white-space:nowrap;box-shadow:0 0 20px rgba(241,196,15,0.15);';
                btn.onclick = async () => { if(!_deferredInstall) return; _deferredInstall.prompt(); await _deferredInstall.userChoice; _deferredInstall=null; btn.remove(); };
                document.body.appendChild(btn);
                setTimeout(() => { btn.style.opacity='0'; setTimeout(()=>btn.remove(),500); }, 10000);
            }, 4000);
        });
        const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
        if (isIOS && !window.navigator.standalone && !localStorage.getItem('revo-ios-hint')) {
            setTimeout(() => {
                localStorage.setItem('revo-ios-hint','1');
                const toast = document.createElement('div');
                toast.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:500;font-size:10px;font-family:Orbitron,sans-serif;font-weight:700;padding:12px 18px;border-radius:18px;border:1px solid rgba(241,196,15,0.3);background:rgba(10,15,25,0.96);backdrop-filter:blur(16px);color:#94a3b8;text-align:center;max-width:280px;line-height:1.5;box-shadow:0 0 20px rgba(0,0,0,0.4);';
                toast.innerHTML = '📲 <span style="color:#f1c40f">Add to Home Screen</span><br>Tap Share → "Add to Home Screen" to install';
                document.body.appendChild(toast);
                setTimeout(() => { toast.style.opacity='0'; toast.style.transition='opacity 0.5s'; setTimeout(()=>toast.remove(),500); }, 7000);
            }, 5000);
        }
    </script>
</body>
</html>
