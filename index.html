<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>REVOLUTION IPL 2026</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#020617">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Revo IPL">
    <link rel="apple-touch-icon" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #f1c40f; 
            --bg-void: #020617;
            --glass: rgba(15, 23, 42, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --font-main: 'Plus Jakarta Sans', sans-serif;
            --font-cyber: 'Orbitron', sans-serif;
            --text1: #f8fafc; --text2: #cbd5e1; --text3: #94a3b8; --text4: #64748b;
        }

        body.light {
            --bg-void: #f1f5f9;
            --glass: rgba(255, 255, 255, 0.85);
            --glass-border: rgba(0, 0, 0, 0.1);
            --text1: #0f172a; --text2: #334155; --text3: #475569; --text4: #94a3b8;
        }

        body {
            background: var(--bg-void);
            color: var(--text1);
            font-family: var(--font-main);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            transition: background 0.4s, color 0.4s;
        }

        /* High-End Background Mesh with Dynamic Theming Support */
        .mesh-bg {
            position: fixed;
            inset: 0;
            z-index: -1;
            background: 
                radial-gradient(circle at 0% 0%, var(--mesh-c1, rgba(30, 58, 138, 0.12)) 0%, transparent 40%),
                radial-gradient(circle at 100% 100%, var(--mesh-c2, rgba(241, 196, 15, 0.04)) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, var(--bg-void) 0%, var(--bg-void) 100%);
            transition: background 1s ease-in-out;
        }

        body.light .mesh-bg {
            background: 
                radial-gradient(circle at 0% 0%, var(--mesh-c1, rgba(59, 130, 246, 0.1)) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, var(--mesh-c2, rgba(245, 158, 11, 0.1)) 0%, transparent 50%);
        }

        /* Staggered Entry Animation */
        @keyframes slideUpFade {
            from { opacity: 0; transform: translateY(20px) scale(0.97); filter: blur(4px); }
            to { opacity: 1; transform: translateY(0) scale(1); filter: blur(0); }
        }

        .stagger-item {
            opacity: 0;
            animation: slideUpFade 0.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        /* Component Styles */
        .glass-panel {
            background: var(--glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .aura-glow {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top right, var(--owner-color, transparent) 0%, transparent 70%);
            opacity: 0.15;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .glass-panel:hover .aura-glow { opacity: 0.25; }

        /* Liquid Glass Navigation Dock */
        .nav-dock {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 24px);
            max-width: 420px;
            background: rgba(15, 23, 42, 0.25);
            backdrop-filter: blur(40px) saturate(250%);
            -webkit-backdrop-filter: blur(40px) saturate(250%);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.18);
            padding: 6px;
            border-radius: 40px;
            display: flex;
            justify-content: space-around;
            z-index: 2000;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }
        
        body.light .nav-dock { 
            background: rgba(255, 255, 255, 0.35); 
            border: 1px solid rgba(0, 0, 0, 0.05);
            border-top: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1), inset 0 1px 0 rgba(255, 255, 255, 0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 2px;
            padding: 8px 10px;
            border-radius: 24px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            color: var(--text4);
        }

        .nav-item.active {
            background: var(--accent);
            color: #000;
            box-shadow: 0 4px 16px rgba(241, 196, 15, 0.3);
        }

        .nav-icon { font-size: 18px; }
        .nav-label { font-size: 8px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.05em; font-family: var(--font-cyber); }

        /* Typography & Effects */
        .font-cyber { font-family: var(--font-cyber); }
        .font-main { font-family: var(--font-main); }
        .gold-glow {
            background: linear-gradient(90deg, #f1c40f, #fff7ad, #f1c40f);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 3s linear infinite;
        }
        body.light .gold-glow { 
            background: linear-gradient(90deg, #b8860b, #d4af37, #b8860b);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        @keyframes shimmer { to { background-position: 200% center; } }

        .active-scale:active { transform: scale(0.96); }

        ::-webkit-scrollbar { width: 0px; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        .pillar {
            height: 0;
            width: 100%;
            border-radius: 12px 12px 4px 4px;
            background: linear-gradient(to top, var(--p-color) 30%, transparent);
            opacity: 0.2;
            transition: height 1s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        body.light .pillar { opacity: 0.4; }

        .squad-container { display: none; padding: 0 20px 20px; border-top: 1px solid var(--glass-border); }
        .squad-container.open { display: block; animation: slideIn 0.3s ease-out; }
        @keyframes slideIn { from{opacity:0;transform:translateY(-10px)} to{opacity:1;transform:translateY(0)} }

        .player-row-ghost { opacity: 0.3; filter: grayscale(1); }

        .role-tag { font-size: 7px; padding: 2px 6px; border-radius: 5px; background: rgba(255,255,255,0.05); color: var(--text3); text-transform: uppercase; font-weight: 700; margin-left: 5px; }
        body.light .role-tag { background: rgba(0,0,0,0.05); }

        @keyframes livePulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.4;transform:scale(0.7)} }
        .live-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; margin-left: 6px; flex-shrink: 0; animation: livePulse 1.2s ease-in-out infinite; box-shadow: 0 0 7px #4ade80; }

        #splash {
            position: fixed; inset: 0; z-index: 9999;
            background: #020617;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            transition: opacity 0.8s ease, transform 0.8s ease;
        }
        #splash.hide { opacity: 0; transform: scale(1.05); pointer-events: none; }
        
        .loader-ring {
            width: 70px; height: 70px;
            border-radius: 50%;
            border: 3px solid transparent;
            border-top-color: #f1c40f;
            border-right-color: #f1c40f;
            animation: spinRing 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
            position: relative;
        }
        .loader-ring::after {
            content: ''; position: absolute; inset: 4px; border-radius: 50%;
            border: 3px solid transparent;
            border-left-color: #eab308;
            border-bottom-color: #eab308;
            animation: spinRing 1s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite reverse;
        }
        @keyframes spinRing { to { transform: rotate(360deg); } }

        .error-banner { background:rgba(220,38,38,0.1); border:1px solid rgba(220,38,38,0.3); border-radius:16px; padding:12px 16px; margin-bottom:14px; display:flex; align-items:center; gap:12px; }
        .sched-pill { font-family: var(--font-cyber); font-size: 9px; font-weight: 900; padding: 6px 14px; border-radius: 20px; border: 1px solid var(--glass-border); background: var(--glass); color: var(--text3); cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .sched-pill.active { transform: scale(1.05); box-shadow: 0 0 12px -2px currentColor; opacity: 1!important; }
        .share-btn { font-size: 8px; font-family: var(--font-cyber); font-weight: 900; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.05); color: var(--text1); transition: 0.2s; cursor: pointer; }
        body.light .share-btn { border-color: rgba(0,0,0,0.1); background: rgba(0,0,0,0.05); }
        .today-glow { border-color: rgba(241, 196, 15, 0.5) !important; background: rgba(241, 196, 15, 0.08) !important; box-shadow: 0 0 20px rgba(241, 196, 15, 0.15); }
    </style>
</head>
<body class="p-4 pb-32">
    <div class="mesh-bg"></div>
    <div id="search-overlay" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[2000] transition-opacity duration-300"></div>

    <!-- SPLASH SCREEN -->
    <div id="splash" onclick="dismissSplash()">
        <div class="loader-ring mb-10"></div>
        <h1 class="text-3xl font-extrabold tracking-[0.3em] uppercase text-white mb-2" style="font-family: 'Plus Jakarta Sans', sans-serif;">REVOLUTION</h1>
        <p class="text-[10px] font-bold tracking-[0.5em] text-yellow-500 uppercase mb-12">IPL 2026</p>
        <div class="flex items-center gap-2 px-4 py-2 rounded-full border border-white/5 bg-white/5 backdrop-blur-md">
            <span class="w-1.5 h-1.5 rounded-full bg-yellow-500 animate-pulse shadow-[0_0_8px_#eab308]"></span>
            <p class="text-[8px] font-bold tracking-widest text-[var(--text2)] uppercase">Syncing Live Data</p>
        </div>
        <p class="text-[8px] font-bold text-slate-600 uppercase tracking-widest absolute bottom-8">Designed by Vedant Bhansali</p>
    </div>

    <!-- PLAYER STAT MODAL -->
    <div id="player-stat-overlay" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-[3000] hidden opacity-0 transition-opacity duration-300" onclick="window.closePlayerStats()"></div>
    <div id="player-stat-sheet" class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-xl bg-[var(--bg-void)] border-t border-[var(--glass-border)] rounded-t-3xl z-[3001] translate-y-full transition-transform duration-300 flex flex-col max-h-[80vh] shadow-[0_-10px_40px_rgba(0,0,0,0.5)]">
        <div class="p-5 flex justify-between items-center border-b border-[var(--glass-border)] bg-white/5">
            <div>
                <p id="ps-team" class="text-[9px] font-black uppercase tracking-widest text-[var(--text4)]">TEAM</p>
                <h2 id="ps-name" class="font-cyber text-lg font-black text-[var(--text1)] mt-0.5">PLAYER NAME</h2>
            </div>
            <div class="text-right">
                <p id="ps-total" class="font-cyber text-3xl font-black text-yellow-500 leading-none">0</p>
                <p class="text-[7px] font-black uppercase tracking-widest text-[var(--text4)] mt-1">Total Pts</p>

        </div>
        <div class="p-5 overflow-y-auto no-scrollbar flex-1" id="ps-content"></div>
        <div class="p-4 border-t border-[var(--glass-border)] bg-black/20">
            <button onclick="window.closePlayerStats()" class="w-full py-3.5 rounded-xl bg-white/5 border border-[var(--glass-border)] text-xs font-bold text-[var(--text1)] active-scale uppercase tracking-widest">Close Player</button>
        </div>
    </div>

    <div class="max-w-xl mx-auto">
        <!-- HEADER -->
        <header id="main-header" class="stagger-item relative transition-all duration-300" style="animation-delay: 0.1s">
            <div class="flex justify-between items-start mb-5 gap-2">
                <div class="flex-1">
                    <p class="text-[9px] font-bold tracking-[0.4em] text-[var(--text4)] uppercase mb-1">Season 2026</p>
                    <h1 class="text-3xl sm:text-4xl font-black font-cyber italic gold-glow leading-tight tracking-tighter">REVOLUTION</h1>
                </div>
                <div class="flex flex-col items-end gap-2 flex-shrink-0">
                    <div id="match-counter" class="text-[9px] font-black text-yellow-500 font-cyber opacity-80 tracking-widest text-right mt-1">MATCHES: —/74</div>
                    <button onclick="toggleTheme()" id="theme-toggle" class="w-8 h-8 rounded-full glass-panel flex items-center justify-center text-xs active-scale">🌙</button>
                </div>
            </div>

            <div class="relative mb-5" id="search-container">
                <input id="player-search" type="text" placeholder="Search player or owner..." 
                    oninput="onSearchInput(this.value)" onfocus="showSearchOverlay(); onSearchInput(this.value)"
                    class="w-full glass-panel py-3.5 pl-11 pr-4 text-xs font-semibold outline-none focus:border-yellow-500/40 transition-all placeholder:text-[var(--text4)] bg-transparent text-[var(--text1)] shadow-sm">
                <svg class="absolute left-4 top-1/2 -translate-y-1/2 opacity-30 text-[var(--text1)]" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                <div id="search-dropdown" class="hidden absolute top-full left-0 right-0 mt-2 glass-panel max-h-64 overflow-y-auto shadow-2xl"></div>
            </div>
        </header>

        <!-- DISCOVERY SCROLL -->
        <div id="discovery-tabs" class="flex gap-2.5 overflow-x-auto no-scrollbar pb-1 mb-6 stagger-item relative" style="animation-delay: 0.15s">
            <button onclick="switchTab('hof')" id="btn-hof" class="flex-shrink-0 px-4 py-2.5 glass-panel whitespace-nowrap text-[9px] font-black uppercase tracking-widest active-scale text-[var(--text2)] border-yellow-500/30">🏆 Hall of Fame</button>
            <button onclick="switchTab('gems')" id="btn-gems" class="flex-shrink-0 px-4 py-2.5 glass-panel whitespace-nowrap text-[9px] font-black uppercase tracking-widest active-scale text-[var(--text2)]">💎 Unsold Gems</button>
            <button onclick="switchTab('weekly')" id="btn-weekly" class="flex-shrink-0 px-4 py-2.5 glass-panel whitespace-nowrap text-[9px] font-black uppercase tracking-widest active-scale text-[var(--text2)]">📊 Weekly Recap</button>
            <button onclick="switchTab('strategy')" id="btn-strat" class="flex-shrink-0 px-4 py-2.5 glass-panel whitespace-nowrap text-[9px] font-black uppercase tracking-widest active-scale text-[var(--text2)]">🎯 Luckiest</button>
            <button onclick="switchTab('h2h')" id="btn-h2h" class="flex-shrink-0 px-4 py-2.5 glass-panel whitespace-nowrap text-[9px] font-black uppercase tracking-widest active-scale text-[var(--text2)]">⚔️ Head-to-Head</button>
        </div>

        <div id="error-banner" class="error-banner hidden relative z-10">

                <p id="error-msg" class="text-[9px] text-red-300 opacity-80">Retrying in 60s...</p>
            </div>
            <button onclick="updateApp()" class="text-[9px] font-black uppercase tracking-widest text-red-400 border border-red-500/30 rounded-lg px-3 py-1.5 active-scale">Retry</button>
        </div>

        <div id="view-main" class="space-y-4 pb-8 relative z-10">

            <div id="top3-strip" class="flex items-end gap-2 px-1 min-h-[140px]"></div>
            <div id="mvp-spotlight"></div>
            <div id="last-match-collapsible"></div>
            <div id="leaderboard" class="space-y-3"></div>
        </div>

        <div id="view-livepoints" class="hidden space-y-4 pb-8 relative z-10"><div id="live-points-list"></div></div>
        <div id="view-schedule" class="hidden space-y-4 pb-8 relative z-10">
            <div id="schedule-filters" class="flex flex-wrap gap-2 justify-center mb-2 px-1"></div>

            <div id="schedule-list" class="space-y-3"></div>
        </div>
        <div id="view-standings" class="hidden space-y-4 pb-8 relative z-10"><div id="standings-list"></div></div>
        <div id="view-hof" class="hidden space-y-4 pb-8 relative z-10"><div id="hof-list"></div></div>
        <div id="view-gems" class="hidden space-y-4 pb-8 relative z-10"><div id="gems-list"></div></div>

            <div id="streak-tracker"></div>

        </div>
        <div id="view-strategy" class="hidden space-y-4 pb-8 relative z-10"><div id="strategy-list" class="space-y-3"></div></div>
        
        <div id="view-h2h" class="hidden space-y-4 pb-8 relative z-10">
            <div class="glass-panel p-4 mb-3">
                <p class="font-cyber text-[8px] font-black tracking-widest text-[var(--text4)] uppercase mb-3 text-center">Tactical Matchup</p>
                <div class="flex items-center gap-2">
                    <select id="h2h-p1" onchange="window.haptic(10); updateH2H()" class="flex-1 bg-[var(--bg-void)] border border-[var(--glass-border)] rounded-lg p-2 text-[10px] sm:text-xs font-bold text-[var(--text1)] outline-none appearance-none text-center"></select>

                    <select id="h2h-p2" onchange="window.haptic(10); updateH2H()" class="flex-1 bg-[var(--bg-void)] border border-[var(--glass-border)] rounded-lg p-2 text-[10px] sm:text-xs font-bold text-[var(--text1)] outline-none appearance-none text-center"></select>

            <div id="h2h-content"></div>

    </div>

    <nav class="nav-dock">
        <button onclick="switchTab('main')" id="nav-main" class="nav-item active active-scale flex-1">
            <span class="nav-icon">📊</span><span class="nav-label">Ranks</span>
        </button>
        <button onclick="switchTab('livepoints')" id="nav-livepoints" class="nav-item active-scale relative flex-1">
            <span class="nav-icon">🔴</span><span class="nav-label">Live</span>
            <span id="live-tab-dot" class="hidden absolute top-2 right-4 w-2 h-2 rounded-full bg-emerald-500 shadow-[0_0_8px_#10b981] animate-pulse"></span>
        </button>
        <button onclick="switchTab('schedule')" id="nav-schedule" class="nav-item active-scale flex-1">
            <span class="nav-icon">🗓️</span><span class="nav-label">Events</span>
        </button>
        <button onclick="switchTab('standings')" id="nav-standings" class="nav-item active-scale flex-1">
            <span class="nav-icon">🏟️</span><span class="nav-label">Table</span>
        </button>
    </nav>

    <button id="scroll-top-btn" onclick="window.scrollTo({top:0,behavior:'smooth'}); window.haptic(15);"
        class="hidden fixed bottom-24 right-4 z-[500] w-10 h-10 rounded-full glass-panel flex items-center justify-center text-yellow-500 font-bold shadow-lg active-scale border-yellow-500/30">↑</button>

    <script>
        window.haptic = function(pattern = 15) { if (navigator.vibrate) { try { navigator.vibrate(pattern); } catch(e) {} } };

        window._appStartTime = Date.now();
        const SHEET_ID = '1xIRCNr0tteFfMk6l7inIkKeSJMb7WLBswsXepHRqjio';
        const TOTAL_SEASON_MATCHES = 74;
        const SITE_URL = 'revolution-ipl-2026.vercel.app';

        const ownerColors = {
            vedant:'#3498db',deep:'#e74c3c',shlok:'#2ecc71',rahul:'#9b59b6',
            soni:'#f1c40f',dheer:'#e67e22',kunal:'#1abc9c',puneet:'#ff9f43',
            vivek:'#54a0ff',bokaria:'#5f27cd',prakshal:'#48dbfb',rishi:'#ff6b6b',
            aamer:'#1dd1a1',yashshah:'#f368e0',jash:'#e67e22',
        };

        const IPL_TEAMS = {
            MI:{color:'#004BA0',accent:'#89CFF0'},CSK:{color:'#F4C430',accent:'#ffffff'},
            RCB:{color:'#C8102E',accent:'#FFD700'},KKR:{color:'#3A225D',accent:'#B8960C'},
            SRH:{color:'#F26522',accent:'#1a1a1a'},DC:{color:'#00529A',accent:'#E8001C'},
            PBKS:{color:'#ED1C24',accent:'#DCDDDF'},RR:{color:'#EA1A85',accent:'#254AA5'},
            GT:{color:'#1D4E89',accent:'#C8A84B'},LSG:{color:'#A4D65E',accent:'#1a1a1a'},
        };
        const TEAM_COLORS = { RCB:'#C8102E', MI:'#004BA0', CSK:'#F4C430', KKR:'#3A225D', SRH:'#F26522', RR:'#EA1A85', PBKS:'#ED1C24', GT:'#1D4E89', LSG:'#A4D65E', DC:'#00529A', TBD:'#64748b' };

        function getShortTeam(name) {
            if (!name) return '';
            const n = name.toString().toUpperCase().trim();
            if (n.includes('MUMBAI')) return 'MI'; if (n.includes('CHENNAI')) return 'CSK';
            if (n.includes('ROYAL CHALLENGERS')) return 'RCB'; if (n.includes('KOLKATA')) return 'KKR';
            if (n.includes('SUNRISERS')) return 'SRH'; if (n.includes('DELHI')) return 'DC';
            if (n.includes('PUNJAB')) return 'PBKS'; if (n.includes('RAJASTHAN')) return 'RR';
            if (n.includes('GUJARAT')) return 'GT'; if (n.includes('LUCKNOW')) return 'LSG';
            if (TEAM_COLORS[n]) return n;
            const acr = n.split(/[\s_]+/).map(w=>w[0]).join(''); return acr === 'PK' ? 'PBKS' : acr;
        }

        const fixID = s => s ? s.toString().toLowerCase().trim() : '';
        window.getColor = function(raw) {
            const n = fixID(raw);
            if (ownerColors[n]) return ownerColors[n];

        async function fetchSheet(name) {
            const url=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=0&sheet=${encodeURIComponent(name)}`;
            const r=await fetch(url);
            if(!r.ok) throw new Error(`HTTP Error: ${r.status} on sheet ${name}`);
            const t=await r.text();
            try {
                const startIdx = t.indexOf('{'), endIdx = t.lastIndexOf('}');
                if (startIdx === -1 || endIdx === -1) { if (t.toLowerCase().includes('<html')) throw new Error(`Access Denied! Check Sheet sharing.`); throw new Error(`Invalid data.`); }
                const j = JSON.parse(t.substring(startIdx, endIdx + 1));
                if (j.status === 'error') throw new Error(`Google Sheets Error`);
                if (!j.table || !j.table.rows) return [];
                return j.table.rows.map(row => row.c.map(cell => cell ? (cell.v !== null ? cell.v : '') : ''));
            } catch(e) { throw e; }
        }

                });

        function buildCumulScores(owners,pcRows,completedMatches) {
            const cumul={}, running={}; owners.forEach(o=>{cumul[o.id]=[];running[o.id]=0;});
            const nameToId={}; owners.forEach(o=>{nameToId[fixID(o.full)]=o.id;nameToId[fixID(o.first)]=o.id;nameToId[o.id]=o.id;});
            completedMatches.forEach(matchName=>{
                const totals={};
                pcRows.filter(r=>r[0]&&r[0].toString().trim()===matchName&&r[2]).forEach(r=>{
                    const raw=fixID(r[2]), id=nameToId[raw]||owners.find(o=>raw.includes(o.id)||o.id.includes(raw))?.id;
                    if(id) totals[id]=(totals[id]||0)+(parseFloat(r[6])||0);
                });
                owners.forEach(o=>{running[o.id]+=(totals[o.id]||0);cumul[o.id].push(Math.round(running[o.id]));});
            });
            return cumul;
        }

                owners.forEach(o => { const s=(cumulScores[o.id]||[])[m]||0; if(s>best){best=s;bestId=o.id;} });
                if (bestId) leadCount[bestId]++;
            }
            const leader = [...owners].sort((a,b) => b.score-a.score)[0]; let streak = 0;
            if (leader) {
                for (let m = completedMatches.length-1; m >= 0; m--) {

                    <div class="glass-panel overflow-hidden">

                            <thead class="bg-white/5 font-cyber text-[var(--text4)] uppercase"><tr><th class="p-2 pl-4">Player</th><th class="p-2 text-right">R</th><th class="p-2 text-right">W</th><th class="p-2">Own</th><th class="p-2 pr-4 text-right">Pts</th></tr></thead>
                            <tbody>
                                ${mRows.map(d => {
                                    const oc = window.getColor(d.owner), tc = TEAM_COLORS[d.team?.toUpperCase()]||'var(--text4)';
                                    return `<tr class="border-t border-[var(--glass-border)]"><td class="p-2 pl-4"><p class="font-bold text-[var(--text1)]">${d.player}</p><p class="text-[7px] font-black uppercase" style="color:${tc}">${d.team}</p></td><td class="p-2 text-right font-cyber font-bold text-[var(--text2)]">${d.runs||'—'}</td><td class="p-2 text-right font-cyber font-bold text-emerald-400">${d.wickets||'—'}</td><td class="p-2 font-bold uppercase truncate max-w-[40px]" style="color:${oc}">${(d.owner||'—').split(' ')[0]}</td><td class="p-2 pr-4 text-right font-cyber font-black text-sm" style="color:${d.points>0?oc:'var(--text4)'}">${d.points||'—'}</td></tr>`;
                                }).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>`;
            }).join('<div class="h-4"></div>');
        }

        const SCHEDULE = [
            {m:1, date:'28 Mar', t1:'RCB', t2:'SRH'}, {m:2, date:'29 Mar', t1:'MI', t2:'KKR'},
            {m:3, date:'30 Mar', t1:'RR', t2:'CSK'}, {m:4, date:'31 Mar', t1:'PBKS', t2:'GT'},
            {m:5, date:'01 Apr', t1:'LSG', t2:'DC'}
        ];

        function parseDate(raw) {
            if (!raw) return { ts:null, display:'TBD' };
            const s = raw.toString().trim(), gm = s.match(/Date\((\d+),(\d+),(\d+)\)/i);
            if(gm) { const dt = new Date(+gm[1], +gm[2], +gm[3]); return { ts:dt, display: `${String(dt.getDate()).padStart(2,'0')} ${dt.toLocaleString('en',{month:'short'})}` }; }
            const parts = s.split(/[-/ \.]/);
            if (parts.length >= 2) {
                const d = parseInt(parts[0], 10);
                let m = parseInt(parts[1], 10) - 1;
                if (isNaN(m)) { const mNames = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"]; m = mNames.findIndex(mn => parts[1].toLowerCase().includes(mn)); }
                const y = parts[2] ? parseInt(parts[2], 10) : new Date().getFullYear();
                if (!isNaN(d) && !isNaN(m) && m >= 0) { const dt2 = new Date(y, m, d); if (!isNaN(dt2.getTime())) return { ts: dt2, display: `${String(dt2.getDate()).padStart(2,'0')} ${dt2.toLocaleString('en',{month:'short'})}` }; }
            }
            const dt = new Date(s); if (!isNaN(dt.getTime())) return { ts: dt, display: `${String(dt.getDate()).padStart(2,'0')} ${dt.toLocaleString('en',{month:'short'})}` };
            return { ts:null, display: s.substring(0,6) };
        }

        function isToday(ts) {
            if(!ts) return false; const now = new Date();
            return ts.getDate() === now.getDate() && ts.getMonth() === now.getMonth();
        }

        function todaysTeams() {
            const rows = window._state?.schedRows || [], playing = new Set(), source = rows.length ? rows : SCHEDULE;
            const now = new Date(), dStr = String(now.getDate()), dPad = dStr.padStart(2, '0');
            const mNames = ["jan", "feb", "mar", "apr", "may", "jun", "jul", "aug", "sep", "oct", "nov", "dec"], mStr = mNames[now.getMonth()], mNum = String(now.getMonth() + 1).padStart(2, '0');
            source.forEach(r => {
                const rawDate = (r.date || r[1] || '').toString().toLowerCase(), t1 = getShortTeam(r.t1 || r[3]), t2 = getShortTeam(r.t2 || r[4]), d = parseDate(rawDate);
                let isMatchToday = false;
                if (d.ts && isToday(d.ts)) isMatchToday = true;
                else if ((rawDate.includes(dStr) || rawDate.includes(dPad)) && (rawDate.includes(mStr) || rawDate.includes(mNum))) isMatchToday = true;
                if (isMatchToday) { if (t1) playing.add(t1); if (t2) playing.add(t2); }
            });
            return playing;
        }

        function renderTodayBar(schedRows) {
            const el = document.getElementById('today-match-bar'); let todayMatches = [];
            (schedRows.length ? schedRows : SCHEDULE).forEach(r => {
                const d = parseDate(r.date || r[1]); if (d.ts && isToday(d.ts)) todayMatches.push({ t1: getShortTeam(r.t1 || r[3]), t2: getShortTeam(r.t2 || r[4]) });
            });
            if(!todayMatches.length) { el.innerHTML=''; return; }
            el.innerHTML = todayMatches.map(tm => `
                <div class="glass-panel p-4 mb-4 border-yellow-500/30 flex items-center justify-between stagger-item bg-yellow-500/5">
                    <div class="flex items-center gap-2"><span class="w-2 h-2 rounded-full bg-yellow-500 animate-pulse shadow-[0_0_8px_#eab308]"></span><p class="font-cyber text-[9px] font-black uppercase tracking-widest text-yellow-500">Today</p></div>
                    <div class="flex gap-3 items-center">
                        <span class="font-cyber font-black text-sm" style="color:${TEAM_COLORS[tm.t1]||'#fff'}; text-shadow:0 0 10px ${TEAM_COLORS[tm.t1]}88">${tm.t1}</span>
                        <span class="text-[8px] font-black text-[var(--text4)]">VS</span>
                        <span class="font-cyber font-black text-sm" style="color:${TEAM_COLORS[tm.t2]||'#fff'}; text-shadow:0 0 10px ${TEAM_COLORS[tm.t2]}88">${tm.t2}</span>
                    </div>
                </div>`).join('');
        }

        function renderScheduleFilters() {
            const el = document.getElementById('schedule-filters'), teams = ['ALL', 'MI', 'CSK', 'RCB', 'KKR', 'SRH', 'DC', 'PBKS', 'RR', 'GT', 'LSG'];
            el.innerHTML = teams.map(t => `<button class="sched-pill ${t==='ALL'?'active':''}" data-team="${t}" onclick="window.haptic(10); filterSchedule('${t}')" style="${t!=='ALL'?`border-color:${TEAM_COLORS[t]}55; color:${TEAM_COLORS[t]}`:''}">${t}</button>`).join('');
        }

        window.filterSchedule = function(team) {
            document.querySelectorAll('.sched-pill').forEach(b => b.classList.toggle('active', b.dataset.team === team));
            document.querySelectorAll('.sched-row').forEach(row => { row.style.display = (team === 'ALL' || row.dataset.t1 === team || row.dataset.t2 === team) ? '' : 'none'; });
            const vis = document.querySelectorAll('.sched-row:not([style*="display: none"])'), done = Array.from(vis).filter(r => r.dataset.done === 'true').length;
            document.getElementById('sched-stats').innerHTML = `<div class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-emerald-500"></span><span class="font-cyber text-[8px] font-black text-emerald-500 tracking-widest">${done} PLAYED</span></div><div class="flex items-center gap-1.5"><span class="w-1.5 h-1.5 rounded-full bg-yellow-500"></span><span class="font-cyber text-[8px] font-black text-yellow-500 tracking-widest">${vis.length - done} REMAINING</span></div>`;
        }

        function renderSchedule(rows) {
            const el = document.getElementById('schedule-list'), data = rows.filter(r => r[0] && !isNaN(parseInt(r[0])));
            el.innerHTML = data.map((m, i) => {
                const isDone = !!m[6], d = parseDate(m[1]), isTodayMatch = isToday(d.ts), t1 = getShortTeam(m[3]), t2 = getShortTeam(m[4]);
                return `
                <div class="glass-panel p-4 flex items-center justify-between sched-row stagger-item active-scale ${isTodayMatch ? 'today-glow' : ''}" data-t1="${t1}" data-t2="${t2}" data-done="${isDone}" style="animation-delay: ${(i%10)*0.05}s">
                    <div class="text-center min-w-[40px] pr-3 border-r border-[var(--glass-border)]"><p class="font-cyber text-[9px] font-black text-[var(--text4)]">M${m[0]}</p><p class="text-[10px] font-bold text-[var(--text2)] mt-0.5 whitespace-nowrap">${d.display}</p></div>
                    <div class="flex-1 px-4 flex flex-col items-center"><div class="flex items-center gap-3 w-full justify-center"><span class="font-cyber font-black text-xs flex-1 text-right" style="color:${TEAM_COLORS[t1]||'#fff'}">${t1}</span><span class="text-[8px] font-black text-[var(--text4)]">VS</span><span class="font-cyber font-black text-xs flex-1 text-left" style="color:${TEAM_COLORS[t2]||'#fff'}">${t2}</span></div></div>
                    <div class="min-w-[50px] text-center flex flex-col justify-center">${isDone ? `<p class="font-cyber text-[10px] font-black text-emerald-400">${m[6]}</p><p class="text-[6px] font-bold text-[var(--text4)] mt-1 uppercase truncate max-w-[60px]">${m[7]}</p>` : `<p class="font-cyber text-[8px] font-black text-yellow-500/50">${m[2]||'TBA'}</p>`}</div>
                </div>`;
            }).join('');
            window.filterSchedule('ALL');
        }

        function renderStandings(rows) {
            const el = document.getElementById('standings-list'), data = rows.filter(r => r[0] && !isNaN(parseInt(r[0]))); if(!data.length) return;
            el.innerHTML = `
                <div class="glass-panel p-4 mb-3 flex justify-between items-center stagger-item">
                    <div><p class="font-cyber text-[8px] font-black tracking-widest text-[var(--text4)] uppercase mb-1">IPL 2026</p><h2 class="font-cyber text-sm font-black text-yellow-500">Points Table</h2></div>
                    <div class="text-right"><p class="text-[7px] font-black tracking-widest text-[var(--text3)] uppercase">Tap team</p><p class="text-[9px] font-black tracking-widest text-[var(--text1)] uppercase">To Theme App</p></div>
                </div>
                <div class="glass-panel overflow-hidden stagger-item" style="animation-delay: 0.1s">
                    <table class="w-full text-left text-[10px]">
                        <thead class="bg-white/5 font-cyber text-[var(--text4)] uppercase"><tr><th class="p-3 text-center">#</th><th class="p-3">Team</th><th class="p-3 text-center">P</th><th class="p-3 text-center">W</th><th class="p-3 text-center">L</th><th class="p-3 text-right">Pts</th><th class="p-3 text-right">NRR</th><th class="p-3 text-center">St</th></tr></thead>
                        <tbody>
                            ${data.map(t => {
                                const stName = getShortTeam(t[2]);
                                const statusRaw = (t[9] || '').toString().trim().toLowerCase();
                                const status = statusRaw.startsWith('qual') ? 'Q' : statusRaw.startsWith('elim') ? 'E' : '';
                                return `
                                <tr class="border-t border-[var(--glass-border)] cursor-pointer hover:bg-white/5 active-scale transition-colors ${t[0]<=4?'bg-emerald-500/5':''}" onclick="setTeamTheme('${stName}')">
                                    <td class="p-3 text-center font-cyber font-bold ${t[0]<=4?'text-emerald-500':'text-[var(--text4)]'}">${t[0]}</td>
                                    <td class="p-3 font-bold text-[var(--text1)] flex items-center gap-2"><span class="w-2 h-2 rounded-full flex-shrink-0" style="background:${TEAM_COLORS[stName]||'#fff'}"></span><span class="truncate">${t[2]}</span></td>
                                    <td class="p-3 text-center text-[var(--text3)]">${t[3]}</td><td class="p-3 text-center font-bold text-emerald-400">${t[4]}</td><td class="p-3 text-center font-bold text-red-400">${t[5] || '0'}</td><td class="p-3 text-right font-cyber font-black text-[var(--text1)]">${t[7]}</td><td class="p-3 text-right font-bold ${parseFloat(t[8])>=0?'text-emerald-400':'text-red-400'}">${t[8] || '0.000'}</td><td class="p-3 text-center font-cyber font-black ${status==='Q'?'text-emerald-400':status==='E'?'text-red-400':'text-[var(--text4)]'}">${status || '—'}</td>
                                </tr>`;
                            }).join('')}
                        </tbody>
                    </table>
                </div>`;
        }

        function showSearchOverlay() { document.getElementById('search-overlay').classList.remove('hidden'); const header = document.getElementById('main-header'); if (header) header.style.zIndex = '2001'; }
        function hideSearchOverlay() { document.getElementById('search-overlay').classList.add('hidden'); document.getElementById('search-dropdown').style.display = 'none'; const header = document.getElementById('main-header'); if (header) header.style.zIndex = ''; }
        function onSearchInput(q) {
            const dd = document.getElementById('search-dropdown'), query = q.trim().toLowerCase();
            if(!query || !window._state?.rosRows) { dd.style.display='none'; return; }
            const results = window._state.rosRows.filter(r=>r[0]&&!r[1].includes('owner')).map(r=>({name:r[0], owner:r[1], team:r[4], pts: window._state.pPoints[fixID(r[0])]?.act||0}))
                .filter(p=>p.name.toLowerCase().includes(query) || p.owner.toLowerCase().includes(query)).sort((a,b)=>b.pts-a.pts).slice(0,8);
            dd.style.display='block';
            dd.innerHTML = results.map(p=>`
                <div class="p-3 border-b border-[var(--glass-border)] cursor-pointer hover:bg-white/5 active-scale flex justify-between items-center" onclick="document.getElementById('player-search').value=''; hideSearchOverlay(); switchTab('main'); const c=document.getElementById('c-${fixID(p.owner).replace(/\s+/g,'-')}'); if(c){c.scrollIntoView({behavior:'smooth'}); c.classList.add('border-yellow-500'); setTimeout(()=>c.classList.remove('border-yellow-500'), 1500);} window.showPlayerStats('${p.name.replace(/'/g, "\\'")}');">
                    <div><p class="text-xs font-bold text-[var(--text1)]">${p.name}</p><p class="text-[8px] font-bold text-[var(--text4)] uppercase mt-0.5">${p.team} · ${p.owner}</p></div>
                    <p class="font-cyber text-sm font-black" style="color:${window.getColor(p.owner)}">${p.pts}</p>
                </div>`).join('');
            if(!results.length) dd.innerHTML=`<div class="p-4 text-center text-[10px] text-[var(--text4)]">No results</div>`;
        }
        document.addEventListener('click', e => { if (!e.target.closest('#search-container')) { hideSearchOverlay(); } });

        // --- THE NEW INSTAGRAM STORY SHARE CARD GENERATOR ---
        async function shareCard(cID, ownerFull, score, rank) {
            window.haptic(30);
            const color = window.getColor(ownerFull);
            const squad = (window._state.squads[fixID(ownerFull)]||[]).sort((a,b)=>b.act-a.act);
            const mvp = squad[0];
            
            const W = 1080;
            const H = 1920;
            
            const canvas = document.createElement('canvas');
            canvas.width = W; canvas.height = H;
            const ctx = canvas.getContext('2d');
            
            // Custom Rounded Rectangle Polyfill for Maximum Canvas Compatibility
            const roundRect = (x, y, w, h, r) => {
                ctx.beginPath(); ctx.moveTo(x+r, y); ctx.lineTo(x+w-r, y); ctx.quadraticCurveTo(x+w, y, x+w, y+r);
                ctx.lineTo(x+w, y+h-r); ctx.quadraticCurveTo(x+w, y+h, x+w-r, y+h); ctx.lineTo(x+r, y+h);
                ctx.quadraticCurveTo(x, y+h, x, y+h-r); ctx.lineTo(x, y+r); ctx.quadraticCurveTo(x, y, x+r, y); ctx.closePath();
            };

            // 1. Deep Space Background
            const bg = ctx.createLinearGradient(0,0,0,H);
            bg.addColorStop(0, '#020617'); bg.addColorStop(1, '#0f172a');
            ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
            
            // 2. Giant Glow Orb (Owner Color)
            const glow = ctx.createRadialGradient(W/2, 400, 0, W/2, 400, 800);
            glow.addColorStop(0, color + '55');
            glow.addColorStop(1, 'transparent');
            ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);

            // 3. Watermark Initials
            const parts = ownerFull.split(' ').filter(Boolean);
            const initials = parts.length > 1 ? (parts[0][0] + parts[1][0]) : (parts[0] ? parts[0].substring(0,2) : 'UN');
            ctx.font = '900 600px system-ui, -apple-system, sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.02)';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(initials.toUpperCase(), W/2, 450);
            ctx.textBaseline = 'alphabetic'; // reset
            
            // 4. Header Top Bar
            ctx.fillStyle = color; ctx.fillRect(0, 0, W, 16);
            ctx.font = '900 28px system-ui, -apple-system, sans-serif'; ctx.fillStyle = '#f1c40f'; ctx.textAlign = 'center';
            ctx.fillText('R E V O L U T I O N   I P L   2 0 2 6', W/2, 100);
            
            // 5. Rank Badge
            ctx.fillStyle = color + '22';
            roundRect(W/2 - 140, 160, 280, 50, 25); ctx.fill();
            ctx.strokeStyle = color + '88'; ctx.lineWidth = 2; ctx.stroke();
            ctx.font = '800 22px system-ui, -apple-system, sans-serif'; ctx.fillStyle = color;
            ctx.fillText(`CURRENT RANK: #${rank}`, W/2, 194);
            
            // 6. Main Owner Text
            ctx.font = '900 100px system-ui, -apple-system, sans-serif'; ctx.fillStyle = '#f8fafc';
            ctx.fillText(ownerFull.toUpperCase(), W/2, 320);
            
            // 7. Score
            ctx.font = '900 160px system-ui, -apple-system, sans-serif'; ctx.fillStyle = color;
            ctx.fillText(score, W/2, 490);
            ctx.font = '800 24px system-ui, -apple-system, sans-serif'; ctx.fillStyle = '#94a3b8';
            ctx.fillText('TOTAL SEASON POINTS', W/2, 540);
            
            // 8. Frosted Glass Container
            const pY = 640;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
            roundRect(80, pY, W-160, H - pY - 120, 40); ctx.fill();
            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2; ctx.stroke();
            
            // 9. MVP Box
            if(mvp) {
                ctx.fillStyle = 'rgba(255,255,255,0.04)';
                roundRect(120, pY + 40, W-240, 140, 24); ctx.fill();
                ctx.strokeStyle = 'rgba(241,196,15,0.2)'; ctx.lineWidth = 1; ctx.stroke();
                
                ctx.textAlign = 'left';
                ctx.font = '800 22px system-ui, -apple-system, sans-serif'; ctx.fillStyle = '#f1c40f';
                ctx.fillText('⭐ SQUAD MVP', 160, pY + 85);
                
                ctx.font = '900 44px system-ui, -apple-system, sans-serif'; ctx.fillStyle = '#f8fafc';
                ctx.fillText(mvp.name.toUpperCase(), 160, pY + 145);
                
                ctx.textAlign = 'right';
                ctx.font = '900 54px system-ui, -apple-system, sans-serif'; ctx.fillStyle = '#f1c40f';
                ctx.fillText(mvp.act, W - 160, pY + 145);
                ctx.font = '800 20px system-ui, -apple-system, sans-serif'; ctx.fillStyle = '#94a3b8';
                ctx.fillText('PTS', W - 160, pY + 85);
            }
            
            // 10. Squad List (2 Columns)
            ctx.textAlign = 'left';
            ctx.font = '800 22px system-ui, -apple-system, sans-serif'; ctx.fillStyle = '#94a3b8';
            ctx.fillText('FULL SQUAD', 120, pY + 250);
            
            ctx.strokeStyle = 'rgba(255,255,255,0.1)'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(120, pY + 270); ctx.lineTo(W-120, pY + 270); ctx.stroke();
            
            let listY = pY + 330;
            const colWidth = (W - 280) / 2;
            
            squad.slice(1).forEach((p, i) => {
                const isLeft = i % 2 === 0;
                const x = isLeft ? 120 : 120 + colWidth + 40;
                const y = listY + Math.floor(i / 2) * 75;
                
                const isCVC = p.cvc ? true : false;
                ctx.fillStyle = isCVC ? color : '#e2e8f0';
                ctx.font = `${isCVC ? '800' : '600'} 26px system-ui, -apple-system, sans-serif`;
                
                const tag = p.cvc ? ` [${p.cvc}]` : '';
                ctx.textAlign = 'left';
                
                // Truncate long names slightly to fit column perfectly
                let dispName = p.name;
                if(dispName.length > 14) dispName = dispName.substring(0, 12) + '..';
                
                ctx.fillText(`${dispName}${tag}`, x, y);
                
                ctx.textAlign = 'right';
                ctx.fillStyle = isCVC ? color : '#94a3b8';
                ctx.font = `800 26px system-ui, -apple-system, sans-serif`;
                ctx.fillText(`${p.act}`, x + colWidth - 20, y);
            });
            
            // 11. Footer
            ctx.textAlign = 'center';
            ctx.fillStyle = '#64748b'; ctx.font = '800 24px system-ui, -apple-system, sans-serif';
            ctx.fillText(`🏏 ${SITE_URL}`, W/2, H - 50);

            const filename = `revo-${ownerFull.toLowerCase().replace(/\s/g,'-')}.png`;
            const shareText = `${ownerFull} is ranked #${rank} with ${score} pts 🏏\nMVP: ${mvp?.name||'—'}\n\n🔗 ${SITE_URL}`;
            
            if (navigator.share && navigator.canShare) {
                try {
                    const blob = await new Promise(res=>canvas.toBlob(res,'image/png'));
                    const file = new File([blob], filename, {type:'image/png'});
                    if(navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:`${ownerFull} — Revolution IPL`, text:shareText}); return; }
                } catch(e) { if(e.name==='AbortError') return; }
            }
            const a = document.createElement('a'); a.download = filename; a.href = canvas.toDataURL('image/png'); a.click();
        }

        function fireConfetti(){
            const colors=['#f1c40f','#3498db','#2ecc71','#e74c3c'];
            for(let i=0;i<60;i++){
                const el=document.createElement('div'), size=Math.random()*6+4;
                el.style.cssText=`position:fixed;z-index:9999;width:${size}px;height:${size}px;background:${colors[Math.floor(Math.random()*colors.length)]};left:${window.innerWidth/2+(Math.random()-0.5)*100}px;top:0;border-radius:50%;pointer-events:none;`;
                document.body.appendChild(el);
                let posX=parseFloat(el.style.left), posY=0, velY=-(Math.random()*6+4), vx=(Math.random()-0.5)*10, life=0;
                const tick=()=>{ life++; posX+=vx; velY+=0.4; posY+=velY; el.style.transform=`translate(${posX-parseFloat(el.style.left)}px, ${posY}px)`; if(posY<window.innerHeight) requestAnimationFrame(tick); else el.remove(); };
                requestAnimationFrame(tick);
            }
        }

        updateApp();
        setInterval(updateApp, 60000);
        setTimeout(dismissSplash, 6000);
        
        window.addEventListener('scroll',()=>{
            const btn = document.getElementById('scroll-top-btn');
            if(btn) btn.style.display = window.scrollY > 300 ? 'flex' : 'none';
        }, {passive:true});
    </script>
