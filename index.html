<script>
    const SHEET_ID             = '1xIRCNr0tteFfMk6l7inIkKeSJMb7WLBswsXepHRqjio';
    const TOTAL_SEASON_MATCHES = 74;

    const ownerColors = {
        vedant:'#3498db', deep:'#e74c3c',    shlok:'#2ecc71',
        rahul:'#9b59b6',  soni:'#f1c40f',    dheer:'#e67e22',
        kunal:'#1abc9c',  puneet:'#ff9f43',  vivek:'#54a0ff',
        bokaria:'#5f27cd',prakshal:'#48dbfb', rishi:'#ff6b6b',
        aamer:'#1dd1a1',  yashshah:'#f368e0', jash:'#e67e22',
    };

    function getColor(raw) {
        const n = fixID(raw);
        if (ownerColors[n]) return ownerColors[n];
        for (const w of n.split(/\s+/)) if (ownerColors[w]) return ownerColors[w];
        if (ownerColors[n.replace(/\s/g,'')]) return ownerColors[n.replace(/\s/g,'')];
        return '#64748b';
    }
    const fixID = s => s ? s.toString().toLowerCase().trim() : '';

    const IPL_TEAMS = {
        MI:{color:'#004BA0',accent:'#89CFF0'}, CSK:{color:'#F4C430',accent:'#ffffff'},
        RCB:{color:'#C8102E',accent:'#FFD700'}, KKR:{color:'#3A225D',accent:'#B8960C'},
        SRH:{color:'#F26522',accent:'#1a1a1a'}, DC:{color:'#00529A',accent:'#E8001C'},
        PBKS:{color:'#ED1C24',accent:'#DCDDDF'}, RR:{color:'#EA1A85',accent:'#254AA5'},
        GT:{color:'#1D4E89',accent:'#C8A84B'}, LSG:{color:'#A4D65E',accent:'#1a1a1a'},
    };

    function teamBadgeSVG(code, size=110) {
        const t = IPL_TEAMS[code]; if (!t) return '';
        const fs = code.length <= 2 ? 22 : code.length === 3 ? 18 : 14;
        return `<svg viewBox="0 0 100 115" width="${size}" height="${size}" xmlns="http://www.w3.org/2000/svg">
            <defs><linearGradient id="sg${code}" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="${t.color}" stop-opacity="0.9"/>
                <stop offset="100%" stop-color="${t.color}" stop-opacity="0.5"/>
            </linearGradient></defs>
            <path d="M50 4 L92 18 L92 54 C92 80 50 110 50 110 C50 110 8 80 8 54 L8 18 Z"
                  fill="url(#sg${code})" stroke="${t.accent}" stroke-width="2" stroke-opacity="0.6"/>
            <text x="50" y="${fs<=14?62:60}" text-anchor="middle" font-family="Orbitron,sans-serif"
                  font-size="${fs}" font-weight="900" fill="${t.accent}" fill-opacity="0.95" letter-spacing="1">${code}</text>
        </svg>`;
    }

    function getDominantTeams(squad) {
        if (!squad || !squad.length) return [];
        const counts = {};
        squad.forEach(p => { const t=(p.team||'').toString().trim().toUpperCase(); if(t) counts[t]=(counts[t]||0)+1; });
        const max = Math.max(...Object.values(counts));
        return Object.entries(counts).filter(([,v])=>v===max).map(([t])=>t).filter(t=>IPL_TEAMS[t]);
    }

    // ── SPLASH ──
    function dismissSplash() {
        const s = document.getElementById('splash');
        s.classList.add('hide');
        setTimeout(() => s.remove(), 900);
    }
    setTimeout(dismissSplash, 5000);

    const TAB_ORDER = ['main','livepoints','strategy','weekly','schedule','standings','hof','gems'];
    let _currentTab = 'main';

    function switchTab(t, animate) {
        const views = { main:'view-main', livepoints:'view-livepoints', strategy:'view-strategy', weekly:'view-weekly', schedule:'view-schedule', standings:'view-standings', hof:'view-hof', gems:'view-gems' };
        const btns  = { main:'btn-main', livepoints:'btn-livepoints', strategy:'btn-strat', weekly:'btn-weekly', schedule:'btn-schedule', standings:'btn-standings', hof:'btn-hof', gems:'btn-gems' };
        Object.keys(views).forEach(k => {
            const el = document.getElementById(views[k]);
            if (k === t) {
                el.classList.remove('hidden');
                if (animate) {
                    el.style.animation = 'none';
                    el.offsetHeight; // reflow
                    el.style.animation = 'slideIn 0.25s ease-out';
                }
            } else {
                el.classList.add('hidden');
            }
            document.getElementById(btns[k]).classList.toggle('active', k === t);
        });
        _currentTab = t;
        // Scroll tab button into view
        const btn = document.getElementById(btns[t]);
        if (btn) btn.scrollIntoView({ inline:'center', behavior:'smooth', block:'nearest' });
    }



    function showError(msg) {
        document.getElementById('error-msg').textContent = msg || 'Could not reach the data sheet. Retrying in 60s…';
        document.getElementById('error-banner').classList.remove('hidden');
    }
    function hideError() { document.getElementById('error-banner').classList.add('hidden'); }

    function renderSkeleton() {
        document.getElementById('podium-area').innerHTML = `
            <div style="display:flex;justify-content:center;align-items:flex-end;gap:12px;width:100%;height:192px;">
                <div class="w-1/3"><div class="skel w-full h-24" style="border-radius:12px 12px 0 0"></div></div>
                <div class="w-1/3"><div class="skel w-full h-40" style="border-radius:12px 12px 0 0"></div></div>
                <div class="w-1/3"><div class="skel w-full h-16" style="border-radius:12px 12px 0 0"></div></div>
            </div>`;
        document.getElementById('leaderboard').innerHTML = Array.from({length:6}).map(()=>`
            <div class="skel-card">
                <div class="flex items-center gap-5"><div class="skel w-4 h-4 rounded"></div><div class="skel w-28 h-3 rounded"></div></div>
                <div class="skel w-12 h-6 rounded"></div>
            </div>`).join('');
        document.getElementById('mvp-spotlight').innerHTML = `
            <div class="skel-card mb-6" style="border-radius:20px;padding:15px 20px;">
                <div><div class="skel w-32 h-2 rounded mb-3"></div><div class="skel w-40 h-5 rounded mb-2"></div><div class="skel w-24 h-2 rounded"></div></div>
                <div class="skel w-14 h-8 rounded"></div>
            </div>`;
    }

    async function fetchSheet(name) {
        const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=0&sheet=${encodeURIComponent(name)}`;
        const r = await fetch(url);
        if (!r.ok) throw new Error(`Sheet fetch failed: ${name} (${r.status})`);
        const t = await r.text();
        const j = JSON.parse(t.substr(47).slice(0,-2));
        return j.table.rows.map(row => row.c.map(cell => cell ? (cell.v !== null ? cell.v : '') : ''));
    }

    async function fetchFirstAvailableSheet(names) {
        for (const n of names) {
            try {
                const rows = await fetchSheet(n);
                return rows;
            } catch (_) {}
        }
        return [];
    }

    // Global state — used by shareCard
    let _state = { squads:{}, cumulScores:{}, completedMatches:[] };

    async function updateApp() {
        hideError();
        if (!document.getElementById('leaderboard').querySelector('.glass-card')) renderSkeleton();

        try {
            const [lbRows, rosRows, pcRows, schedRows, standRows, liveRows] = await Promise.all([
                fetchSheet('Leaderboard'),
                fetchSheet('Roster'),
                fetchSheet('PointsCalc'),
                fetchSheet('Schedule').catch(() => []),
                fetchSheet('Standings').catch(() => []),
                fetchFirstAvailableSheet(['LiveScore','Livescore','livescore','LIVESCORE']).catch(() => []),
            ]);

            // Completed matches
            const completedMatches = [...new Set(
                pcRows.filter(r => r[0] && parseFloat(r[6]) > 0).map(r => r[0].toString().trim())
            )];
            document.getElementById('match-counter').innerText = `MATCHES: ${completedMatches.length}/${TOTAL_SEASON_MATCHES}`;

            // Player cumulative points
            const pPoints = {};
            pcRows.forEach(row => {
                if (!row[1]) return;
                const k = fixID(row[1]);
                const v = parseFloat(row[6]) || 0;
                const m = parseFloat(row[5]) || 1;
                if (!pPoints[k]) pPoints[k] = { act:0, raw:0 };
                pPoints[k].act += v;
                pPoints[k].raw += (v / m);
            });

            // Last match MVP
            let matchPlayers = [], lastMatchName = '';
            if (pcRows.length) {
                lastMatchName = pcRows[pcRows.length-1][0];
                pcRows.forEach(r => {
                    if (r[0] === lastMatchName)
                        matchPlayers.push({ name:r[1], pts:parseFloat(r[6])||0, owner:r[2] });
                });
            }

            // Squads
            const squads = {};
            rosRows.forEach(row => {
                const oKey = fixID(row[1]);
                if (!oKey || oKey.includes('owner')) return;
                if (!squads[oKey]) squads[oKey] = [];
                const stats = pPoints[fixID(row[0])] || { act:0, raw:0 };
                squads[oKey].push({
                    name:row[0], team:row[4], role:row[6],
                    act:Math.round(stats.act), raw:stats.raw,
                    cvc: parseFloat(row[2])===2 ? 'C' : parseFloat(row[2])===1.5 ? 'VC' : ''
                });
            });

            // Owners
            let owners = lbRows.map(row => {
                const full = row[0] ? row[0].toString().trim() : '';
                const id   = full.toLowerCase();
                if (!full || ['owner name','owner','name'].includes(id)) return null;
                return { full, score: Math.round(parseFloat(row[1]))||0, id, first:full.split(' ')[0] };
            }).filter(Boolean);

            const active  = owners.filter(o => o.id !== 'unsold').sort((a,b) => b.score - a.score);
            const unsold  = owners.find(o => o.id === 'unsold');
            const allOwners = unsold ? [...active, unsold] : active;

            // Build cumulative scores (for streak + sparklines)
            const cumulScores = buildCumulScores(active, pcRows, completedMatches);

            // Save to global state
            _state = { squads, cumulScores, completedMatches, rosRows, pPoints, pcRows, active, schedRows };

            // Render
            renderMVP(matchPlayers.sort((a,b) => b.pts-a.pts)[0], lastMatchName);
            renderPodium(active);
            renderStreakTracker(active, cumulScores, completedMatches);
            renderLeaderboard(allOwners, squads, cumulScores);
            renderStrategy(active, squads);
            if (schedRows && schedRows.length) {
                window._schedRows = schedRows;
                renderSchedule(schedRows);
            }
            renderTodayBar(schedRows || []);
            renderWeekly(active, pcRows, completedMatches, squads);
            renderRankArrows(active);
            if (!window._confettiFired) { window._confettiFired = true; setTimeout(fireConfetti, 800); }
            renderStandings(standRows || []);
            renderMatchDayBanner(active, pcRows, completedMatches);
            renderLastMatchLeaderboard(active, pcRows, completedMatches);
            renderHallOfFame(active, pcRows, completedMatches, squads);
            renderGems(rosRows, pPoints, squads);
            renderLivePoints(liveRows || []);

        } catch(e) {
            console.error('Sync Error:', e);
            showError(e.message || 'Could not reach the data sheet. Retrying in 60s…');
        }
    }

    function buildCumulScores(owners, pcRows, completedMatches) {
        const cumul   = {}, running = {};
        owners.forEach(o => { cumul[o.id]=[]; running[o.id]=0; });

        const nameToId = {};
        owners.forEach(o => {
            nameToId[fixID(o.full)]  = o.id;
            nameToId[fixID(o.first)] = o.id;
            nameToId[o.id]           = o.id;
        });

        completedMatches.forEach(matchName => {
            const totals = {};
            pcRows
                .filter(r => r[0] && r[0].toString().trim() === matchName && r[2])
                .forEach(r => {
                    const raw = fixID(r[2]);
                    const id  = nameToId[raw]
                        || owners.find(o => raw.includes(o.id) || o.id.includes(raw))?.id;
                    if (!id) return;
                    totals[id] = (totals[id]||0) + (parseFloat(r[6])||0);
                });
            owners.forEach(o => {
                running[o.id] += (totals[o.id]||0);
                cumul[o.id].push(Math.round(running[o.id]));
            });
        });
        return cumul;
    }

    function renderMVP(mvp, matchName) {
        const el = document.getElementById('mvp-spotlight');
        if (!mvp || !mvp.owner) { el.innerHTML=''; return; }
        const color = getColor(mvp.owner);
        el.innerHTML = `
            <div class="mvp-banner flex justify-between items-center">
                <div>
                    <p class="text-[8px] font-black text-yellow-500 uppercase tracking-widest mb-1">MATCH HERO • ${matchName}</p>
                    <h2 class="text-xl font-black uppercase italic tracking-tighter">${mvp.name}</h2>
                    <p class="text-[10px] font-bold opacity-60 uppercase">OWNED BY <span style="color:${color}">${mvp.owner}</span></p>
                </div>
                <div class="text-right">
                    <p class="font-cyber text-2xl gold-glow font-black italic tracking-tighter">${mvp.pts}</p>
                    <p class="text-[8px] font-bold opacity-40 uppercase">POINTS</p>
                </div>
            </div>`;
    }

    function renderPodium(top) {
        const pod = document.getElementById('podium-area');
        if (top.length < 3) { pod.innerHTML=''; return; }
        pod.innerHTML = `
            <div class="w-1/3 flex flex-col items-center">
                <span class="text-[9px] font-cyber mb-2 opacity-60 uppercase">${top[1].first}</span>
                <div class="podium-pillar pillar-rise w-full h-24 rounded-t-2xl" style="animation-delay:0.15s">
                    <span class="font-cyber text-lg mt-4">${top[1].score}</span>
                    <div class="podium-rank-label">2ND</div>
                </div>
            </div>
            <div class="w-1/3 flex flex-col items-center">
                <span class="text-[10px] font-cyber mb-2 gold-glow italic uppercase tracking-widest">${top[0].first}</span>
                <div class="podium-pillar pillar-rise w-full h-40 rounded-t-2xl shadow-[0_-10px_30px_rgba(241,196,15,0.1)]" style="animation-delay:0s">
                    <div class="trophy-bg"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18,2H6V4H2V9C2,12 4.24,14.64 7.28,14.94C8.25,17.29 10.3,19 12.82,19.26V22H10V24H14V22H11.18V19.26C13.7,19 15.75,17.29 16.72,14.94C19.76,14.64 22,12 22,9V4H18V2M4,9V6H6V12.75C4.83,12.28 4,11.23 4,9M18,12.75V6H20V9C20,11.23 19.17,12.28 18,12.75Z"/></svg></div>
                    <span class="font-cyber text-2xl font-black relative z-10 mt-12">${top[0].score}</span>
                    <div class="podium-rank-label">1ST</div>
                </div>
            </div>
            <div class="w-1/3 flex flex-col items-center">
                <span class="text-[9px] font-cyber mb-2 opacity-60 uppercase">${top[2].first}</span>
                <div class="podium-pillar pillar-rise w-full h-16 rounded-t-2xl" style="animation-delay:0.3s">
                    <span class="font-cyber text-base text-gray-400 mt-2">${top[2].score}</span>
                    <div class="podium-rank-label">3RD</div>
                </div>
            </div>`;
    }

    function renderStreakTracker(owners, cumulScores, completedMatches) {
        const el = document.getElementById('streak-tracker');
        if (!el || completedMatches.length === 0) return;

        const leadCount = {};
        owners.forEach(o => leadCount[o.id] = 0);
        for (let m = 0; m < completedMatches.length; m++) {
            let best=-1, bestId=null;
            owners.forEach(o => { const s=(cumulScores[o.id]||[])[m]||0; if(s>best){best=s;bestId=o.id;} });
            if (bestId) leadCount[bestId]++;
        }

        const leader = [...owners].sort((a,b) => b.score-a.score)[0];
        let streak = 0;
        if (leader) {
            for (let m = completedMatches.length-1; m >= 0; m--) {
                let best=-1, bestId=null;
                owners.forEach(o => { const s=(cumulScores[o.id]||[])[m]||0; if(s>best){best=s;bestId=o.id;} });
                if (bestId === leader.id) streak++; else break;
            }
        }

        const sorted = [...owners].sort((a,b) => (leadCount[b.id]||0)-(leadCount[a.id]||0));
        const lc     = leader ? getColor(leader.id) : '#f1c40f';

        el.innerHTML = `
            <div style="background:rgba(10,15,25,0.98);border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:18px 20px;margin-bottom:1rem;">
                <p style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;letter-spacing:0.3em;color:#475569;text-transform:uppercase;margin-bottom:14px;">Streak Tracker</p>
                ${leader && streak > 0 ? `
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid rgba(255,255,255,0.05);">
                    <div>
                        <p style="font-size:9px;font-weight:800;color:#475569;text-transform:uppercase;letter-spacing:0.2em;margin-bottom:3px;">Current Leader Streak</p>
                        <p style="font-family:Orbitron,sans-serif;font-size:13px;font-weight:900;color:${lc};text-transform:uppercase;">${leader.first}</p>
                    </div>
                    <div style="text-align:right;">
                        <p style="font-family:Orbitron,sans-serif;font-size:28px;font-weight:900;color:${lc};line-height:1;">${streak}</p>
                        <p style="font-size:8px;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:0.2em;">match days</p>
                    </div>
                </div>` : ''}
                <div style="display:flex;flex-direction:column;gap:8px;">
                    ${sorted.slice(0,5).map((o,i) => {
                        const c=getColor(o.id), cnt=leadCount[o.id]||0;
                        const pct=Math.round((cnt/completedMatches.length)*100);
                        return `<div style="display:flex;align-items:center;gap:10px;">
                            <span style="font-size:8px;font-weight:900;color:#334155;width:14px;">${i+1}</span>
                            <span style="font-size:10px;font-weight:800;color:#94a3b8;text-transform:uppercase;flex:1;">${o.first}</span>
                            <div style="flex:2;background:rgba(255,255,255,0.04);border-radius:4px;height:4px;overflow:hidden;">
                                <div style="height:100%;width:${pct}%;background:${c};border-radius:4px;transition:width 0.8s ease;"></div>
                            </div>
                            <span style="font-family:Orbitron,sans-serif;font-size:9px;font-weight:900;color:${c};min-width:28px;text-align:right;">${cnt}d</span>
                        </div>`;
                    }).join('')}
                </div>
            </div>`;
    }

    // ── TODAY'S MATCH BAR ──
    function renderTodayBar(schedRows) {
        const el = document.getElementById('today-match-bar');
        if (!el) return;

        // Collect today's matches from live schedule rows
        const todayMatches = [];
        const rows = schedRows && schedRows.length ? schedRows : [];

        rows.forEach(r => {
            if (!r[1]) return;
            const d = parseDate(r[1]);
            if (d.ts && isToday(d.ts)) {
                const t1 = toCode((r[3]||'').toString().trim());
                const t2 = toCode((r[4]||'').toString().trim());
                todayMatches.push({ t1, t2, date: d.display, day: d.dayStr, m: r[0] });
            }
        });

        // Fallback to hardcoded schedule
        if (!todayMatches.length) {
            SCHEDULE.forEach(m => {
                if (m.dateObj && isToday(m.dateObj.ts))
                    todayMatches.push({ t1: m.t1, t2: m.t2, date: m.dateObj.display, day: m.dateObj.dayStr, m: m.m });
            });
        }

        if (!todayMatches.length) {
            el.innerHTML = '';
            return;
        }

        const now = new Date();
        const dayNames = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
        const dayFull  = dayNames[now.getDay()];
        const dateStr  = todayMatches[0].date;

        el.innerHTML = todayMatches.map(tm => {
            const c1 = TEAM_COLORS[tm.t1] || '#f1c40f';
            const c2 = TEAM_COLORS[tm.t2] || '#f1c40f';
            return `
            <div style="
                position:relative;overflow:hidden;border-radius:18px;
                background:rgba(10,15,25,0.95);
                border:1px solid rgba(241,196,15,0.25);
                padding:13px 18px;margin-bottom:0;
                box-shadow:0 0 20px rgba(241,196,15,0.08), inset 0 1px 0 rgba(255,255,255,0.04);
            ">
                <!-- neon top line -->
                <div style="position:absolute;top:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(241,196,15,0.6),transparent);animation:neonPulse 2s ease-in-out infinite;"></div>

                <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;">

                    <!-- Date + day block -->
                    <div style="flex-shrink:0;text-align:left;">
                        <p style="font-family:Orbitron,sans-serif;font-size:7px;font-weight:900;letter-spacing:0.3em;color:#475569;text-transform:uppercase;">Today</p>
                        <p style="font-family:Orbitron,sans-serif;font-size:11px;font-weight:900;color:#f1c40f;line-height:1.2;">${dateStr}</p>
                        <p style="font-size:8px;font-weight:700;color:#334155;text-transform:uppercase;letter-spacing:0.15em;">${dayFull}</p>
                    </div>

                    <!-- Team 1 -->
                    <div style="flex:1;text-align:right;">
                        <p style="font-family:Orbitron,sans-serif;font-size:16px;font-weight:900;
                           color:${c1};text-shadow:0 0 12px ${c1}88;
                           letter-spacing:0.05em;">${tm.t1}</p>
                    </div>

                    <!-- VS -->
                    <div style="flex-shrink:0;text-align:center;padding:0 6px;">
                        <p style="font-family:Orbitron,sans-serif;font-size:9px;font-weight:900;color:#1e293b;letter-spacing:0.1em;">VS</p>
                    </div>

                    <!-- Team 2 -->
                    <div style="flex:1;text-align:left;">
                        <p style="font-family:Orbitron,sans-serif;font-size:16px;font-weight:900;
                           color:${c2};text-shadow:0 0 12px ${c2}88;
                           letter-spacing:0.05em;">${tm.t2}</p>
                    </div>

                    <!-- Live indicator -->
                    <div style="flex-shrink:0;display:flex;align-items:center;gap:5px;">
                        <span style="width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block;animation:livePulse 1.2s ease-in-out infinite;box-shadow:0 0 6px #4ade80;"></span>
                        <span style="font-family:Orbitron,sans-serif;font-size:7px;font-weight:900;color:#4ade80;letter-spacing:0.15em;">LIVE</span>
                    </div>

                </div>

                <!-- neon bottom line -->
                <div style="position:absolute;bottom:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(241,196,15,0.3),transparent);"></div>
            </div>`;
                    }).join('<div style="height:6px;"></div>');
    }

    // ── TODAY'S PLAYING TEAMS ──
    function todaysTeams() {
        const rows = _state.schedRows || [];
        const today = new Date();
        const playing = new Set();
        rows.forEach(r => {
            if (!r[1]) return;
            const d = parseDate(r[1]);
            if (d.ts && isToday(d.ts)) {
                const t1 = toCode((r[3]||'').toString().trim());
                const t2 = toCode((r[4]||'').toString().trim());
                if (t1) playing.add(t1.toUpperCase());
                if (t2) playing.add(t2.toUpperCase());
            }
        });
        // Fallback: use hardcoded SCHEDULE if sheet not available
        if (!playing.size) {

                }
            });
        }
        return playing;
    }

    async function shareCard(cID, ownerFull, score, rank) {
        const color = getColor(cID.replace('c-','').replace(/-/g,' '));
        const squad = (_state.squads[fixID(ownerFull)] || []).sort((a,b) => b.act - a.act);

        // Identify C and VC
        const captain = squad.find(p => p.cvc === 'C');
        const vice    = squad.find(p => p.cvc === 'VC');

        // Canvas dimensions — extra rows for C/VC block + URL footer
        const PLAYER_ROW_H = 24;
        const W  = 600;
        const H  = 240                          // header block
                 + 50                           // C/VC block
                 + 16                           // divider gap
                 + Math.max(squad.length,1) * PLAYER_ROW_H
                 + 60;                          // footer

        const canvas = document.createElement('canvas');
        canvas.width = W*2; canvas.height = H*2;
        const ctx = canvas.getContext('2d');
        ctx.scale(2,2);

        // ── Background ──
        const bg = ctx.createLinearGradient(0,0,W,H);
        bg.addColorStop(0,'#0f172a'); bg.addColorStop(1,'#020617');
        ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

        // Top accent bar
        ctx.fillStyle = color; ctx.fillRect(0,0,W,4);

        // Glow blob
        const glow = ctx.createRadialGradient(W*0.78,H*0.2,0,W*0.78,H*0.2,200);
        glow.addColorStop(0, color+'28'); glow.addColorStop(1,'transparent');
        ctx.fillStyle = glow; ctx.fillRect(0,0,W,H);

        // ── Rank ──
        ctx.font = '700 10px monospace'; ctx.fillStyle = color+'99';
        ctx.fillText(`RANK #${rank}  ·  REVOLUTION IPL 2026`, 28, 46);

        // ── Owner name ──
        ctx.font = '900 28px monospace'; ctx.fillStyle = '#f8fafc';
        ctx.fillText(ownerFull.toUpperCase(), 28, 80);

        // ── Score (right-aligned) ──
        ctx.font = '900 44px monospace'; ctx.fillStyle = color;
        ctx.textAlign = 'right';
        ctx.fillText(score, W-28, 80);
        ctx.textAlign = 'left';

        // ── Sub label ──
        ctx.font = '600 9px monospace'; ctx.fillStyle = '#334155';
        ctx.fillText('TOTAL POINTS', 28, 100);

        // ── Divider ──
        ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(28,114); ctx.lineTo(W-28,114); ctx.stroke();

        // ── C / VC block ──
        let cy = 138;
        if (captain || vice) {
            // C badge
            if (captain) {
                ctx.font = '900 10px monospace'; ctx.fillStyle = color;
                ctx.fillText('C', 28, cy);
                ctx.font = '700 11px monospace'; ctx.fillStyle = '#94a3b8';
                ctx.fillText(captain.name, 44, cy);
                ctx.font = '900 10px monospace'; ctx.fillStyle = color;
                ctx.textAlign = 'right';
                ctx.fillText(`${captain.act} pts`, W/2-10, cy);
                ctx.textAlign = 'left';
            }
            // VC badge
            if (vice) {
                ctx.font = '900 10px monospace'; ctx.fillStyle = '#94a3b8';
                ctx.fillText('VC', W/2+10, cy);
                ctx.font = '700 11px monospace'; ctx.fillStyle = '#64748b';
                ctx.fillText(vice.name, W/2+34, cy);
                ctx.font = '900 10px monospace'; ctx.fillStyle = '#64748b';
                ctx.textAlign = 'right';
                ctx.fillText(`${vice.act} pts`, W-28, cy);
                ctx.textAlign = 'left';
            }
            cy += 20;
        }

        // ── Squad divider ──
        ctx.strokeStyle = 'rgba(255,255,255,0.05)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(28, cy); ctx.lineTo(W-28, cy); ctx.stroke();
        cy += 16;

        // ── Squad label ──
        ctx.font = '700 8px monospace'; ctx.fillStyle = '#334155';
        ctx.fillText('FULL SQUAD', 28, cy);
        ctx.textAlign = 'right';
        ctx.fillText('PTS', W-28, cy);
        ctx.textAlign = 'left';
        cy += 18;

        // ── Players ──
        squad.forEach((p, i) => {
            const y = cy + i * PLAYER_ROW_H;
            // C/VC tag inline
            const tag = p.cvc ? ` [${p.cvc}]` : '';
            ctx.font = `${p.cvc ? '800' : '500'} 11px monospace`;
            ctx.fillStyle = p.cvc ? color : (i%2===0 ? '#94a3b8' : '#64748b');
            ctx.fillText(`${p.name}${tag}  (${p.team})`, 28, y);
            ctx.font = `${p.cvc ? '900' : '700'} 11px monospace`;
            ctx.fillStyle = p.cvc ? color : '#475569';
            ctx.textAlign = 'right';
            ctx.fillText(`${p.act}`, W-28, y);
            ctx.textAlign = 'left';
        });

        // ── Footer: site URL ──
        const footerY = H - 28;
        ctx.strokeStyle = 'rgba(255,255,255,0.04)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(28, footerY-14); ctx.lineTo(W-28, footerY-14); ctx.stroke();

        ctx.font = '700 9px monospace'; ctx.fillStyle = color+'bb';
        ctx.fillText(`🏏 ${SITE_URL}`, 28, footerY);
        ctx.font = '600 8px monospace'; ctx.fillStyle = '#1e293b';
        ctx.textAlign = 'right';
        ctx.fillText('REVOLUTION • VEDANT BHANSALI EDITION', W-28, footerY);
        ctx.textAlign = 'left';

        const filename = `revo-${ownerFull.toLowerCase().replace(/\s/g,'-')}.png`;
        const shareText = `${ownerFull} is ranked #${rank} with ${score} pts 🏏\nC: ${captain?.name||'—'}  |  VC: ${vice?.name||'—'}\n\n🔗 ${SITE_URL}`;

        // Mobile: Web Share API
        if (navigator.share && navigator.canShare) {
            try {
                const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
                const file = new File([blob], filename, { type:'image/png' });
                if (navigator.canShare({ files:[file] })) {
                    await navigator.share({
                        files: [file],
                        title: `${ownerFull} — Revolution IPL 2026`,
                        text:  shareText,
                    });
                    return;
                }
            } catch(e) {
                if (e.name === 'AbortError') return;
            }
        }

        // Desktop fallback: download
        const a = document.createElement('a');
        a.download = filename;
        a.href = canvas.toDataURL('image/png');
        a.click();
    }

    // ── CONFETTI BURST ──
    function fireConfetti() {
        const colors = ['#f1c40f','#3498db','#2ecc71','#e74c3c','#9b59b6','#f368e0','#1abc9c','#ff9f43'];
        const count  = 90;
        const origin = { x: window.innerWidth/2, y: 0 };

        for (let i = 0; i < count; i++) {
            const el   = document.createElement('div');
            const size = Math.random()*8+4;
            const col  = colors[Math.floor(Math.random()*colors.length)];
            const isRect = Math.random() > 0.5;
            el.style.cssText = `
                position:fixed;z-index:9999;pointer-events:none;
                width:${isRect?size+'px':'6px'};height:${isRect?size*0.4+'px':size+'px'};
                background:${col};border-radius:${isRect?'1px':'50%'};
                left:${origin.x + (Math.random()-0.5)*120}px;
                top:${origin.y}px;opacity:1;`;
            document.body.appendChild(el);

            const angle  = (Math.random()*160 + 10) * Math.PI/180;
            const speed  = Math.random()*12+6;
            const vx     = Math.cos(angle)*speed*(Math.random()>0.5?1:-1);
            const vy     = Math.sin(angle)*speed+4;
            const spin   = (Math.random()-0.5)*20;
            let   posX   = parseFloat(el.style.left);
            let   posY   = parseFloat(el.style.top);
            let   velY   = -vy;
            let   rot    = 0;
            let   life   = 0;
            const maxLife = 80 + Math.floor(Math.random()*40);

            const tick = () => {
                life++;
                posX  += vx * 0.6;
                velY  += 0.35;
                posY  += velY;
                rot   += spin;
                const opacity = Math.max(0, 1 - life/maxLife);
                el.style.left      = posX + 'px';
                el.style.top       = posY + 'px';
                el.style.opacity   = opacity;
                el.style.transform = `rotate(${rot}deg)`;
                if (life < maxLife && posY < window.innerHeight + 40) requestAnimationFrame(tick);
                else el.remove();
            };
            setTimeout(() => requestAnimationFrame(tick), i * 12);
        }
    }

    // ── SCHEDULE DATA ──
    // Results known up to Match 16 (Apr 5, 2026). Today = Apr 5 2026.
    const SCHEDULE = [
      {m:1,  date:'28 Mar',day:'Sat', t1:'RCB',  t2:'SRH',  venue:'Bengaluru',      winner:'RCB',  result:'RCB won by 6 wkts'},
      {m:2,  date:'29 Mar',day:'Sun', t1:'MI',   t2:'KKR',  venue:'Mumbai',         winner:'MI',   result:'MI won by 7 wkts'},
      ...
      {m:74, date:'31 May',day:'Sun', t1:'TBD',  t2:'TBD',  venue:'TBD',            winner:null,   result:'FINAL'},
    ];

    const TEAM_COLORS = {
        RCB:'#C8102E', MI:'#004BA0', CSK:'#F4C430', KKR:'#3A225D',
        SRH:'#F26522', RR:'#EA1A85', PBKS:'#ED1C24', GT:'#1D4E89',
        LSG:'#A4D65E', DC:'#00529A', TBD:'#334155'
    };

    // ── SCHEDULE HELPERS ──
    const TEAM_NAME_MAP = {
        'royal challengers bengaluru':'RCB','royal challengers bangalore':'RCB',
        'mumbai indians':'MI','chennai super kings':'CSK',
        'kolkata knight riders':'KKR','sunrisers hyderabad':'SRH',
        'rajasthan royals':'RR','punjab kings':'PBKS',
        'gujarat titans':'GT','lucknow super giants':'LSG','delhi capitals':'DC',
    };
    const MONTH_SHORT = {
        'jan':'Jan','feb':'Feb','mar':'Mar','apr':'Apr','may':'May','jun':'Jun',
        'jul':'Jul','aug':'Aug','sep':'Sep','oct':'Oct','nov':'Nov','dec':'Dec'
    };
    const DAY_NAMES = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];

    function toCode(raw) {
        if (!raw) return 'TBD';
        const s = raw.toString().trim();
        const low = s.toLowerCase();
        if (TEAM_NAME_MAP[low]) return TEAM_NAME_MAP[low];
        if (s.length <= 4) return s.toUpperCase();
        return s; // fallback keep as-is, truncate in render
    }

    // Parse "28-Mar-2026" → { display:"28 Mar", month:"Apr 2026", dayStr:"Sat", ts:Date }
    function parseDate(raw) {
        if (!raw) return { display:'TBD', month:'Playoffs', dayStr:'', ts:null };
        const s = raw.toString().trim();

        // Handle GViz Date(yyyy,m,d) just in case
        const gm = s.match(/Date\((\d+),(\d+),(\d+)\)/);
        if (gm) {
            const dt = new Date(+gm[1], +gm[2], +gm[3]);
            return {
                display: String(dt.getDate()).padStart(2,'0') + ' ' + MONTH_SHORT[dt.toLocaleString('en',{month:'short'}).toLowerCase()],
                month:   dt.toLocaleString('en',{month:'short'}) + ' ' + dt.getFullYear(),
                dayStr:  DAY_NAMES[dt.getDay()], ts: dt
            };
        }

        // Handle "28-Mar-2026"
        const dm = s.match(/(\d{1,2})-([A-Za-z]+)-(\d{4})/);
        if (dm) {
            const d = parseInt(dm[1]), monStr = dm[2].toLowerCase(), y = parseInt(dm[3]);
            const monIdx = Object.keys(MONTH_SHORT).indexOf(monStr);
            const dt = new Date(y, monIdx >= 0 ? monIdx : 0, d);
            return {
                display: String(d).padStart(2,'0') + ' ' + (MONTH_SHORT[monStr] || dm[2]),
                month:   (MONTH_SHORT[monStr] || dm[2]) + ' ' + y,
                dayStr:  DAY_NAMES[dt.getDay()], ts: dt
            };
        }

        // Handle "2026-03-28"
        const iso = s.match(/(\d{4})-(\d{2})-(\d{2})/);
                    if (iso) {
                const dt = new Date(+iso[1], +iso[2]-1, +iso[3]);
                const mon = MONTH_SHORT[dt.toLocaleString('en',{month:'short'}).toLowerCase()];
                return {
                    display: String(dt.getDate()).padStart(2,'0') + ' ' + mon,
                    month:   mon + ' ' + dt.getFullYear(),
                    dayStr:  DAY_NAMES[dt.getDay()], ts: dt
                };
            }

            return { display: s, month: 'Upcoming', dayStr:'', ts:null };
        }

        // Shorten result: "Royal Challengers Bengaluru won by 43 runs" → "won by 43 runs"
        // or "Chennai Super Kings won by 5 wickets" → "won by 5 wkts"
        function shortResult(raw, winnerFull) {
            if (!raw) return '';
            let s = raw.toString().trim();
            // Remove the winning team name from the front
            if (winnerFull) {
                const re = new RegExp('^' + winnerFull.replace(/[.*+?^${}()|[\]\\]/g,'\\$&') + '\\s*', 'i');
                s = s.replace(re, '');
            }
            // Normalise "wickets" → "wkts", "runs" stays
            s = s.replace(/\bwickets\b/gi,'wkts').replace(/\bwicket\b/gi,'wkt');
            // Trim
            return s.length > 28 ? s.substring(0,26) + '…' : s;
        }

        function isToday(ts) {
            if (!ts) return false;
            const now = new Date();
            return ts.getDate()===now.getDate() && ts.getMonth()===now.getMonth() && ts.getFullYear()===now.getFullYear();
        }

        function renderSchedule(rows) {
            const el = document.getElementById('schedule-list');
            let matches = SCHEDULE; // hardcoded fallback

            if (rows && rows.length > 0) {
                const parsed = rows
                    .filter(r => r[0] && !isNaN(parseInt(r[0])))
                    .map(r => {
                        const dateObj    = parseDate(r[1]);
                        const t1Full     = (r[3] || '').toString().trim();
                        const t2Full     = (r[4] || '').toString().trim();
                        const winnerFull = (r[6] || '').toString().trim();
                        return {
                            m:       parseInt(r[0]),
                            dateObj,
                            t1:      toCode(t1Full),
                            t2:      toCode(t2Full),
                            winner:  winnerFull ? toCode(winnerFull) : null,
                            winFull: winnerFull,
                            result:  shortResult(r[7], winnerFull),
                        };
                    });
                if (parsed.length > 0) matches = parsed;
            }

            // Convert hardcoded SCHEDULE entries to same shape if using fallback
            if (matches === SCHEDULE) {
                matches = SCHEDULE.map(m => ({
                    ...m,
                    dateObj: parseDate(m.date + (m.date !== 'TBD' ? '-2026' : '')),
                    winFull: m.winner, result: m.result,
                }));
            }

            // Group by month
            const groups = {};
            matches.forEach(m => {
                const key = m.dateObj ? m.dateObj.month : 'Playoffs';
                if (!groups[key]) groups[key] = [];
                groups[key].push(m);
            });

        // ── PLAYER SEARCH ──
        let _allPlayers = [];

        function buildPlayerIndex() {
            const { rosRows, pPoints } = _state;
            if (!rosRows) return;
            _allPlayers = [];
            rosRows.forEach(row => {
                const name  = (row[0] || '').toString().trim();
                const owner = (row[1] || '').toString().trim();
                const team  = (row[4] || '').toString().trim();
                const role  = (row[6] || '').toString().trim();
                if (!name || fixID(owner).includes('owner')) return;
                const stats = pPoints[fixID(name)] || { act: 0 };
                _allPlayers.push({ name, owner, team, role, pts: Math.round(stats.act) });
            });
        }

        function onSearchInput(q) {
            const dd = document.getElementById('search-dropdown');
            buildPlayerIndex();
            const query = q.trim().toLowerCase();
            if (!query) { dd.style.display = 'none'; return; }

            const results = _allPlayers
                .filter(p => p.name.toLowerCase().includes(query) || p.team.toLowerCase().includes(query))
                .sort((a, b) => b.pts - a.pts)
                .slice(0, 12);

            if (!results.length) {
                dd.style.display = 'block';
                dd.innerHTML = `<div style="padding:14px 16px;font-size:11px;color:#475569;text-align:center;">No players found</div>`;

                const prev = _prevRanks[o.id];

                    const arrow = document.createElement('span');

                    arrow.style.cssText = `font-size:10px;font-weight:900;color:${up?'#4ade80':'#f87171'};opacity:1;transition:opacity 2s ease;`;
                    rankEl.appendChild(arrow);
                    setTimeout(() => arrow.style.opacity = '0', 2500);
                    setTimeout(() => arrow.remove(), 4500);
                }
                _prevRanks[o.id] = curr;
            });
        }

        // ── WEEKLY REPORT ──
        function renderWeekly(active, pcRows, completedMatches, squads) {
            const el = document.getElementById('weekly-list');
            if (!el || !completedMatches.length) return;

            const last7 = completedMatches.slice(-7);
            const all   = completedMatches;

            const weeklyData = active.map(o => {
                let weekPts = 0, bestPlayer = null, bestPts = 0;
                pcRows.forEach(r => {
                    if (!r[1] || !r[2]) return;
                    const ownerRaw = fixID(r[2]);
                    const isOwner  = ownerRaw === o.id ||
                                     ownerRaw.includes(o.id.split(' ')[0]) ||
                                     o.id.includes(ownerRaw.split(' ')[0]);
                    if (!isOwner) return;
                    const pts   = parseFloat(r[6]) || 0;
                    const match = r[0] ? r[0].toString().trim() : '';
                    if (last7.includes(match)) {
                        weekPts += pts;
                        if (pts > bestPts) { bestPts = pts; bestPlayer = r[1]; }
                    }
                });

                const avgMatch = all.length > 0 ? o.score / all.length : 0;
                const weekAvg  = last7.length > 0 ? weekPts / last7.length : 0;
                const trend    = weekAvg > avgMatch ? 'hot' : weekAvg < avgMatch * 0.8 ? 'cold' : 'steady';
                return { ...o, weekPts: Math.round(weekPts), avgMatch: Math.round(avgMatch), weekAvg: Math.round(weekAvg), trend, bestPlayer, bestPts: Math.round(bestPts) };
            }).sort((a, b) => b.weekPts - a.weekPts);

            // Header banner
            const headerHTML = `
                <div style="background:rgba(10,15,25,0.98);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:16px 20px;margin-bottom:1rem;position:relative;overflow:hidden;">

                </div>`;

            const cardsHTML = weeklyData.map((d, i) => {
                const color   = getColor(d.id);
                const tIcon   = d.trend === 'hot' ? '🔥' : d.trend === 'cold' ? '🧊' : '➡️';
                const tColor  = d.trend === 'hot' ? '#4ade80' : d.trend === 'cold' ? '#60a5fa' : '#94a3b8';

                return `
                <div style="
                    background:rgba(10,15,25,0.98);
                    border:1px solid ${isLeader ? color+'55' : 'rgba(255,255,255,0.07)'};

                    padding:16px 20px;

                ">
                    <!-- owner color glow bg -->
                    <div style="position:absolute;right:-20px;top:-20px;width:100px;height:100px;border-radius:50%;background:${color};opacity:0.04;pointer-events:none;filter:blur(20px);"></div>

                    <!-- rank + name + trend row -->
                    <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px;position:relative;z-index:1;">
                        <div style="display:flex;align-items:center;gap:10px;">
                            <span style="font-family:Orbitron,sans-serif;font-size:${isLeader?'16':'11'}px;font-weight:900;color:${isLeader?color:'#334155'};${isLeader?'text-shadow:0 0 10px '+color+'66;':''}">
                                ${isLeader ? '👑' : i+1}
                            </span>

                                <p style="font-family:Orbitron,sans-serif;font-size:13px;font-weight:900;color:#f1f5f9;text-transform:uppercase;letter-spacing:0.05em;">${d.first}</p>

                                    ${tIcon} <span style="color:${tColor}">${d.trend.toUpperCase()}</span>
                                    <span style="color:#334155;margin:0 4px;">·</span>
                                    <span>${d.weekAvg} avg/match</span>
                                </p>

        // ── SCHEDULE TEAM FILTER ──
        let _schedTeamFilter = 'ALL';
        let _schedSearchQuery = '';

        function setSchedFilter(team) {
            _schedTeamFilter = team;
            document.querySelectorAll('.sched-pill').forEach(b => {
                b.classList.toggle('active', b.dataset.team === team);
            });
            applyScheduleFilter();
        }

        function filterSchedule() {
            // kept for compatibility — no search box anymore
            applyScheduleFilter();
        }

        function applyScheduleFilter() {
            const rows  = document.querySelectorAll('#schedule-list .sched-match-row');
            let visible = 0;

            rows.forEach(row => {
                const t1    = (row.dataset.t1 || '').toUpperCase();
                const t2    = (row.dataset.t2 || '').toUpperCase();
                const teams = t1 + ' ' + t2;
                const full  = (row.dataset.full || '').toLowerCase();

                let show = true;
                if (_schedTeamFilter !== 'ALL') {
                    show = t1 === _schedTeamFilter || t2 === _schedTeamFilter;
                }
                if (_schedSearchQuery) {
                    show = teams.toLowerCase().includes(_schedSearchQuery) ||
                           full.includes(_schedSearchQuery);
                }

                row.style.display = show ? '' : 'none';
                if (show) visible++;
            });

            // Update count label
            const countEl = document.getElementById('sched-count');
            if (countEl) {
                const label = _schedTeamFilter !== 'ALL'
                    ? `${visible} matches for ${_schedTeamFilter}`
                    : _schedSearchQuery
                        ? `${visible} matches found`
                        : `${visible} matches total`;
                countEl.textContent = label;
            }

            // Show/hide month headers that have no visible children
            document.querySelectorAll('#schedule-list .sched-month-group').forEach(group => {
                const visibleInGroup = group.querySelectorAll('.sched-match-row:not([style*="display: none"]):not([style*="display:none"])').length;
                group.style.display = visibleInGroup > 0 ? '' : 'none';
            });

            // Update stats bar: played / remaining
            const statsEl = document.getElementById('sched-stats');
            if (statsEl) {
                const allVisible = Array.from(rows).filter(r => r.style.display !== 'none');
                const played    = allVisible.filter(r => r.dataset.done === '1').length;
                const remaining = allVisible.length - played;
                const teamLabel = _schedTeamFilter !== 'ALL' ? _schedTeamFilter + ' — ' : '';
                statsEl.innerHTML = `
                    <div style="display:flex;align-items:center;gap:5px;">
                        <span style="width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block;"></span>
                        <span style="font-family:Orbitron,sans-serif;font-size:7px;font-weight:900;color:#4ade80;letter-spacing:0.15em;">${played} PLAYED</span>
                    </div>
                    <span style="font-size:8px;color:#1e293b;">|</span>
                    <div style="display:flex;align-items:center;gap:5px;">
                        <span style="width:7px;height:7px;border-radius:50%;background:#f1c40f;display:inline-block;"></span>
                        <span style="font-family:Orbitron,sans-serif;font-size:7px;font-weight:900;color:#f1c40f;letter-spacing:0.15em;">${remaining} REMAINING</span>
                    </div>`;
            }
        }


        // ── SCROLL TO TOP ──

        }, { passive: true });

        // ── MATCH DAY WINNER BANNER ──
        function renderMatchDayBanner(active, pcRows, completedMatches) {
            if (!completedMatches.length) return;
            const lastMatch = completedMatches[completedMatches.length - 1];

            // Sum each owner's points in the last match
            const matchTotals = {};
            const nameToId = {};
            active.forEach(o => {
                nameToId[fixID(o.full)] = o.id;
                nameToId[fixID(o.first)] = o.id;
                nameToId[o.id] = o.id;
                matchTotals[o.id] = 0;
            });
            pcRows.filter(r => r[0] && r[0].toString().trim() === lastMatch).forEach(r => {
                const raw = fixID(r[2]);
                const id  = nameToId[raw] || active.find(o => raw.includes(o.id) || o.id.includes(raw))?.id;
                if (id) matchTotals[id] = (matchTotals[id] || 0) + (parseFloat(r[6]) || 0);
            });

            const sorted = Object.entries(matchTotals).sort((a,b) => b[1]-a[1]);
            if (!sorted.length || sorted[0][1] === 0) return;

            const winnerId = sorted[0][0];
            const winner   = active.find(o => o.id === winnerId);
            const pts      = Math.round(sorted[0][1]);
            if (!winner) return;

            const color = getColor(winnerId);
            const mvpEl = document.getElementById('mvp-spotlight');
            if (!mvpEl) return;

            // Insert match day banner right after MVP spotlight
            let banner = document.getElementById('matchday-winner-banner');
            if (!banner) {
                banner = document.createElement('div');
                banner.id = 'matchday-winner-banner';
                mvpEl.parentNode.insertBefore(banner, mvpEl.nextSibling);
            }
            banner.innerHTML = `
                <div style="background:rgba(10,15,25,0.98);border:1px solid ${color}44;border-left:3px solid ${color};border-radius:18px;padding:12px 18px;margin-bottom:0;position:relative;overflow:hidden;">
                    <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,${color}88,transparent);"></div>
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div>
                            <p style="font-family:Orbitron,sans-serif;font-size:7px;font-weight:900;letter-spacing:0.3em;color:#475569;text-transform:uppercase;margin-bottom:3px;">🏅 Match Day Winner · ${lastMatch}</p>
                            <p style="font-family:Orbitron,sans-serif;font-size:14px;font-weight:900;color:${color};text-transform:uppercase;">${winner.full}</p>
                        </div>
                        <div style="text-align:right;">
                            <p style="font-family:Orbitron,sans-serif;font-size:22px;font-weight:900;color:${color};text-shadow:0 0 10px ${color}66;line-height:1;">${pts}</p>
                            <p style="font-size:7px;color:#334155;text-transform:uppercase;font-weight:700;letter-spacing:0.1em;">match pts</p>
                        </div>
                    </div>
                </div>`;
        }

        // ── LAST MATCH LEADERBOARD (inside streak tracker) ──
        function renderLastMatchLeaderboard(active, pcRows, completedMatches) {
            if (!completedMatches.length) return;
            const lastMatch = completedMatches[completedMatches.length - 1];
            const nameToId  = {};
            active.forEach(o => {
                nameToId[fixID(o.full)]  = o.id;
                nameToId[fixID(o.first)] = o.id;
                nameToId[o.id]           = o.id;
            });
            const totals = {};
            active.forEach(o => totals[o.id] = 0);
            pcRows.filter(r => r[0] && r[0].toString().trim() === lastMatch).forEach(r => {
                const raw = fixID(r[2]);
                const id  = nameToId[raw] || active.find(o => raw.includes(o.id) || o.id.includes(raw))?.id;
                if (id) totals[id] = (totals[id]||0) + (parseFloat(r[6])||0);
            });
            const sorted = active.map(o => ({ ...o, matchPts: Math.round(totals[o.id]||0) })).sort((a,b)=>b.matchPts-a.matchPts);
            const maxPts = sorted[0]?.matchPts || 1;

            const streakEl = document.getElementById('streak-tracker');
            if (!streakEl) return;
            let miniLb = document.getElementById('mini-match-lb');
            if (!miniLb) {
                miniLb = document.createElement('div');
                miniLb.id = 'mini-match-lb';
                streakEl.appendChild(miniLb);
            }
            miniLb.innerHTML = `
                <div style="background:rgba(10,15,25,0.98);border:1px solid rgba(255,255,255,0.07);border-radius:20px;padding:18px 20px;margin-top:1rem;">
                    <p style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;letter-spacing:0.3em;color:#475569;text-transform:uppercase;margin-bottom:14px;">Last Match · ${lastMatch}</p>
                    <div style="display:flex;flex-direction:column;gap:8px;">
                        ${sorted.map((o,i) => {
                            const c = getColor(o.id);
                            const pct = maxPts > 0 ? Math.round((o.matchPts/maxPts)*100) : 0;
                            return `<div style="display:flex;align-items:center;gap:10px;">
                                <span style="font-size:8px;font-weight:900;color:${i===0?c:'#334155'};width:14px;">${i+1}</span>
                                <span style="font-size:10px;font-weight:800;color:${i===0?'#f1f5f9':'#94a3b8'};text-transform:uppercase;flex:1;">${o.first}</span>
                                <div style="flex:2;background:rgba(255,255,255,0.04);border-radius:4px;height:4px;overflow:hidden;">
                                    <div style="height:100%;width:${pct}%;background:${c};border-radius:4px;transition:width 0.8s ease;"></div>
                                </div>
                                <span style="font-family:Orbitron,sans-serif;font-size:9px;font-weight:900;color:${c};min-width:36px;text-align:right;">${o.matchPts}</span>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
        }

        // ── HALL OF FAME ──
        function renderHallOfFame(active, pcRows, completedMatches, squads) {
            const el = document.getElementById('hof-list');
            if (!el) return;

            // Build per-owner match day totals
            const nameToId = {};
            active.forEach(o => {
                nameToId[fixID(o.full)]  = o.id;
                nameToId[fixID(o.first)] = o.id;
                nameToId[o.id]           = o.id;
            });

            // Best single match score per owner
            const bestMatch   = {};  // { ownerId: { pts, matchName } }
            // Best single player score ever
            let bestPlayer    = { name:'—', pts:0, owner:'—', match:'—' };
            // Biggest comeback (most ranks gained in one match)
            const matchRanks  = {};  // matchName → sorted owner ranking

            completedMatches.forEach(matchName => {
                const matchTotals = {};
                active.forEach(o => matchTotals[o.id] = 0);
                pcRows.filter(r => r[0] && r[0].toString().trim() === matchName).forEach(r => {
                    const raw = fixID(r[2]);
                    const id  = nameToId[raw] || active.find(o => raw.includes(o.id) || o.id.includes(raw))?.id;
                    if (!id) return;
                    const pts = parseFloat(r[6]) || 0;
                    matchTotals[id] = (matchTotals[id]||0) + pts;
                    // Check best individual player
                    if (pts > bestPlayer.pts) {
                        bestPlayer = { name: r[1], pts: Math.round(pts), owner: r[2], match: matchName };
                    }
                });
                active.forEach(o => {
                    const pts = Math.round(matchTotals[o.id]||0);
                    if (!bestMatch[o.id] || pts > bestMatch[o.id].pts) {
                        bestMatch[o.id] = { pts, matchName };
                    }
                });
                matchRanks[matchName] = Object.entries(matchTotals).sort((a,b)=>b[1]-a[1]).map(([id])=>id);
            });

            // Biggest single match score across all owners
            const allBest = Object.entries(bestMatch).sort((a,b)=>b[1].pts-a[1].pts);
            const topOwner = allBest[0] ? active.find(o=>o.id===allBest[0][0]) : null;
            const topColor = topOwner ? getColor(topOwner.id) : '#f1c40f';

            // Most match day wins
            const dayWins = {};
            active.forEach(o => dayWins[o.id] = 0);
            completedMatches.forEach(m => {
                const ranks = matchRanks[m];
                if (ranks && ranks[0]) dayWins[ranks[0]] = (dayWins[ranks[0]]||0)+1;
            });
            const topDayWinner = Object.entries(dayWins).sort((a,b)=>b[1]-a[1])[0];
            const dayWinOwner  = topDayWinner ? active.find(o=>o.id===topDayWinner[0]) : null;

            el.innerHTML = `
                <div style="background:rgba(10,15,25,0.98);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:14px 20px;margin-bottom:12px;position:relative;overflow:hidden;">
                    <div style="position:absolute;top:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(241,196,15,0.5),transparent);"></div>
                    <p style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;letter-spacing:0.35em;color:#475569;text-transform:uppercase;margin-bottom:2px;">Season</p>
                    <p style="font-family:Orbitron,sans-serif;font-size:13px;font-weight:900;color:#f1c40f;">Hall of Fame</p>
                </div>

                ${[
                    // Best single match score
                    topOwner ? {
                        icon:'🔥', label:'Highest Single Match Score',
                        name: topOwner.full, value: allBest[0][1].pts + ' pts',
                        sub: allBest[0][1].matchName, color: topColor
                    } : null,
                    // Best individual player performance
                    bestPlayer.pts > 0 ? {
                        icon:'⭐', label:'Best Individual Player',
                        name: bestPlayer.name, value: bestPlayer.pts + ' pts',
                        sub: `${bestPlayer.match} · Owned by ${bestPlayer.owner}`, color: getColor(bestPlayer.owner)
                    } : null,
                    // Most match day wins
                    dayWinOwner ? {
                        icon:'🏅', label:'Most Match Day Wins',
                        name: dayWinOwner.full, value: topDayWinner[1] + ' days',
                        sub: `out of ${completedMatches.length} match days`, color: getColor(dayWinOwner.id)
                    } : null,
                    // Highest season score (current #1)
                    active[0] ? {
                        icon:'👑', label:'Overall Season Leader',
                        name: active[0].full, value: active[0].score + ' pts',
                        sub: 'total this season', color: getColor(active[0].id)
                    } : null,
                ].filter(Boolean).map(card => `
                    <div style="background:rgba(10,15,25,0.98);border:1px solid ${card.color}33;border-left:3px solid ${card.color};border-radius:18px;padding:14px 18px;margin-bottom:8px;position:relative;overflow:hidden;">
                        <div style="position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:32px;opacity:0.07;pointer-events:none;">${card.icon}</div>
                        <p style="font-family:Orbitron,sans-serif;font-size:7px;font-weight:900;letter-spacing:0.25em;color:#475569;text-transform:uppercase;margin-bottom:4px;">${card.icon} ${card.label}</p>
                        <div style="display:flex;justify-content:space-between;align-items:baseline;">
                            <p style="font-size:13px;font-weight:900;color:${card.color};text-transform:uppercase;text-shadow:0 0 8px ${card.color}44;">${card.name}</p>
                            <p style="font-family:Orbitron,sans-serif;font-size:16px;font-weight:900;color:${card.color};">${card.value}</p>
                        </div>
                        <p style="font-size:8px;color:#334155;margin-top:3px;">${card.sub}</p>
                    </div>`).join('')}

                <!-- Per-owner best match scores -->
                <div style="background:rgba(10,15,25,0.98);border:1px solid rgba(255,255,255,0.07);border-radius:18px;padding:16px 18px;margin-top:4px;">
                    <p style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;letter-spacing:0.25em;color:#475569;text-transform:uppercase;margin-bottom:12px;">Personal Bests</p>
                    ${allBest.map(([id, data]) => {
                        const o = active.find(x=>x.id===id);
                        if (!o) return '';
                        const c = getColor(id);
                        return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                            <div>
                                <span style="font-size:11px;font-weight:800;color:#94a3b8;text-transform:uppercase;">${o.first}</span>
                                <span style="font-size:8px;color:#334155;margin-left:6px;">${data.matchName}</span>
                            </div>
                            <span style="font-family:Orbitron,sans-serif;font-size:11px;font-weight:900;color:${c};">${data.pts}</span>
                        </div>`;
                    }).join('')}
                </div>`;
        }

        // ── UNSOLD GEMS ──
        function renderGems(rosRows, pPoints, squads) {
            const el = document.getElementById('gems-list');
            if (!el) return;

            // Collect all owned player names
            const ownedNames = new Set();
            Object.values(squads).forEach(sq => sq.forEach(p => ownedNames.add(fixID(p.name))));

            // Find Unsold/unowned players with points
            const gems = [];
            rosRows.forEach(row => {
                const name  = (row[0] || '').toString().trim();
                const owner = fixID(row[1] || '');
                const team  = (row[4] || '').toString().trim();
                const role  = (row[6] || '').toString().trim();
                if (!name) return;
                // Include if owner is 'unsold' OR player has no owner
                if (owner !== 'unsold' && owner !== '' && !owner.includes('unsold')) return;
                const stats = pPoints[fixID(name)] || { act: 0 };
                if (stats.act > 0) gems.push({ name, team, role, pts: Math.round(stats.act) });
            });

            gems.sort((a,b) => b.pts - a.pts);

            const totalMissed = gems.reduce((s,g) => s+g.pts, 0);

            el.innerHTML = `
                <div style="background:rgba(10,15,25,0.98);border:1px solid rgba(255,255,255,0.08);border-radius:20px;padding:14px 20px;margin-bottom:12px;position:relative;overflow:hidden;">
                    <div style="position:absolute;top:0;left:16px;right:16px;height:1px;background:linear-gradient(90deg,transparent,rgba(72,219,251,0.5),transparent);"></div>
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div>
                            <p style="font-family:Orbitron,sans-serif;font-size:8px;font-weight:900;letter-spacing:0.35em;color:#475569;text-transform:uppercase;margin-bottom:2px;">💎 Unsold</p>
                            <p style="font-family:Orbitron,sans-serif;font-size:13px;font-weight:900;color:#48dbfb;">Hidden Gems</p>
                        </div>
                        <div style="text-align:right;">
                            <p style="font-family:Orbitron,sans-serif;font-size:18px;font-weight:900;color:#f87171;">${totalMissed}</p>
                            <p style="font-size:7px;color:#334155;text-transform:uppercase;font-weight:700;">pts missed</p>
                        </div>
                    </div>
                </div>
                ${gems.length === 0 ? `<div style="text-align:center;padding:40px;color:#334155;font-family:Orbitron,sans-serif;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;">No unsold players with points yet</div>` :
                gems.map((g, i) => {
                    const tc = TEAM_COLORS[g.team.toUpperCase()] || '#475569';
                    return `
                    <div style="background:rgba(10,15,25,0.98);border:1px solid rgba(72,219,251,${i<3?'0.25':'0.08'});border-left:3px solid ${i<3?'#48dbfb':'rgba(255,255,255,0.06)'};border-radius:14px;padding:12px 16px;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;${i<3?'box-shadow:0 0 12px -4px rgba(72,219,251,0.2);':''}">
                        <div>
                            <div style="display:flex;align-items:center;gap:8px;">
                                <span style="font-size:8px;font-weight:900;color:#334155;">${i+1}</span>
                                <p style="font-size:12px;font-weight:800;color:${i<3?'#f1f5f9':'#94a3b8'};">${g.name}</p>
                            </div>
                            <p style="font-size:8px;font-weight:700;margin-top:2px;">
                                <span style="color:${tc}">${g.team}</span>
                                <span style="color:#334155;margin:0 4px;">·</span>
                                <span style="color:#475569;text-transform:uppercase;">${g.role}</span>
                            </p>
                        </div>
                        <div style="text-align:right;">
                            <p style="font-family:Orbitron,sans-serif;font-size:${i<3?'16':'13'}px;font-weight:900;color:${i<3?'#48dbfb':'#334155'};">${g.pts}</p>
                            <p style="font-size:7px;color:#334155;text-transform:uppercase;">pts</p>
                        </div>
                    </div>`;
                }).join('')}`;
        }

        updateApp();
        startPolling();

        // ── PWA: Register Service Worker ──
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('[PWA] SW registered:', reg.scope))
                    .catch(err => console.warn('[PWA] SW registration failed:', err));
            });
        }

        // ── PWA: Install prompt ──
        let _deferredInstall = null;
        window.addEventListener('beforeinstallprompt', e => {
            e.preventDefault();
            _deferredInstall = e;
            // Show install button after 4s (after confetti settles)
            setTimeout(() => {
                const btn = document.createElement('button');
                btn.textContent = '📲 Add to Home Screen';
                btn.style.cssText = 'position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:500;font-size:10px;font-family:Orbitron,sans-serif;font-weight:900;letter-spacing:0.05em;padding:10px 18px;border-radius:20px;border:1px solid rgba(241,196,15,0.4);background:rgba(10,15,25,0.95);backdrop-filter:blur(12px);color:#f1c40f;cursor:pointer;transition:0.3s;white-space:nowrap;box-shadow:0 0 20px rgba(241,196,15,0.15);';
                btn.onclick = async () => {
                    if (!_deferredInstall) return;
                    _deferredInstall.prompt();
                    const { outcome } = await _deferredInstall.userChoice;
                    _deferredInstall = null;
                    btn.remove();
                };
                document.body.appendChild(btn);
                setTimeout(() => { btn.style.opacity='0'; setTimeout(()=>btn.remove(),500); }, 10000);
            }, 4000);
        });

        // iOS — show manual instructions once
        const isIOS    = /iphone|ipad|ipod/i.test(navigator.userAgent);
        const isStandalone = window.navigator.standalone;
        if (isIOS && !isStandalone && !localStorage.getItem('revo-ios-hint')) {
            setTimeout(() => {
                localStorage.setItem('revo-ios-hint', '1');
                const toast = document.createElement('div');
                toast.style.cssText = 'position:fixed;bottom:28px;left:50%;transform:translateX(-50%);z-index:500;font-size:10px;font-family:Orbitron,sans-serif;font-weight:700;letter-spacing:0.05em;padding:12px 18px;border-radius:18px;border:1px solid rgba(241,196,15,0.3);background:rgba(10,15,25,0.96);backdrop-filter:blur(16px);color:#94a3b8;text-align:center;max-width:280px;line-height:1.5;box-shadow:0 0 20px rgba(0,0,0,0.4);';
                toast.innerHTML = '📲 <span style="color:#f1c40f">Add to Home Screen</span><br>Tap Share → "Add to Home Screen" to install';
                document.body.appendChild(toast);
                setTimeout(() => { toast.style.opacity='0'; toast.style.transition='opacity 0.5s'; setTimeout(()=>toast.remove(),500); }, 7000);
            }, 5000);
        }
    </script>
